.114],"coach|Try next time. Open the prebrief. You chose: Safety and logistics, no team norm. Try full prebrief with team norms instead. You add a team norm that directly targets this group's risk: equal voice.":[808.784,13.01],"coach|Try next time. Open the prebrief. You chose: Familiarity shortcut. Try full prebrief with team norms instead. You add a team norm that directly targets this group's risk: equal voice.":[821.914,12.202],"coach|Gaps observed: IV fixation delayed IM epinephrine. Verbal order without units. Read-back repeated the number, not the meaning. Safety concern voiced as a question and overridden. Tenfold dose given.":[834.236,13.851],"coach|Your instinct. Open the door to feelings before facts.":[848.207,3.312],"coach|Strength. Reactions. Emotion invitation. You name the intensity and give permission for strong feelings.":[851.639,6.577],"coach|Be ready to open space around the strongest word.":[858.336,2.675],"coach|Try next time. Reactions. You chose: One-word check-in. Try emotion invitation instead. You name the intensity and give permission for strong feelings.":[861.132,10.324],"coach|Emotions first, then facts.":[871.576,1.777],"coach|Try next time. Reactions. You chose: Skipped reactions, blame focus. Try emotion invitation instead. You name the intensity and give permission for strong feelings.":[873.473,11.263],"coach|The emotion does not disappear, it goes underground.":[884.856,3.003],"coach|Try next time. Reactions. You chose: Minimizing. Try emotion invitation instead. You name the intensity and give permission for strong feelings.":[887.979,9.876],"coach|Your instinct. Emotion comes before analysis. Validate what they feel, then normalize it.":[897.975,5.748],"coach|This is the fastest route from shame back to reflection.":[903.844,2.958],"coach|Strength. Human factors: shame after an error. Validate and normalize. You validate the emotion, normalize the experience without excusing the error, and reframe the focus to systems and team.":[906.922,12.71],"coach|Pair silence with a validating statement.":[919.752,2.292],"coach|Try next time. Human factors: shame after an error. You chose: Silence, then invitation. Try validate and normalize instead. You validate the emotion, normalize the experience without excusing the error, and reframe the focus to systems and team.":[922.164,16.927],"coach|Her working memory stays busy with shame, so she learns less from everything that follows.":[939.212,4.779],"coach|Try next time. Human factors: shame after an error. You chose: Deferral. Try validate and normalize instead. You validate the emotion, normalize the experience without excusing the error, and reframe the focus to systems and team.":[944.111,15.527],"coach|Try next time. Human factors: shame after an error. You chose: Shame-reinforcing. Try validate and normalize instead. You validate the emotion, normalize the experience without excusing the error, and reframe the focus to systems and team.":[959.757,16.302],"coach|Your instinct. Keep it short, let a learner lead, and check that everyone agrees.":[976.18,4.635],"coach|You check agreement quickly.":[980.934,1.309],"coach|Strength. Description. Learner-led summary, less dominant voice first. Asking the most junior person first flattens hierarchy from the start and prevents the leader's frame from becoming the group's frame.":[982.364,12.535],"coach|Consider starting with someone else.":[995.018,1.675],"coach|Try next time. Description. You chose: Leader summary. Try learner-led summary, less dominant voice first instead. Asking the most junior person first flattens hierarchy from the start and prevents the leader's frame from becoming the group's frame.":[996.813,16.057],"coach|Keep description short and factual.":[1012.99,2.005],"coach|Try next time. Description. You chose: Full replay. Try learner-led summary, less dominant voice first instead. Asking the most junior person first flattens hierarchy from the start and prevents the leader's frame from becoming the group's frame.":[1015.115,15.952],"coach|Your instinct. Working memory is full. Make the plan visible and choose fewer topics.":[1031.188,5.207],"coach|Letting learners choose builds ownership, and their choices usually match your objectives. You can still add a must-cover item.":[1036.515,7.24],"coach|Strength. Too many issues, not enough time. Whiteboard + learner-centred prioritizing. The whiteboard holds the agenda so nobody has to keep it in working memory, which cuts extraneous load.":[1043.875,12.094],"coach|Try next time. Too many issues, not enough time. You chose: Facilitator prioritizing. Try whiteboard + learner-centred prioritizing instead. The whiteboard holds the agenda so nobody has to keep it in working memory, which cuts extraneous load.":[1056.089,16.321],"coach|Depth beats coverage. Pick two and do them well.":[1072.53,2.619],"coach|Try next time. Too many issues, not enough time. You chose: Cover everything. Try whiteboard + learner-centred prioritizing instead. The whiteboard holds the agenda so nobody has to keep it in working memory, which cuts extraneous load.":[1075.269,15.366],"coach|Your instinct. The action only makes sense once you see the thinking behind it. Say what you saw, then get curious.":[1090.755,6.543],"coach|Surfacing the two different mental models shows the team how a read-back can feel closed when it is not.":[1097.418,6.015],"coach|Strength. Issue 1: One point five. Focused facilitation: advocacy-inquiry. You state precisely what you heard, without blame, and ask about meaning.":[1103.553,9.362],"coach|Try next time. Issue 1: One point five. You chose: Learner self-assessment. Try focused facilitation: advocacy-inquiry instead. You state precisely what you heard, without blame, and ask about meaning.":[1113.035,13.4],"coach|Try next time. Issue 1: One point five. You chose: Directive feedback. Try focused facilitation: advocacy-inquiry instead. You state precisely what you heard, without blame, and ask about meaning.":[1126.556,13.003],"coach|He will defend, and the team learns not to be honest.":[1139.679,2.953],"coach|Try next time. Issue 1: One point five. You chose: Judgmental question. Try focused facilitation: advocacy-inquiry instead. You state precisely what you heard, without blame, and ask about meaning.":[1142.752,13.525],"coach|Your instinct. Watch who holds the floor. Give the quieter voice a safe, specific opening.":[1156.398,5.427],"coach|Interrupting a senior respectfully shows the team that hierarchy does not rule this room.":[1161.944,5.139],"coach|Strength. Human factors: the monologue. Respectful interruption + flattening hierarchy. You interrupt early, name your reason, and redirect with body language to the voice that matters most.":[1167.203,11.761],"coach|Try next time. Human factors: the monologue. You chose: Wait, then redirect. Try respectful interruption + flattening hierarchy instead. You interrupt early, name your reason, and redirect with body language to the voice that matters most.":[1179.084,15.705],"coach|Redirect without labelling.":[1194.909,1.504],"coach|Try next time. Human factors: the monologue. You chose: Confrontation. Try respectful interruption + flattening hierarchy instead. You interrupt early, name your reason, and redirect with body language to the voice that matters most.":[1196.532,15.36],"coach|The team's speaking-up gap goes unaddressed.":[1212.012,2.22],"coach|Try next time. Human factors: the monologue. You chose: Collusion by silence. Try respectful interruption + flattening hierarchy instead. You interrupt early, name your reason, and redirect with body language to the voice that matters most.":[1214.352,15.723],"coach|Your instinct. Peers can coach each other. Give them a simple structure so feedback stays curious.":[1230.195,5.83],"coach|Peer feedback from a colleague often lands harder than facilitator feedback, and scaffolding makes it safe for both.":[1236.144,6.634],"coach|Strength. Human factors: peer feedback. Scaffolded peer feedback. You give Chris the advocacy-inquiry structure, which keeps peer feedback specific and curious rather than blaming.":[1242.898,11.108],"coach|A one-line framework makes it land.":[1254.126,1.927],"coach|Try next time. Human factors: peer feedback. You chose: Permission without scaffold. Try scaffolded peer feedback instead. You give Chris the advocacy-inquiry structure, which keeps peer feedback specific and curious rather than blaming.":[1256.172,15.477],"coach|Peer coaching is one of the strongest culture levers you have.":[1271.77,3.491],"coach|Try next time. Human factors: peer feedback. You chose: Shutting down peer coaching. Try scaffolded peer feedback instead. You give Chris the advocacy-inquiry structure, which keeps peer feedback specific and curious rather than blaming.":[1275.38,15.528],"coach|Your instinct. This looks like a clear knowledge gap. Close it with one short, specific teaching point.":[1291.028,5.821],"coach|Directive teaching is the right tool when the gap is factual and the learner asked.":[1296.969,4.628],"coach|Strength. Issue 2: The dose. Directive feedback. Clear, specific, and practical, with a behaviour for next time.":[1301.717,7.176],"coach|Use the whiteboard for shared thinking, not individual testing.":[1309.013,3.435],"coach|Try next time. Issue 2: The dose. You chose: Spotlight quiz. Try directive feedback instead. Clear, specific, and practical, with a behaviour for next time.":[1312.569,10.908],"coach|Try next time. Issue 2: The dose. You chose: Focused facilitation . Try directive feedback instead. Clear, specific, and practical, with a behaviour for next time.":[1323.597,11.305],"coach|Your instinct. Let every learner name their own take-away and a change for practice.":[1335.022,5.049],"coach|You check alignment with all three objectives.":[1340.19,2.435],"coach|Strength. Application and summary. Learner-guided summary + name what was parked. Learners own their commitments, and you close the loop on the parked topic so nothing feels abandoned.":[1342.746,10.947],"coach|Try next time. Application and summary. You chose: Educator-driven summary. Try learner-guided summary + name what was parked instead. Learners own their commitments, and you close the loop on the parked topic so nothing feels abandoned.":[1353.812,14.969],"coach|Ask for commitments instead.":[1368.901,1.524],"coach|Try next time. Application and summary. You chose: Open question close. Try learner-guided summary + name what was parked instead. Learners own their commitments, and you close the loop on the parked topic so nothing feels abandoned.":[1370.546,14.938]},"code-blue":{"narr|Dr. Park checks her pager twice while you gather the group.":[0.0,3.645],"narr|This scenario may end in death. How do you prebrief?":[3.765,3.483],"you|This is practice, and it stays here. We assume everyone is capable and wants to improve. Some scenarios end with a poor outcome by design, never as a judgment of you, and anyone can call a pause. Twelve minutes in the room, 20 to debrief, and please silence pagers now.":[7.368,18.673],"helen|Fine.":[26.16,0.881],"narr|She silences her pager.":[27.161,2.221],"ben|Good to know.":[29.502,1.015],"coach|Strong choice. You forewarn without spoiling, give explicit permission to pause, and remove a known extraneous load .":[30.637,6.967],"you|This is practice, and it stays here. We assume everyone wants to improve. Twelve minutes in the room, then 20 to debrief.":[37.724,7.812],"helen|Let's go.":[45.656,0.917],"coach|Workable. Good basics. Without a heads-up about possible poor outcomes and a pause option, a planned death can land as a personal failure, especially for the newest nurse.":[46.694,10.496],"you|This one's tough. The last group lost the patient, so let's see if you can do better.":[57.31,5.0],"ben|No pressure then.":[62.43,1.347],"coach|Missed opportunity. Competition raises threat and turns a designed outcome into a test they will fail.":[63.897,6.301],"you|Relax, nothing here matters. It's just a manikin.":[70.318,3.162],"raj|Easy day then.":[73.6,1.024],"coach|Missed opportunity. This breaks the fiction contract before it forms. Learners engage less, and those who do feel foolish when emotions arrive.":[74.744,8.718],"narr|Ben finds Mr. Hughes pulseless and starts compressions. Dr. Park arrives at minute 1 and calls immediately for intubation.":[83.582,8.802],"narr|Dr. Patel makes three intubation attempts. Compressions pause for 30 to 45 seconds each time.":[92.505,7.498],"narr|At minute 2 the monitor shows VF. Grace says quietly, I think that's VF, while drawing up epinephrine.":[100.123,7.175],"narr|Dr. Park replies, Airway first. Nobody charges the defibrillator.":[107.418,5.143],"narr|The first shock is delivered at minute 5. No supraglottic airway is tried. The tube goes in on the third attempt at minute 7.":[112.681,8.351],"narr|The rhythm deteriorates to asystole. Dr. Park calls time of death at minute 12.":[121.152,5.653],"narr|Ben steps back from the bed and stands frozen.":[126.925,3.174],"narr|Ben's hands are shaking. Dr. Park is already standing, ready to leave.":[130.219,4.978],"narr|How do you open?":[135.316,1.148],"you|That was a hard ending, and it's normal to feel it. Before anything clinical, I'd like to hear how each of you is doing.":[136.585,7.142],"ben|I feel like we killed him. I was pushing on his chest and nobody shocked.":[143.847,3.941],"helen|Let's not dramatize. It's a sim. Codes are like that.":[147.908,3.03],"grace|Honestly, I'm angry.":[151.057,1.463],"coach|Strong choice. Sitting lowers your status and signals you are staying. Naming the ending as hard gives permission to feel it.":[152.64,7.124],"you|One word each for how you're feeling.":[159.885,2.032],"ben|Guilty.":[162.036,0.796],"grace|Angry.":[162.952,0.775],"raj|Frustrated.":[163.847,0.893],"sofia|Sad.":[164.86,0.531],"coach|Workable. Inclusive and quick. After a death, some learners need more than one word.":[165.511,4.769],"you|Codes on the ward often end this way, so let's move on to what we can learn.":[170.4,4.768],"narr|Ben looks down. Nobody speaks.":[175.287,2.362],"coach|Missed opportunity. Normalizing before listening sounds like dismissal. Ben's distress goes unspoken, and the debrief carries it silently.":[177.769,9.071],"you|Who wants to explain what went wrong?":[186.96,1.927],"helen|Nothing went wrong. He was sick.":[189.007,1.751],"grace|That's not true.":[190.878,1.151],"coach|Missed opportunity. After a death, what went wrong invites blame and self-attack. Start with reactions.":[192.149,6.025],"ben|We killed him.":[198.295,1.05],"helen|It's a sim. We don't need to dramatize.":[199.465,2.163],"narr|Ben is distressed and the senior has dismissed it. What do you do?":[201.748,4.242],"you|Ben, thank you for saying that out loud. Feeling this after a code is normal, and it doesn't mean you did something wrong. Dr. Park, you've led many codes. What helped you after your first ones?":[206.109,12.571],"helen|My first code as a resident, I cried in my car. You don't forget it.":[218.8,3.817],"narr|Ben nods slowly.":[222.737,1.595],"grace|Thanks for saying that.":[224.451,1.356],"coach|Strong choice. You validate Ben, then invite the senior to share her own experience. A senior's story of vulnerability normalizes emotion more powerfully than yours can, and it moves her from dismissing to supporting.":[225.927,13.854],"you|Ben, thank you for sharing that. Those feelings are completely normal.":[239.902,4.137],"ben|Thanks.":[244.159,0.696],"narr|Dr. Park checks her watch.":[244.974,1.902],"coach|Workable. Good validation. Leaving Dr.":[246.996,2.712],"you|Dr. Park's right, it's only a sim. Let's move on.":[249.828,3.322],"narr|Ben goes silent for the rest of the debrief.":[253.27,3.034],"coach|Missed opportunity. This invalidates Ben and confirms that emotion is unwelcome. The newest nurse learns to hide distress, the opposite of what safe teams need.":[256.424,10.402],"you|Ben, maybe take a few minutes outside and come back when you're ready.":[266.945,3.708],"ben|...Okay.":[270.773,0.92],"narr|He leaves. The group loses its compressor's view.":[271.813,3.106],"coach|Missed opportunity. Offering a pause is fine, but directing him out isolates him and removes him from the learning.":[275.039,6.936],"narr|How do you establish the facts?":[282.095,1.844],"you|Sofia, could you give a short summary of what happened and what rhythm we were dealing with? Does everyone agree?":[284.058,6.256],"sofia|Arrest, we went for the airway, VF around minute 2, shock at 5, three tube attempts, then asystole and time of death.":[290.434,6.674],"grace|Yes. VF was there early.":[297.228,1.867],"coach|Strong choice. Asking the RT, who had a view of the monitor and the airway, gives a balanced account and avoids the leader's frame.":[299.215,7.866],"you|Let's watch the full video from start to finish.":[307.201,2.753],"narr|Twelve minutes pass. Ben watches the floor.":[310.074,2.895],"coach|Missed opportunity. Twelve minutes of video uses most of your debrief and forces a replay of a death.":[313.089,5.926],"you|Let me recap the facts: arrest at 0, VF at 2, first shock at 5, time of death at 12. Did I miss anything?":[319.136,8.225],"grace|That's right.":[327.481,0.935],"coach|Workable. Fast and neutral, a reasonable choice under high emotion and time pressure.":[328.536,5.245],"narr|About 13 minutes remain. Topics: delay to shock, compression pauses, airway plan, the overridden VF call, and team emotion.":[333.901,9.123],"narr|How do you manage the agenda?":[343.144,2.021],"you|We have 13 minutes. Time to first shock mattered most for survival, so I'd like to start there, then the airway. Is there anything else you need us to cover?":[345.285,9.988],"grace|I want to talk about why nobody heard me.":[355.393,2.221],"you|Good, that fits with the shock. I'll write it here.":[357.734,2.864],"coach|Strong choice. Under time pressure, you set the must-cover priority based on patient impact and still invite learner input.":[360.718,7.661],"you|What would you like to focus on?":[368.499,1.699],"raj|Maybe the airway?":[370.318,1.062],"helen|Agreed.":[371.499,0.806],"coach|Workable. Learner-centred, but with a high-stakes miss and little time, the group may pick a comfortable topic.":[372.425,6.198],"you|Let's start with laryngoscopy technique. Dr. Patel, walk us through your blade choice.":[378.743,5.779],"raj|Well, I started with a Mac 3, then...":[384.642,1.925],"narr|Four minutes pass.":[386.687,1.296],"coach|Missed opportunity. A detailed technical topic first, for one learner, eats time and sidelines the biggest survival factor.":[388.103,7.912],"narr|Gap: VF on the monitor at minute 2, called quietly, shock at minute 5.":[396.135,5.037],"narr|How do you explore the delay?":[401.293,1.719],"you|Let's watch 30 seconds from minute 2. I see VF on the monitor, I hear Grace name it, and the shock came three minutes later. I'm curious how the team was seeing the situation at that moment?":[403.132,12.873],"helen|I was locked onto the airway. His sats were terrible before he arrested, and I thought hypoxia was the story.":[416.125,5.719],"raj|I had the laryngoscope in. I never looked at the monitor.":[421.964,2.948],"grace|I said it. Once.":[425.032,1.247],"coach|Strong choice. A short, targeted clip gives an objective shared view and removes arguments about memory.":[426.399,6.631],"you|What would you change about the first five minutes?":[433.15,2.491],"raj|Shock sooner.":[435.761,0.906],"helen|Yes, obviously.":[436.787,1.249],"coach|Workable. Safe and open. The team may name shock earlier without exploring why nobody acted, which is the part that transfers.":[438.156,7.889],"you|In VF, defibrillate as soon as the pads are on. The airway can wait.":[446.166,4.706],"helen|We know that.":[450.992,0.957],"coach|Workable. Correct, but they already know this. The failure was attention and hierarchy under stress, which teaching alone does not fix.":[452.069,8.273],"you|Why didn't anyone shock? Everyone knows VF means shock.":[460.462,3.922],"helen|We were busy with the airway.":[464.504,1.538],"narr|Ben flinches.":[466.161,1.246],"coach|Missed opportunity. Blame with a rhetorical sting. The team defends instead of reflecting, and Ben hears it as confirmation of his guilt.":[467.528,8.327],"raj|The thing is, the Mac blade was wrong for his neck. With a hyperangulated blade on video you get a better view, and the bougie technique I've been using is...":[475.975,7.621],"narr|He is 90 seconds into airway equipment. The group is drifting.":[483.716,4.353],"narr|What do you do?":[488.189,1.05],"you|Dr. Patel, that's useful detail and I want to protect time for it. Can I park the blade question on the whiteboard? I'd like to stay with the shock for two more minutes.":[489.36,10.909],"raj|Sure, fair.":[500.388,0.819],"narr|You write blade choice under Parking lot.":[501.327,2.677],"coach|Strong choice. You honour his contribution, make a visible promise to return, and refocus.":[504.124,5.64],"narr|Four minutes pass. Grace sighs.":[509.884,2.456],"coach|Missed opportunity. Four minutes on equipment drains the time needed for the shock and the overridden call.":[512.46,5.831],"you|That's not relevant right now.":[518.411,1.756],"raj|Okay.":[520.286,0.703],"narr|He goes quiet.":[521.109,1.234],"coach|Missed opportunity. Refocusing is right, but not relevant dismisses him in front of peers.":[522.463,5.535],"grace|I did say VF. Nobody listens to nurses in codes.":[528.119,3.623],"narr|Dr. Park stiffens.":[531.862,1.648],"narr|Conflict is rising across the hierarchy. What do you do?":[533.63,3.744],"you|Grace, you had critical information and it didn't land, and that's frustrating. Dr. Park, what would have helped you hear Grace in that moment? Grace, what could you say next time that no one could miss?":[537.493,12.734],"helen|Loud, with my name. Dr. Park, VF, I'm charging. I would have said yes.":[550.348,4.372],"grace|Then I'll say it loud, twice, and charge the pads.":[554.839,2.65],"coach|Strong choice. You validate without taking sides, then turn the conflict into peer coaching in both directions.":[557.609,6.662],"you|A useful tool here is CUS: I'm Concerned, I'm Uncomfortable, this is a Safety issue. Say it twice if you need to.":[564.392,8.345],"grace|Sure.":[572.856,0.696],"narr|Dr. Park says nothing.":[573.672,1.789],"coach|Workable. A practical tool. Offered before the team explores the moment, it bypasses the senior's role and leaves the tension unresolved.":[575.581,8.755],"you|Let's keep this professional, please.":[584.456,1.961],"narr|Grace sits back, jaw tight.":[586.538,2.104],"coach|Missed opportunity. This silences a legitimate concern and protects the hierarchy. The team learns that raising a problem gets shut down, the exact behaviour that delayed the shock.":[588.762,11.564],"you|You're right, Grace. Doctors often don't listen to nurses.":[600.445,3.753],"helen|That's unfair.":[604.318,1.114],"narr|The room splits.":[605.552,1.289],"coach|Missed opportunity. Siding with one professional group creates a new us-and-them divide. Dr.":[606.961,5.816],"narr|Gap: three intubation attempts, pauses of 30 to 45 seconds each, no supraglottic backup.":[612.897,6.719],"narr|Time is short. How do you address the airway?":[619.736,2.748],"you|I noticed three attempts with pauses of 30 to 45 seconds. Next time, keep compression pauses under 10 seconds, and after two failed attempts move to a supraglottic airway, because oxygenation and compressions matter more than the tube early on.":[622.604,17.114],"raj|Fair. I tunnel-visioned on getting the tube.":[639.838,2.198],"sofia|I had an i-gel ready. I'll offer it next time.":[642.156,2.673],"coach|Strong choice. A clear technical gap under time pressure calls for concise teaching. You follow the pattern: behaviour, suggestion, rationale, delivered to the team rather than one person.":[644.949,12.016],"you|Dr. Patel, what was your plan B if the tube didn't go?":[657.085,3.822],"raj|I didn't really have one. I thought the next attempt would work.":[661.028,2.741],"coach|Workable. A strong question that exposes the missing backup plan. With only a few minutes left, add the specific teaching point so it isn't lost.":[663.889,8.749],"you|Three failed attempts is a lot for a PGY3.":[672.758,3.516],"raj|Thanks.":[676.394,0.622],"narr|He looks away.":[677.136,1.072],"coach|Missed opportunity. This compares him to an imagined standard in front of peers. It adds shame and no new behaviour.":[678.328,7.062],"narr|Three minutes left after a simulated death. How do you close?":[685.51,4.214],"you|One round: one thing you'll do in your next real code. Then I'll add two points. I'll also stay after for anyone who wants to talk, and we'll come back to the blade question next session.":[689.844,11.91],"helen|Shock first, and I'll invite callouts by name.":[701.874,2.567],"grace|Loud and twice.":[704.561,1.28],"raj|Two attempts, then SGA.":[705.96,1.702],"sofia|Offer the i-gel early.":[707.782,1.298],"ben|Keep compressing, and speak up about the monitor too.":[709.2,2.754],"coach|Strong choice. Concrete commitments, alignment with objectives, a promise kept on the parking lot, and a safe exit for anyone still carrying the death.":[712.074,9.168],"you|One thing each you'll do in your next real code.":[721.362,2.852],"helen|Shock first.":[724.334,0.955],"grace|Speak louder.":[725.409,1.071],"ben|...Keep going.":[726.6,1.108],"coach|Workable. Strong learning close. After a designed death, add a short emotional check-out and an offer to talk, so no one leaves carrying it alone.":[727.828,8.784],"you|Key points: shock VF immediately, limit pauses, have an airway plan B, and call critical findings loudly by name.":[736.732,8.505],"narr|Nods. Ben leaves first.":[745.356,1.781],"coach|Workable. Aligned and fast. Without learner commitments or emotional closure, transfer and wellbeing both suffer.":[747.258,6.968],"you|We're out of time. Thanks, everyone.":[754.346,2.153],"narr|The team files out in silence.":[756.619,2.374],"coach|Missed opportunity. Ending abruptly after a death leaves learners with raw emotion and no plan.":[759.112,6.083],"coach|Level 3. No Return. In-hospital cardiac arrest with a simulated death. Your goals: Defibrillate a shockable rhythm without delay. Escalate the airway while protecting compressions. Build a shared mental model: speak up, listen up.":[765.315,15.434],"coach|Your instinct. Cover safety, objectives, logistics and orientation, without giving away the answer.":[780.869,6.38],"coach|This protects the most vulnerable learner in the room before the scenario starts.":[787.369,4.561],"coach|Strength. Open the prebrief. Full prebrief with emotional forewarning. You forewarn without spoiling, give explicit permission to pause, and remove a known extraneous load .":[792.05,10.545],"coach|Try next time. Open the prebrief. You chose: Standard prebrief, no forewarning. Try full prebrief with emotional forewarning instead. You forewarn without spoiling, give explicit permission to pause, and remove a known extraneous load .":[802.715,15.013],"coach|When the patient dies, they will read it as their loss.":[817.848,2.758],"coach|Try next time. Open the prebrief. You chose: Competitive framing. Try full prebrief with emotional forewarning instead. You forewarn without spoiling, give explicit permission to pause, and remove a known extraneous load .":[820.725,14.378],"coach|Try next time. Open the prebrief. You chose: Undermining the fiction. Try full prebrief with emotional forewarning instead. You forewarn without spoiling, give explicit permission to pause, and remove a known extraneous load .":[835.223,14.428],"coach|Gaps observed: Airway fixation. 3-minute delay to first shock. Long compression pauses. No airway plan B. Critical call overridden by hierarchy.":[849.771,10.329],"coach|Your instinct. Open the door to feelings before facts.":[860.219,3.312],"coach|This is essential after a designed death.":[863.652,2.276],"coach|Strength. Reactions. Acknowledge the ending, invite everyone. Sitting lowers your status and signals you are staying.":[866.047,7.077],"coach|Watch for signals and open space.":[873.245,1.946],"coach|Try next time. Reactions. You chose: One-word check-in. Try acknowledge the ending, invite everyone instead. Sitting lowers your status and signals you are staying.":[875.31,10.822],"coach|Try next time. Reactions. You chose: Rushed normalization. Try acknowledge the ending, invite everyone instead. Sitting lowers your status and signals you are staying.":[886.253,11.124],"coach|Try next time. Reactions. You chose: Blame opener. Try acknowledge the ending, invite everyone instead. Sitting lowers your status and signals you are staying.":[897.496,10.448],"coach|Your instinct. Emotion comes before analysis. Validate what they feel, then normalize it.":[908.064,5.748],"coach|Strength. Human factors: shame meets dismissal. Validate + invite senior vulnerability. You validate Ben, then invite the senior to share her own experience.":[913.932,10.651],"coach|Park's dismissal unaddressed tells the team her frame still stands, so others may hold back.":[924.703,5.404],"coach|Try next time. Human factors: shame meets dismissal. You chose: Validate only. Try validate + invite senior vulnerability instead. You validate Ben, then invite the senior to share her own experience.":[930.228,14.251],"coach|Try next time. Human factors: shame meets dismissal. You chose: Siding with dismissal. Try validate + invite senior vulnerability instead. You validate Ben, then invite the senior to share her own experience.":[944.599,14.443],"coach|Offer the choice and keep the door open.":[959.161,2.1],"coach|Try next time. Human factors: shame meets dismissal. You chose: Exclusion. Try validate + invite senior vulnerability instead. You validate Ben, then invite the senior to share her own experience.":[961.382,13.992],"coach|Your instinct. Keep it short, let a learner lead, and check that everyone agrees.":[975.494,4.635],"coach|Quick check for agreement.":[980.248,1.264],"coach|Strength. Description. Learner-led summary. Asking the RT, who had a view of the monitor and the airway, gives a balanced account and avoids the leader's frame.":[981.632,9.649],"coach|Video works best in short, targeted clips during analysis.":[991.401,3.632],"coach|Try next time. Description. You chose: Full video review. Try learner-led summary instead. Asking the RT, who had a view of the monitor and the airway, gives a balanced account and avoids the leader's frame.":[995.153,13.331],"coach|Learners don't show you their own understanding, so you may miss a different mental model.":[1008.604,4.528],"coach|Try next time. Description. You chose: Neutral facilitator recap. Try learner-led summary instead. Asking the RT, who had a view of the monitor and the airway, gives a balanced account and avoids the leader's frame.":[1013.252,13.905],"coach|Your instinct. Working memory is full. Make the plan visible and choose fewer topics.":[1027.277,5.207],"coach|The whiteboard makes the plan visible and gives a parking lot.":[1032.604,3.262],"coach|Strength. Too much for the time. Facilitator priority + learner input, on the whiteboard. Under time pressure, you set the must-cover priority based on patient impact and still invite learner input.":[1035.987,12.741],"coach|Keep the survival-critical item on the table.":[1048.848,2.562],"coach|Try next time. Too much for the time. You chose: Learners choose. Try facilitator priority + learner input, on the whiteboard instead. Under time pressure, you set the must-cover priority based on patient impact and still invite learner input.":[1051.529,16.149],"coach|It also puts Dr. Patel under a spotlight early.":[1067.799,3.124],"coach|Try next time. Too much for the time. You chose: Technical deep dive first. Try facilitator priority + learner input, on the whiteboard instead. Under time pressure, you set the must-cover priority based on patient impact and still invite learner input.":[1071.043,17.024],"coach|Your instinct. The action only makes sense once you see the thinking behind it. Say what you saw, then get curious.":[1088.187,6.543],"coach|Advocacy-inquiry then reveals the frame: everyone knew VF means shock, so the gap is attention, not knowledge.":[1094.85,7.204],"coach|Strength. Issue 1: Three minutes to shock. Focused facilitation: video clip + advocacy-inquiry. A short, targeted clip gives an objective shared view and removes arguments about memory.":[1102.174,12.429],"coach|Try next time. Issue 1: Three minutes to shock. You chose: Learner self-assessment. Try focused facilitation: video clip + advocacy-inquiry instead. A short, targeted clip gives an objective shared view and removes arguments about memory.":[1114.722,16.341],"coach|Try next time. Issue 1: Three minutes to shock. You chose: Directive feedback. Try focused facilitation: video clip + advocacy-inquiry instead. A short, targeted clip gives an objective shared view and removes arguments about memory.":[1131.183,15.948],"coach|Try next time. Issue 1: Three minutes to shock. You chose: Judgmental. Try focused facilitation: video clip + advocacy-inquiry instead. A short, targeted clip gives an objective shared view and removes arguments about memory.":[1147.252,15.614],"coach|Your instinct. Protect the agenda without dismissing the person. Name why, and park it visibly.":[1162.986,6.106],"coach|Parking lots let you interrupt without dismissing, and they keep the group's working memory on one topic.":[1169.212,5.74],"coach|Strength. Human factors: off track. Respectful interruption + whiteboard parking lot. You honour his contribution, make a visible promise to return, and refocus.":[1175.072,10.576],"coach|Protecting the agenda is part of protecting the learning.":[1185.768,2.932],"coach|Try next time. Human factors: off track. You chose: No intervention. Try respectful interruption + whiteboard parking lot instead. You honour his contribution, make a visible promise to return, and refocus.":[1188.82,14.165],"coach|He will contribute less for the rest of the debrief.":[1203.105,2.502],"coach|Try next time. Human factors: off track. You chose: Dismissive interruption. Try respectful interruption + whiteboard parking lot instead. You honour his contribution, make a visible promise to return, and refocus.":[1205.727,14.489],"coach|Your instinct. Watch who holds the floor. Give the quieter voice a safe, specific opening.":[1220.337,5.427],"coach|The team designs its own fix, which they are more likely to use in a real code.":[1225.883,4.558],"coach|Strength. Human factors: Nobody listens to nurses. Guided team self-correction across the hierarchy. You validate without taking sides, then turn the conflict into peer coaching in both directions.":[1230.562,12.807],"coach|Try next time. Human factors: Nobody listens to nurses. You chose: Directive teaching . Try guided team self-correction across the hierarchy instead. You validate without taking sides, then turn the conflict into peer coaching in both directions.":[1243.489,16.427],"coach|Try next time. Human factors: Nobody listens to nurses. You chose: Suppressing conflict. Try guided team self-correction across the hierarchy instead. You validate without taking sides, then turn the conflict into peer coaching in both directions.":[1260.036,16.597],"coach|Park will defend, and the team loses the chance to fix it together.":[1276.753,3.646],"coach|Try next time. Human factors: Nobody listens to nurses. You chose: Taking sides. Try guided team self-correction across the hierarchy instead. You validate without taking sides, then turn the conflict into peer coaching in both directions.":[1280.519,16.104],"coach|Your instinct. This looks like a clear knowledge gap. Close it with one short, specific teaching point.":[1296.743,5.821],"coach|Strength. Issue 2: The airway. Directive feedback. A clear technical gap under time pressure calls for concise teaching.":[1302.684,7.783],"coach|Try next time. Issue 2: The airway. You chose: Focused facilitation. Try directive feedback instead. A clear technical gap under time pressure calls for concise teaching.":[1310.587,11.778],"coach|Try next time. Issue 2: The airway. You chose: Shaming comparison. Try directive feedback instead. A clear technical gap under time pressure calls for concise teaching.":[1322.485,11.628],"coach|Your instinct. Let every learner name their own take-away and a change for practice.":[1334.234,5.049],"coach|This closes both the learning and the emotional loop.":[1339.402,2.896],"coach|Strength. Application and closure. Learner-guided summary + emotional closure. Concrete commitments, alignment with objectives, a promise kept on the parking lot, and a safe exit for anyone still carrying the death.":[1342.418,13.612],"coach|Try next time. Application and closure. You chose: Learner round, no closure. Try learner-guided summary + emotional closure instead. Concrete commitments, alignment with objectives, a promise kept on the parking lot, and a safe exit for anyone still carrying the death.":[1356.15,17.703],"coach|Try next time. Application and closure. You chose: Educator-driven summary. Try learner-guided summary + emotional closure instead. Concrete commitments, alignment with objectives, a promise kept on the parking lot, and a safe exit for anyone still carrying the death.":[1373.973,17.704],"coach|Always close high-intensity debriefs with commitments and a check-out.":[1391.797,3.852],"coach|Try next time. Application and closure. You chose: Abrupt ending. Try learner-guided summary + emotional closure instead. Concrete commitments, alignment with objectives, a promise kept on the parking lot, and a safe exit for anyone still carrying the death.":[1395.769,16.953]},"platform":{"coach|Hi, I'm Coach Nadia. In this game you practise running a debrief after a simulation. Try the demo, or create an account to unlock every level.":[0.0,9.318],"coach|Welcome aboard. First, choose your debriefing framework.":[9.438,3.44],"coach|Choose your debriefing framework. PEARLS blends three analysis strategies across five phases. GAS gives you three clear phases: gather, analyze, and summarize. You can switch at any time.":[12.998,12.486],"coach|PEARLS stands for Promoting Excellence And Reflective Learning in Simulation. Watch the short video, then read the five phases.":[25.604,7.727],"coach|Five phases: setting the scene, reactions, description, analysis, and application. In analysis you choose one of three strategies: learner self-assessment, focused facilitation, or directive feedback.":[33.451,13.13],"coach|Match the strategy to the gap and to the time you have. Score ninety or more on a level to unlock the next one. Ready? Let's play.":[46.701,7.877],"coach|GAS stands for Gather, Analyze, Summarize. It was developed by WISER with the American Heart Association, and it is used in PALS and ACLS courses.":[54.698,10.744],"coach|Gather. Listen first. Hear how people feel, then get a short, shared account of what happened. Don't teach yet.":[65.562,6.364],"coach|Analyze. Take one topic at a time. Say what you saw and why it matters, invite their view, listen, then close the gap with the strategy that fits.":[72.046,8.764],"coach|Summarize. Learners state their own take-aways and one thing they will do differently. Then signal the end.":[80.929,6.096],"coach|Match the strategy to the gap. If they can see it, let them self-assess. If their thinking is unclear, use advocacy-inquiry. For a knowledge gap, teach, after you have heard them. Several views? Ask a circular question. A system problem? Explore the system.":[87.145,16.006],"coach|Watch for five traps: a minute-by-minute replay, a senior defining the story, lecturing, an accusatory why, and trying to cover every error.":[103.271,8.916],"coach|A twenty minute debrief is about one minute to open, five to gather, ten to analyze two topics, and five to summarize. Score ninety or more to unlock the next level. Ready? Let's play.":[112.307,12.074],"coach|Strategy Sprint. Ten moments from real debriefs. Match each one to the strategy that fits best. Be quick for bonus points. Go!":[124.501,8.419],"coach|Your results file is ready. Send it to your instructor.":[133.04,3.029],"coach|That one is for registered players. Create a free account to unlock it.":[136.189,4.021],"coach|You matched 0 out of 10.":[140.33,1.423],"coach|You matched 1 out of 10.":[141.874,1.293],"coach|You matched 2 out of 10.":[143.287,1.248],"coach|You matched 3 out of 10.":[144.655,1.322],"coach|You matched 4 out of 10.":[146.097,1.301],"coach|You matched 5 out of 10.":[147.518,1.356],"coach|You matched 6 out of 10.":[148.994,1.374],"coach|You matched 7 out of 10.":[150.489,1.403],"coach|You matched 8 out of 10.":[152.012,1.32],"coach|You matched 9 out of 10.":[153.451,1.375],"coach|You matched 10 out of 10.":[154.946,1.298],"coach|I know exactly what I did wrong. I should have called for help at minute 2, not minute 8.":[156.364,4.893],"coach|The learner already sees the gap, so let them lead with self-assessment.":[161.378,3.69],"coach|A resident gave an adult dose to a child. You have no idea what they were thinking.":[165.188,4.529],"coach|The reasoning is hidden. Advocacy-inquiry brings the frame behind the action into the open.":[169.837,5.404],"coach|What's the dose of adenosine for SVT? I've honestly never known.":[175.361,4.158],"coach|A clear knowledge gap, and they have told you so. Teach it.":[179.639,3.126],"coach|The doctor and the nurse remember the handover completely differently.":[182.885,3.716],"coach|Several perspectives on one moment. A circular question lowers the heat and shows the pattern.":[186.72,5.54],"coach|The defibrillator pads were in a different drawer from the one on the checklist.":[192.38,4.052],"coach|A system problem, not a person problem. Explore the process and capture a fix.":[196.552,5.028],"coach|We all agree the airway plan fell apart, and we can see where.":[201.7,3.419],"coach|The team sees the gap together. Guided team self-correction lets them build the fix.":[205.239,4.952],"coach|A nurse held the syringe for 30 seconds before giving the drug. You can't tell why.":[210.312,4.911],"coach|You saw the action but not the thinking. Share what you saw and ask how they saw it.":[215.342,4.264],"coach|Nobody knew where the massive transfusion form was kept.":[219.726,3.238],"coach|A latent safety threat in the system. Map it with the team and hand it on.":[223.085,3.971],"coach|I thought fluids come first in anaphylaxis, then adrenaline.":[227.176,3.42],"coach|A stated knowledge gap with a clear right answer. Teach it briefly, with the reason.":[230.716,4.718],"coach|The RT felt ignored. The lead says nobody told him. Each is sure they're right.":[235.553,4.806],"coach|Two stories in tension. Ask a third person what they noticed.":[240.479,3.639],"coach|I'd do three things differently, and I can tell you what they are.":[244.238,3.26],"coach|They can see the gaps. Let them self-assess, then add what's missing.":[247.618,3.743],"coach|Is it 15 compressions to 2 breaths for two-rescuer infant CPR?":[251.481,4.517],"coach|A factual question with a clear answer: yes, 15 to 2. Teach it.":[256.118,4.268],"coach|Three learners each think a different person was leading.":[260.506,2.773],"coach|Multiple views of the same team. Circular questions surface how roles were seen.":[263.399,5.002],"coach|The student noticed the rash but didn't mention it, and you're not sure why.":[268.521,3.572],"coach|The reason for staying silent is hidden. Stay curious and ask.":[272.213,3.684],"coach|The infusion pump defaulted to an adult rate, and it happened on every run today.":[276.017,4.581],"coach|Every team hit the same trap. Explore the system that set it.":[280.718,3.362],"coach|I forgot to check the glucose, and I know why: I anchored on stroke.":[284.2,3.795],"coach|They named the gap and their reasoning. Self-assessment lets them own the fix.":[288.114,4.31]},"gas-hypo":{"narr|Four learners wait by the bed. Leah keeps checking her new badge. Tom is joking with Jordan.":[0.0,5.766],"narr|How do you open the session?":[5.886,1.7],"you|This session is about learning and improvement, not blame. I believe everyone here is capable and wants to do their best, and what we say stays in this room. You get 12 minutes with a patient, then 20 minutes to debrief in three parts: what happened, what we can learn, and what you take away. First, a quick tour of the manikin and the glucometer.":[7.705,21.884],"leah|Okay. That helps, actually.":[29.709,2.11],"tom|Does the glucometer give real numbers?":[31.939,1.976],"coach|Strong choice. This is the GAS opening in one breath: purpose, the basic assumption, confidentiality, timing and a technology tour.":[34.035,9.037],"you|12 minutes of sim, then a 20 minute debrief: gather, analyze, summarize. Any questions? Let's start.":[43.193,6.812],"jordan|Sure.":[50.125,0.533],"narr|Leah nods quickly and says nothing.":[50.777,2.356],"coach|Workable. Clear on structure, which helps. It skips the purpose, the basic assumption and confidentiality, so a nervous new graduate fills the gap with her own story about being judged.":[53.254,11.414],"you|Pretend I'm your manager and this is your competency check. Show me what you'd really do.":[64.788,5.689],"leah|...Okay.":[70.597,0.897],"narr|Leah takes a step back behind Tom.":[71.614,2.542],"coach|Missed opportunity. Framing practice as assessment raises threat. Learners shift attention from the patient to how they look.":[74.276,7.692],"you|Don't worry, it's a super easy one today. There's nothing to get wrong.":[82.088,4.041],"tom|Easy, great.":[86.249,0.843],"coach|Missed opportunity. False reassurance backfires. If the team struggles, they now struggled on an easy case, which breeds shame.":[87.212,7.522],"narr|Leah takes over at 10:30. Mrs. Delgado is hard to rouse and her speech is slurred.":[94.854,5.974],"narr|Tom calls it a possible stroke and starts a neuro check. Jordan fetches the stroke pathway form.":[100.948,6.537],"narr|Leah says quietly, Should we maybe check her sugar? Tom is on the phone and Jordan is reading the form. Nobody answers.":[107.605,7.37],"narr|Dr. Khan arrives at minute 5 and orders an urgent CT head. The team preps her for transfer.":[115.094,6.774],"narr|At minute 7 the IV cannula tissues. Mrs. Delgado becomes sweaty and has a brief seizure.":[121.988,6.749],"narr|At minute 9 Dr. Khan asks, What's her glucose? Leah checks: 1.9 mmol per litre.":[128.857,6.561],"narr|Nobody gives IM glucagon. New IV access and dextrose take until minute 11.":[135.539,6.294],"narr|At minute 12 Mrs. Delgado opens her eyes and asks for a cup of tea. The scenario ends.":[141.953,6.543],"narr|The team sits down. Tom is laughing it off. Leah is red in the face.":[148.615,4.601],"tom|Well, that was embarrassing. Classic sugar.":[153.337,2.096],"narr|How do you open the Gather phase?":[155.552,2.02],"you|Before we look at anything, how are you all feeling after that one? You wait, and let the silence do the work.":[157.692,6.689],"tom|Honestly? A bit silly. It was right there.":[164.501,2.174],"leah|I thought of her sugar early. I just didn't say it loud enough.":[166.795,5.023],"amir|I ordered a CT for a hypo. Great.":[171.938,2.442],"coach|Strong choice. Gather starts with listening, not teaching. An open question plus a few seconds of silence gives the quieter learners room to speak.":[174.5,9.071],"you|Let's go around. One word for how that felt.":[183.691,3.048],"tom|Silly.":[186.859,0.597],"jordan|Rushed.":[187.576,0.598],"leah|Frustrated.":[188.294,0.979],"amir|Humbled.":[189.393,0.628],"coach|Workable. Quick and inclusive, and everyone speaks early. One word can hide the story behind it, so follow up on the strongest words before you move on.":[190.142,9.472],"you|Right, so the obvious issue is that nobody checked the sugar. Let's start there.":[199.734,4.737],"tom|Yeah, yeah, we know.":[204.59,1.011],"narr|Leah looks at the floor.":[205.721,1.41],"coach|Missed opportunity. Skipping Gather is the most common GAS error. The team has not vented, so Tom's joking and Leah's embarrassment leak into the analysis as defensiveness.":[207.251,11.414],"you|Don't be hard on yourselves, it happens to everyone. So, what happened?":[218.785,4.062],"narr|Nobody answers the feelings part. Jordan starts listing times.":[222.967,4.376],"coach|Missed opportunity. Reassurance before you have heard them closes the door on what they actually feel.":[227.462,5.705],"narr|Now you need a short, shared account of what happened. What do you ask?":[233.287,4.0],"you|Jordan, could you give us a 30-second summary of what happened? Then let's check: what did each of you think was going on, and when did that change?":[237.408,9.111],"jordan|74, drowsy with slurred speech. We went down the stroke path, lost the line, she seized, sugar was 1.9, dextrose fixed it.":[246.639,8.294],"tom|I thought stroke from the start.":[255.052,1.374],"leah|I wondered about her sugar at the start. She's on insulin and missed breakfast.":[256.546,6.769],"amir|Stroke, until the seizure.":[263.435,1.249],"coach|Strong choice. A short learner account, then a check of each person's mental model. It shows the team anchored on stroke while Leah had the right idea, which is your best analysis topic, and you did not have to name it.":[264.805,12.989],"you|Let's go through it minute by minute. Leah, you took handover, so start there.":[277.914,4.556],"leah|Okay, so I got handover, and then I went in, and...":[282.59,4.895],"narr|Seven minutes pass.":[287.605,1.352],"coach|Missed opportunity. A full replay is a named GAS error. It burns a third of your time, makes learners relive every misstep, and puts the newest nurse on stage first.":[289.077,10.842],"you|Here's what I saw: a hypo that was treated like a stroke until minute 9. Does that match?":[300.039,5.934],"tom|Pretty much.":[306.093,0.79],"coach|Workable. Efficient, but you defined the account and named the gap. In Gather the learners give the account, because their version shows you how they were thinking.":[307.003,9.175],"you|Dr. Khan, you were the doctor. Tell us what happened.":[316.298,3.154],"amir|Stroke picture, CT ordered, then we found the hypo and treated it.":[319.572,3.846],"narr|Leah says nothing.":[323.538,1.392],"coach|Missed opportunity. Letting the most senior person define the account is a common GAS error.":[325.05,5.689],"narr|Gap: 9 minutes of altered consciousness in a patient on insulin before a glucose check.":[330.858,6.087],"narr|The team already sees this gap. How do you open the first Analyze topic?":[337.066,4.641],"you|Let's talk about the first 9 minutes. You've already spotted that the glucose came late. As a team, what should the first two minutes look like for any drowsy patient? Let's build it on the whiteboard.":[341.827,12.305],"tom|Airway, obs and glucose. Every time, before anything fancy.":[354.252,3.545],"jordan|And someone says the number out loud.":[357.918,1.718],"amir|I check the sugar before I pick up the phone for a CT.":[359.756,3.081],"coach|Strong choice. The learners can already see this gap, so GAS says let them close it. Guided team self-correction against a standard builds a plan they own.":[362.957,9.384],"you|I saw 9 minutes go by before a glucose check, and I was worried because she's on insulin. How were you seeing it at the time?":[372.461,7.944],"tom|Like we said, we locked onto stroke.":[380.525,1.723],"coach|Workable. Well formed, but the team already named the gap. Advocacy-inquiry is for reasoning you cannot see.":[382.368,6.755],"you|Why didn't anyone check a sugar? It's the first thing we teach.":[389.244,3.714],"tom|We were busy.":[393.077,0.778],"narr|Arms fold around the room.":[393.976,1.948],"coach|Missed opportunity. The accusatory why is a named GAS error. It pushes learners to defend themselves instead of reflecting.":[396.043,7.94],"you|Let me take you through every cause of altered consciousness, starting with hypoglycaemia. You talk for five minutes.":[404.104,7.534],"narr|Jordan's eyes glaze. Leah writes notes she does not need.":[411.758,3.854],"coach|Missed opportunity. Lecturing is a named GAS error. They already know glucose matters.":[415.731,5.528],"leah|I did say sugar at the start. I guess nobody heard.":[421.379,4.898],"narr|Tom looks surprised. Jordan looks at the floor.":[426.398,3.096],"narr|Leah has just said something important, and a little risky. What do you do?":[429.614,4.533],"you|Thank you for saying that, Leah. That took courage. Tom, Jordan, hearing that now, what do you think got in the way of hearing Leah in the room?":[434.268,8.468],"tom|I was on the phone. I think I heard sugar and filed it for later.":[442.856,3.267],"jordan|I was head down in the stroke form. We had no roles, so we all did everything.":[446.243,4.341],"leah|Next time I'll say it louder, and say what I want to do.":[450.704,4.936],"coach|Strong choice. Validation keeps Leah safe. The circular question asks her peers to reflect on how the team listened, not on how loud she was.":[455.76,8.962],"you|Next time, Leah, try: 'I'm worried about her sugar. I'm checking it now.' A statement with an action is easier to hear than a question.":[464.841,8.38],"leah|Okay.":[473.341,0.848],"narr|Tom and Jordan relax a little, off the hook.":[474.31,2.874],"coach|Workable. A useful script, but it puts the whole fix on the most junior person. The team's listening and the missing roles stay untouched.":[477.304,8.316],"you|Good point, Leah. Let's keep going.":[485.74,2.07],"narr|Leah goes quiet for the rest of the debrief.":[487.93,2.951],"coach|Missed opportunity. Moving straight on after a vulnerable moment tells Leah it did not matter.":[491.001,5.236],"you|So Leah was right, and the rest of you ignored her.":[496.357,2.992],"tom|That's not fair, I was on the phone.":[499.47,1.492],"leah|I didn't mean it like that.":[501.082,1.594],"coach|Missed opportunity. This swaps one target for another. Blame makes Tom and Jordan defensive and makes Leah uncomfortable for being the reason.":[502.796,8.643],"amir|I didn't know you could give glucagon into the muscle. Is that a thing?":[511.559,3.515],"narr|Dr. Khan has named a clear knowledge gap. How do you close it?":[515.194,3.969],"you|Good question. Yes: with no IV access, adults can have glucagon 1 mg IM, and it usually works in 10 to 15 minutes. So next time the line is lost, one person gives glucagon while another gets new access. Check your local protocol for doses.":[519.283,18.81],"amir|Glucagon IM, 1 mg. Got it.":[538.213,2.329],"jordan|It's in the hypo box. I've never opened it.":[540.662,2.277],"coach|Strong choice. He has shared his view and named the gap, so GAS says teach. Clear, specific, with a reason and a team action, in under two minutes.":[543.059,9.112],"you|What options do we have when there's no IV access?":[552.291,3.294],"tom|Oral glucose?":[555.706,0.917],"leah|She couldn't swallow, though.":[556.743,1.615],"narr|Nobody mentions glucagon.":[558.478,2.288],"coach|Workable. Respectful, but the gap is factual and already named. Exploring it invites guessing and costs time.":[560.886,6.817],"you|Dr. Khan, what's the dose of IV dextrose? And glucagon?":[567.823,3.84],"amir|I... don't know.":[571.782,0.926],"narr|He does not ask another question for the rest of the session.":[572.828,3.973],"coach|Missed opportunity. Quizzing on the spot threatens safety. It rewards recall under pressure and embarrasses the person who just admitted a gap.":[576.92,8.548],"narr|Four minutes left. How do you close?":[585.589,2.35],"you|Let's go around. One thing you'll take from today, and one thing you'll do on your next shift. I'll add anything we missed, and then we'll finish.":[588.059,8.361],"leah|Say my concern out loud, with an action.":[596.54,3.405],"tom|Glucose on every drowsy patient, before I call anyone.":[600.065,3.147],"jordan|Assign roles, even with four of us.":[603.332,1.809],"amir|Glucagon IM if the line goes.":[605.26,1.754],"narr|You add nothing. They covered all three objectives.":[607.134,3.17],"coach|Strong choice. GAS Summarize in full: learners speak first, each names a concrete behaviour, you fill gaps, and you signal the end.":[610.424,8.363],"you|Three take-aways: check glucose early, glucagon IM without a line, and assign roles. Thanks, everyone.":[618.907,7.143],"narr|Everyone nods and starts packing up.":[626.169,2.536],"coach|Workable. Accurate and quick, but it is your summary, not theirs. GAS asks learners to state the take-aways first, so you can check what actually landed.":[628.826,9.318],"you|Any questions? No? Great, see you next time.":[638.263,3.029],"narr|The room empties in silence.":[641.413,2.284],"coach|Missed opportunity. Without a summary the learning stays in the room. Learners leave with feelings, not plans.":[643.816,6.466],"you|What was the main learning point for you today?":[650.402,2.16],"tom|Check the sugar.":[652.682,0.844],"leah|Speak up.":[653.646,0.915],"coach|Workable. Good, the learners speak first. GAS also asks for a concrete behavioural commitment, the what will I do differently, which makes transfer more likely.":[654.681,9.938],"coach|Level 1. The Sleepy Patient. Hypoglycaemia mistaken for a stroke on a medical ward. Your goals: Check glucose early in any patient with altered consciousness. Treat hypoglycaemia with and without IV access. Speak up clearly and assign roles in a small team.":[664.739,17.241],"coach|Your instinct. Cover safety, objectives, logistics and orientation, without giving away the answer.":[682.1,6.38],"coach|Naming the three debrief parts tells learners what is coming, which lowers threat. The glucometer tour removes a source of extraneous load without giving away the diagnosis.":[688.6,10.507],"coach|Strength. Open the session. Full opening: purpose, basic assumption, confidentiality, timing, orientation. This is the GAS opening in one breath: purpose, the basic assumption, confidentiality, timing and a technology tour.":[699.227,15.836],"coach|Try next time. Open the session. You chose: Structure and timing only. Try full opening: purpose, basic assumption, confidentiality, timing, orientation instead. This is the GAS opening in one breath: purpose, the basic assumption, confidentiality, timing and a technology tour.":[715.183,19.552],"coach|The GAS opening says the opposite: the purpose is learning and improvement, not blame.":[734.855,5.352],"coach|Try next time. Open the session. You chose: Test framing. Try full opening: purpose, basic assumption, confidentiality, timing, orientation instead. This is the GAS opening in one breath: purpose, the basic assumption, confidentiality, timing and a technology tour.":[740.327,18.925],"coach|Say that mistakes are expected instead of promising there will be none.":[759.373,3.717],"coach|Try next time. Open the session. You chose: False reassurance. Try full opening: purpose, basic assumption, confidentiality, timing, orientation instead. This is the GAS opening in one breath: purpose, the basic assumption, confidentiality, timing and a technology tour.":[763.21,19.297],"coach|Gaps observed: Anchoring on stroke, no glucose check for 9 minutes. A quiet cue from Leah was lost. No roles assigned. IM glucagon not considered when the line was lost. Strength: fast neuro check and a calm tone.":[782.626,14.363],"coach|Your instinct. Ask learners to judge their own performance first.":[797.109,3.746],"coach|Leah's feelings come out without you naming them.":[800.975,2.333],"coach|Strength. Gather: reactions. Open reactions question with silence. Gather starts with listening, not teaching.":[803.428,7.005],"coach|Try next time. Gather: reactions. You chose: One-word check-in. Try open reactions question with silence instead. Gather starts with listening, not teaching.":[810.553,10.669],"coach|Try next time. Gather: reactions. You chose: Skipped Gather, jumped to analysis. Try open reactions question with silence instead. Gather starts with listening, not teaching.":[821.342,11.827],"coach|Listen first, then normalize what you hear.":[833.289,2.396],"coach|Try next time. Gather: reactions. You chose: Premature reassurance. Try open reactions question with silence instead. Gather starts with listening, not teaching.":[835.805,10.894],"coach|Strength. Gather: a shared account. Learner summary with a mental model check. A short learner account, then a check of each person's mental model.":[846.819,8.668],"coach|Aim for a concise account.":[855.607,1.488],"coach|Try next time. Gather: a shared account. You chose: Minute-by-minute replay. Try learner summary with a mental model check instead. A short learner account, then a check of each person's mental model.":[857.215,12.64],"coach|Try next time. Gather: a shared account. You chose: Facilitator account. Try learner summary with a mental model check instead. A short learner account, then a check of each person's mental model.":[869.975,12.49],"coach|Everyone else defers, and you lose the new graduate's view, which holds the key to this case.":[882.585,5.136],"coach|Try next time. Gather: a shared account. You chose: Senior defines the account. Try learner summary with a mental model check instead. A short learner account, then a check of each person's mental model.":[887.841,12.791],"coach|Your instinct. The action only makes sense once you see the thinking behind it. Say what you saw, then get curious.":[900.752,6.543],"coach|The whiteboard keeps the load low.":[907.415,1.614],"coach|Strength. Topic 1: The missing glucose. Guided team self-correction. The learners can already see this gap, so GAS says let them close it.":[909.149,8.774],"coach|Here it spends time uncovering a frame they have already explained. nd named the gap, so GAS says teach.":[1023.394,9.608],"coach|When the learner has shown you the gap, close it.":[1033.122,2.053],"coach|Try next time. Topic 2: No IV access. You chose: Open exploration. Try directive feedback after eliciting perspective instead. He has shared his view and named the gap, so GAS says teach.":[1035.295,13.333],"coach|Teach the one point that matters.":[1048.748,1.658],"coach|Try next time. Topic 2: No IV access. You chose: Quizzing. Try directive feedback after eliciting perspective instead. He has shared his view and named the gap, so GAS says teach.":[1050.526,12.398],"coach|Commitments in their own words transfer best to practice.":[1063.044,3.025],"coach|Strength. Summarize. Learner take-aways with commitments, signposted ending. GAS Summarize in full: learners speak first, each names a concrete behaviour, you fill gaps, and you signal the end.":[1066.189,12.642],"coach|Try next time. Summarize. You chose: Facilitator summary. Try learner take-aways with commitments, signposted ending instead. GAS Summarize in full: learners speak first, each names a concrete behaviour, you fill gaps, and you signal the end.":[1078.951,15.87],"coach|Try next time. Summarize. You chose: No summary. Try learner take-aways with commitments, signposted ending instead. GAS Summarize in full: learners speak first, each names a concrete behaviour, you fill gaps, and you signal the end.":[1094.942,15.452],"coach|Try next time. Summarize. You chose: Take-aways without a commitment. Try learner take-aways with commitments, signposted ending instead. GAS Summarize in full: learners speak first, each names a concrete behaviour, you fill gaps, and you signal the end.":[1110.513,16.68]},"gas-asthma":{"narr|Dr. Okafor stands slightly apart from the nurses. Chris is checking the oxygen flowmeter.":[0.0,6.35],"narr|How do you open the session with this mixed team?":[6.47,2.982],"you|Our goal today is learning and improvement, not blame, and I assume everyone here is capable and wants to do their best. One norm: if you're worried, say it out loud and say what you want. The lead replies 'heard'. 14 minutes in the room, then 20 minutes to gather, analyze and summarize.":[9.572,18.891],"chris|I like heard. Simple.":[28.583,1.36],"sam|Heard.":[30.063,0.517],"narr|A few smiles.":[30.7,1.252],"coach|Strong choice. The basic assumption plus a concrete speak-up norm flattens the hierarchy before it forms.":[32.072,6.553],"you|This is about learning, not blame, and what's said here stays here. 14 minutes in the room, then a 20 minute debrief.":[38.745,7.611],"maya|Sounds good.":[46.476,0.919],"coach|Workable. Safe and clear. With a doctor-led mixed team, a simple speak-up norm would have helped the quieter voices get through under pressure.":[47.515,8.34],"you|Paediatric asthma deaths are usually preventable. Let's see if you can prevent this one.":[55.975,5.616],"priya|No pressure, then.":[61.711,1.065],"narr|Nervous laughter.":[62.896,1.349],"coach|Missed opportunity. Framing the sim as a test of whether they let a child die raises threat, which narrows attention and silences the junior staff.":[64.365,9.365],"you|Quick refresher before you go in: severe asthma, nebs, steroids, then magnesium, and watch for a silent chest.":[73.85,7.369],"sam|Nebs, steroids, magnesium. Got it.":[81.339,2.06],"coach|Missed opportunity. Handing over the answers removes the recognition challenge. The team performs a checklist, and their real mental models stay hidden from the debrief.":[83.519,10.158],"narr|Noah is working hard to breathe: respiratory rate 44, sats 89 percent, wheeze everywhere. Chris starts a salbutamol and ipratropium nebuliser.":[93.796,10.977],"narr|Dr. Okafor tries for IV access himself. Two attempts fail. He stays at the arm for four minutes.":[104.893,6.881],"narr|Chris says, His wheeze is getting quieter, and he's looking tired. Nobody responds. Maya charts the nebuliser.":[111.894,7.431],"narr|At minute 6 Priya says, He sounds better, the wheeze is almost gone. Dr. Okafor nods without looking up.":[119.444,7.274],"narr|Minute 8: sats 84 percent and Noah is drowsy. Dr. Okafor steps back and asks for IV magnesium. Nobody repeats the order.":[126.838,9.533],"narr|Magnesium is not in the resus cart. Maya phones pharmacy. It arrives at minute 13.":[136.491,6.249],"narr|The scenario ends at minute 14 with Noah drowsy, sats 88 percent, and the team calling intensive care.":[142.86,7.739],"sam|Before anyone says it, I know. I got stuck on the line.":[150.718,2.943],"narr|Chris has his arms folded. Priya is quiet.":[153.781,3.149],"narr|Dr. Okafor jumps straight to self-criticism. How do you respond?":[157.05,4.632],"you|Thanks for being honest, Dr. Okafor. Getting pulled into a task is really common for leaders in a tough resus, and we'll look at it together. Before we do, how is everyone else feeling?":[161.802,12.231],"chris|Frustrated. I felt like I was talking into a void.":[174.153,2.663],"maya|Busy. I was the only one writing things down.":[176.936,2.55],"priya|I thought he was getting better. Now I'm not sure.":[179.606,2.418],"coach|Strong choice. You honour his reaction without agreeing with his verdict, and you normalize it.":[182.144,5.006],"you|Thanks, that's a brave thing to say. We'll come back to it.":[187.27,3.129],"narr|Chris says nothing.":[190.519,1.402],"coach|Workable. Kind and brief. You missed the chance to open reactions to the whole team, so Chris's frustration stays folded up in his arms.":[192.041,8.297],"you|Yes, the IV was a problem. Let's talk about that now.":[200.457,3.565],"sam|Right. So I tried the left arm first...":[204.143,1.936],"narr|The others go quiet.":[206.198,1.594],"coach|Missed opportunity. This confirms his self-blame and skips everyone else's reactions. It turns the opening minutes into a public review of one person.":[207.912,9.302],"you|Don't be so hard on yourself, you did fine.":[217.333,2.73],"chris|Fine?":[220.183,0.662],"coach|Missed opportunity. False reassurance clashes with what he felt, so he discounts it, and so does Chris.":[220.965,6.11],"narr|You need a short account, and a check on what each person thought the key problem was.":[227.195,5.138],"you|Maya, could you give us the short version of what happened? Then I'd like to hear from each of you: what was the key problem you were managing?":[232.453,8.204],"maya|Six-year-old, severe asthma, nebs fast, IV was hard, magnesium came late, and he got tired.":[240.777,5.955],"chris|Fatigue. I saw it from minute 4.":[246.852,1.914],"priya|The wheeze. Less wheeze meant better, I thought.":[248.886,2.39],"sam|Access. Without a line I didn't think we could escalate.":[251.396,2.754],"coach|Strong choice. Three different key problems come out: fatigue, wheeze and access. That mismatch in mental models is now visible to the whole team, and you did not have to point it out.":[254.27,11.242],"you|Here's what I saw: severe asthma that got worse while we focused on access. Does that match?":[265.632,5.969],"sam|Yes, that's fair.":[271.721,0.95],"coach|Workable. Efficient, but you named the gap first, and you never hear the three different mental models that drive this case.":[272.791,6.929],"you|Dr. Okafor, you led. Walk us through your decisions.":[279.84,3.464],"sam|So, first I focused on access, which in hindsight...":[283.424,2.871],"narr|Four minutes of apology.":[286.415,1.995],"coach|Missed opportunity. Letting the senior define the account is a common GAS error, and he is already self-critical, so it becomes a confession.":[288.53,8.721],"you|Let's watch the whole recording back together.":[297.372,2.37],"narr|Eight minutes of video. Chris checks his watch twice.":[299.862,3.112],"coach|Missed opportunity. A full replay eats almost half your time. Video works when it is a short clip chosen for one learning point.":[303.093,7.605],"narr|Gap: a quietening chest was heard as improvement while sats fell and Noah tired.":[310.818,5.416],"priya|I really did think he was getting better.":[316.354,1.82],"narr|Priya's reasoning is the key. How do you explore it?":[318.293,3.262],"you|I'd like to spend a few minutes on the quiet chest, because it's one of the most dangerous signs in asthma. Priya, at minute 6 you said he sounded better, and I saw his sats at 87 and his breathing slowing. I was worried he was tiring. What were you seeing that told you he was better?":[321.675,18.005],"priya|Less wheeze. On the ward, less wheeze means the nebs are working.":[339.8,3.755],"chris|In a bad attack, less wheeze can mean less air moving. That's what scared me.":[343.674,3.607],"priya|Oh. So quiet can be worse.":[347.402,1.693],"coach|Strong choice. This is a mental model gap: Priya believes something reasonable that is wrong here.":[349.215,5.825],"you|Looking at the breathing assessment, what went well, and what would you change?":[355.16,4.07],"priya|We got the nebs on fast. I'd reassess sooner?":[359.35,2.696],"coach|Workable. Safe, but self-assessment only works when learners can see the gap. Priya believes her frame is right, so she cannot name what she does not know.":[362.166,9.205],"you|A silent chest in severe asthma is a sign of life-threatening obstruction, not improvement.":[371.491,6.123],"priya|Okay.":[377.734,0.566],"narr|She writes it down but still looks puzzled.":[378.421,2.635],"coach|Workable. Accurate and fast, but you skipped her perspective. GAS teaches after you have heard how the learner was thinking, so the teaching lands on her actual frame.":[381.175,9.928],"you|Priya, don't you think a quiet chest might mean something bad?":[391.224,3.4],"priya|Um... yes?":[394.744,1.121],"coach|Missed opportunity. A guess-what-I'm-thinking question. Priya either guesses your answer or feels caught out.":[395.985,6.054],"chris|To be blunt, I said he was tiring and nobody listened.":[402.158,2.886],"sam|I didn't hear that. I really didn't.":[405.165,1.731],"narr|Tension between Chris and Dr. Okafor, and two views of the same moment. What do you do?":[407.015,6.064],"you|You were both in the same room with different views of it. Maya, from where you stood, what did you notice about how information was reaching Dr. Okafor while he was at the arm?":[413.2,11.133],"maya|Nothing was reaching him. He was head down on the IV, and nobody said his name before speaking.":[424.452,5.645],"sam|That's fair. If I'm on a task, I can't lead. Next time I hand off the line.":[430.217,4.144],"chris|And I'll use his name and what I want: Dr. Okafor, he's tiring, I want to prepare for high-flow.":[434.482,4.965],"coach|Strong choice. GAS matches several perspectives with a circular question. Asking a third person about the pattern lowers the heat between the two, and makes the lead's hands-on position the topic, not the person.":[439.567,13.229],"you|Dr. Okafor, I saw you at the arm for four minutes, and I worried the team lost its lead. What was going through your mind?":[452.916,8.394],"sam|That I had to get the line. That's all.":[461.43,1.802],"narr|Chris nods, a little too hard.":[463.352,2.204],"coach|Workable. Well structured, but in a live disagreement it puts one person in the spotlight, and he is already self-critical.":[465.677,7.339],"you|Chris is right. The lead needs to listen to the team.":[473.135,3.232],"sam|I didn't hear him. I'm not ignoring anyone.":[476.487,2.224],"narr|The temperature rises.":[478.832,1.865],"coach|Missed opportunity. Taking sides turns a learning moment into a verdict. Dr.":[480.817,4.998],"you|Let's not make this personal. Moving on.":[485.935,2.674],"narr|Chris sits back and stops contributing.":[488.729,2.691],"coach|Missed opportunity. Shutting it down leaves the conflict unresolved and the lesson unlearned.":[491.54,5.414],"maya|The magnesium wasn't even in the cart. I had to phone pharmacy.":[497.074,3.678],"narr|This sounds like a system problem. How do you handle it?":[500.873,3.153],"you|That sounds like a system gap, not a person gap. Walk me through what happens today when a child needs magnesium fast. Where can it break, and who could fix it?":[504.146,10.145],"maya|It lives in the pharmacy fridge, not the cart. Phone call, then a porter.":[514.411,4.068],"chris|We could keep a severe asthma pack in the resus cart.":[518.599,2.707],"sam|And I'll say Maya, magnesium, 40 milligrams per kilo over 20 minutes and wait for the read-back.":[521.426,6.057],"narr|You write Asthma pack in resus cart on the board for the unit lead.":[527.602,4.508],"coach|Strong choice. GAS matches system problems with systems-focused inquiry. The team maps the process and proposes a fix, and you capture it for the unit.":[532.23,10.099],"you|Next time, close the loop: say the drug, the dose, the person, and wait for the read-back.":[542.45,5.282],"sam|Fair.":[547.852,0.484],"coach|Workable. Useful teaching, but it misses the stock problem, which will delay the next team no matter how well they communicate.":[548.456,7.384],"you|Pharmacy is always slow. Nothing we can do about that.":[555.96,3.607],"maya|Yeah.":[559.687,0.578],"narr|The problem walks out of the room with them.":[560.385,2.684],"coach|Missed opportunity. This normalizes a fixable latent threat. Simulation is one of the best tools for finding these problems, so capture it.":[563.189,8.945],"you|Maya, why didn't you check the cart before we started?":[572.254,2.792],"maya|It's never been my job to stock it.":[575.166,1.98],"coach|Missed opportunity. Blaming a person for a system gap is unfair and teaches the wrong lesson.":[577.266,5.766],"narr|Four minutes left. How do you close?":[583.152,2.35],"you|Each of you, one take-away and one thing you'll do on your next shift. Then I'll add anything we missed, and we'll finish.":[585.622,7.227],"priya|A quiet chest can mean worse, not better.":[592.969,2.267],"chris|Use the lead's name and say what I want.":[595.356,2.231],"maya|Read back every drug order.":[597.707,1.734],"sam|Hands off. If I'm on a task, I hand over the lead.":
