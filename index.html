<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="description" content="Practise prebriefing and debriefing as the facilitator. PEARLS and GAS levels, voiced characters, coaching on every move, and results you send to your instructor.">
<meta property="og:title" content="The Debriefer Game">
<meta property="og:description" content="Practise prebriefing and debriefing as the facilitator. PEARLS and GAS levels, voiced characters, coaching on every move, and results you send to your instructor.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1F4FA3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%231F4FA3'/%3E%3Cpath d='M5 22h7l3-8 5 15 4-11 2 4h9' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>

<body>
<script>(function(){var d=document.documentElement;try{var k=localStorage.getItem("debriefer.skin");d.setAttribute("data-skin",/^(board|chart|monitor|classic)$/.test(k)?k:"board");var m=localStorage.getItem("debriefer.mode");if(m==="light"||m==="dark")d.setAttribute("data-theme",m);}catch(e){d.setAttribute("data-skin","board");}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Caveat:wght@500;700&family=DM+Mono:wght@400;500&family=Permanent+Marker&family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=Chakra+Petch:wght@600;700&family=Barlow:wght@400;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --ground:#EDF1F0; --surface:#FFFFFF; --surface-2:#F5F8F7; --ink:#14202A; --ink-2:#4B5B64; --ink-3:#71818A;
  --line:#D3DDDA; --accent:#0B6E68; --accent-ink:#FFFFFF; --accent-soft:#D6ECE9; --accent-line:#9CCFC9;
  --good:#2C7A4B; --good-soft:#DDF0E3; --warn:#9A620E; --warn-soft:#F7EAD2; --poor:#AE3629; --poor-soft:#F7DEDA;
  --hf:#5B3FA0; --hf-soft:#E9E3F6;
  --monitor:#0A1013; --monitor-2:#131C21; --m-ink:#9FB1B8;
  --v-ps:#3DDC84; --v-sf:#4FD1E8; --v-ld:#F2C94C; --v-cl:#FF7AA2;
  --shadow:0 1px 2px rgba(20,32,42,.06),0 6px 20px rgba(20,32,42,.06);
  --f-display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --f-body:'Source Sans 3',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0D1416; --surface:#151F22; --surface-2:#1A262A; --ink:#E3ECEA; --ink-2:#A9B8B6; --ink-3:#7F908F;
    --line:#26363A; --accent:#4FC1B6; --accent-ink:#06201D; --accent-soft:#16332F; --accent-line:#2B5D57;
    --good:#6FD39A; --good-soft:#15301F; --warn:#E5B35A; --warn-soft:#33260F; --poor:#F08A7C; --poor-soft:#3A1915;
    --hf:#B9A2F0; --hf-soft:#271D3D; --monitor:#05090B; --monitor-2:#0E1619;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0D1416; --surface:#151F22; --surface-2:#1A262A; --ink:#E3ECEA; --ink-2:#A9B8B6; --ink-3:#7F908F;
  --line:#26363A; --accent:#4FC1B6; --accent-ink:#06201D; --accent-soft:#16332F; --accent-line:#2B5D57;
  --good:#6FD39A; --good-soft:#15301F; --warn:#E5B35A; --warn-soft:#33260F; --poor:#F08A7C; --poor-soft:#3A1915;
  --hf:#B9A2F0; --hf-soft:#271D3D; --monitor:#05090B; --monitor-2:#0E1619;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1140px;margin:0 auto;padding-inline:16px;padding-block:20px 64px}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;font-size:15px}
.btn:hover{border-color:var(--accent-line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.int-Low{background:var(--good-soft);color:var(--good)}
.int-Medium{background:var(--warn-soft);color:var(--warn)}
.int-High{background:var(--poor-soft);color:var(--poor)}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand span{display:block;font-size:12.5px;color:var(--ink-3);font-family:var(--f-mono);letter-spacing:.04em}
.topbar .tools{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:28px;align-items:end;margin-bottom:30px}
.hero h1{font-size:clamp(34px,5vw,56px);font-weight:800;letter-spacing:-.025em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{max-width:58ch;color:var(--ink-2);margin:14px 0 0}
.record{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.record div{background:var(--surface);padding:14px 14px 12px}
.record b{display:block;font-family:var(--f-mono);font-size:26px;font-variant-numeric:tabular-nums}
.record span{font-size:13px;color:var(--ink-3)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:34px 0 14px;flex-wrap:wrap}
.section-h h2{font-size:24px;font-weight:700}
.cases{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.case{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.case.locked{box-shadow:none;background:var(--surface-2)}
.case .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.case h3{font-size:22px;font-weight:700}
.case .topic{color:var(--ink-2);margin:0;font-size:15.5px}
.case dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
.case dt{color:var(--ink-3)}
.case dd{margin:0}
.case .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:12px;border-top:1px dashed var(--line)}
.case .best{font-family:var(--f-mono);font-size:13px;color:var(--ink-2)}
.case .lockmsg{font-size:13.5px;color:var(--ink-3)}
.case.soon h3{color:var(--ink-2)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.badge{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.badge .seal{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--line);color:var(--ink-3);font-family:var(--f-mono);font-weight:700;font-size:13px}
.badge.on .seal{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
.badge b{display:block;font-size:14.5px;line-height:1.3}
.badge span{font-size:13px;color:var(--ink-3);line-height:1.35;display:block;margin-top:2px}
.badge:not(.on) b{color:var(--ink-2)}
.ref{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.ref > div{padding:14px;border-right:1px solid var(--line)}
.ref > div:last-child{border-right:0}
.ref .n{font-family:var(--f-mono);color:var(--accent);font-weight:700;font-size:13px}
.ref b{display:block;font-family:var(--f-display);font-size:17px;margin:2px 0 4px}
.ref p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.45}
.ref-note{font-size:12.5px;color:var(--ink-3);margin-top:8px}
.skills{display:flex;flex-wrap:wrap;gap:8px}
.skills span{font-size:13.5px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;color:var(--ink-2)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}

/* ---------- play ---------- */
.play{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.casehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.casehead h2{font-size:clamp(26px,3.6vw,34px);font-weight:800;letter-spacing:-.015em}
.stepper{display:flex;gap:0;margin:0 0 18px;padding:0;list-style:none;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.stepper li{flex:1;padding:8px 6px;text-align:center;font-size:13px;font-weight:600;color:var(--ink-3);border-right:1px solid var(--line);white-space:nowrap}
.stepper li:last-child{border-right:0}
.stepper li.done{color:var(--accent);background:var(--accent-soft)}
.stepper li.now{color:var(--accent-ink);background:var(--accent)}
.stepper li i{font-style:normal;font-family:var(--f-mono);font-size:11px;opacity:.75;margin-right:4px}
.log{display:flex;flex-direction:column;gap:12px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.brief p{margin:0 0 12px;max-width:66ch}
.brief .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
.brief .grid div{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14.5px}
.brief .grid b{display:block;font-size:12px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.team{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.team span{font-size:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px 10px}
.team span em{font-style:normal;color:var(--ink-3)}
.objectives{margin:0;padding-left:20px}
.objectives li{margin:2px 0}
.phase-mark{display:flex;align-items:center;gap:10px;margin:14px 0 2px}
.phase-mark::after{content:"";flex:1;height:1px;background:var(--line)}
.phase-mark span{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
.narr{color:var(--ink-2);font-style:italic;margin:0;max-width:68ch}
.line{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;max-width:72ch}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:12px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.line .who{font-size:13px;font-weight:700;color:var(--ink-2)}
.line .who em{font-style:normal;font-weight:400;color:var(--ink-3)}
.line .say{background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:8px 12px;margin-top:2px}
.line.you{margin-left:auto;grid-template-columns:1fr auto}
.line.you .av{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);grid-column:2;grid-row:1}
.line.you .body{grid-column:1;grid-row:1;text-align:right}
.line.you .say{background:var(--accent-soft);border-color:var(--accent-line);border-radius:14px 4px 14px 14px;text-align:left}
.scenario{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.scenario ol{margin:8px 0 0;padding-left:22px}
.scenario li{margin:4px 0}
.observed{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.observed span{font-size:13px;background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:3px 9px;font-weight:600}
.hfbanner{display:flex;align-items:center;gap:8px;background:var(--hf-soft);color:var(--hf);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px}
.decision{background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.decision h3{font-size:20px;font-weight:700;margin-bottom:4px}
.decision .prompt{margin:0 0 14px;color:var(--ink-2)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.5}
.opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.opt kbd{font-family:var(--f-mono);font-weight:700;font-size:13px;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--accent)}
.kbdhint{font-size:12.5px;color:var(--ink-3);margin-top:10px}
.fb{border-radius:14px;padding:14px 16px;border:1px solid var(--line);background:var(--surface)}
.fb .head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}
.grade{font-weight:800;font-size:13px;padding:3px 10px;border-radius:999px}
.g-best{background:var(--good-soft);color:var(--good)}
.g-good{background:var(--warn-soft);color:var(--warn)}
.g-weak{background:var(--poor-soft);color:var(--poor)}
.strat{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.fb p{margin:0;max-width:70ch}
.deltas{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.deltas span{font-family:var(--f-mono);font-size:12px;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.deltas i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.next{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.fade{animation:fadein .35s ease both}
@keyframes fadein{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.fade{animation:none}}

/* ---------- monitor ---------- */
.monitor{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--monitor);border-radius:16px;padding:14px;color:var(--m-ink);border:1px solid #1d2a30}
.monitor .mh{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
.monitor .dot{width:8px;height:8px;border-radius:50%;background:var(--v-ps);box-shadow:0 0 8px var(--v-ps);display:inline-block;margin-right:6px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.monitor .dot{animation:none}}
.trace{display:block;width:100%;height:36px;margin-bottom:8px}
.vitals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vital{background:var(--monitor-2);border-radius:10px;padding:8px 10px}
.vital .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.vital .v{font-family:var(--f-mono);font-weight:700;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.vital .l{font-size:11.5px;color:var(--m-ink);line-height:1.25}
.clock{margin-top:10px;background:var(--monitor-2);border-radius:10px;padding:8px 10px}
.clock .row{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px}
.clock .bar{height:6px;border-radius:3px;background:#1f2c31;margin-top:6px;overflow:hidden}
.clock .bar b{display:block;height:100%;background:var(--v-sf);transition:width .4s}
.clock.over .bar b{background:var(--v-cl)}
.clock.over .row span:last-child{color:var(--v-cl)}
.monitor .note{font-size:11.5px;margin-top:10px;line-height:1.4}

/* ---------- results ---------- */
.results h2{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.02em}
.res-top{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start;margin-top:18px}
.overall{display:flex;align-items:baseline;gap:12px;margin:10px 0 4px;flex-wrap:wrap}
.overall b{font-family:var(--f-mono);font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.overall span{color:var(--ink-2)}
.coach{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.coach li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.coach .tag{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.coach .tag.s{color:var(--good)}
.coach .tag.i{color:var(--poor)}
.coach .tag.t{color:var(--accent)}
.coach p{margin:4px 0 0}
.coach q{display:block;margin-top:6px;padding:8px 10px;background:var(--surface-2);border-radius:8px;quotes:none;font-size:15.5px}
.hist{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.hist th,.hist td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.hist th:first-child,.hist td:first-child{text-align:left}
.hist th{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.hist tr.cur td{font-weight:700;background:var(--accent-soft)}
.up{color:var(--good)} .down{color:var(--poor)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.newbadges{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.newbadges span{background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;border-radius:999px;padding:5px 12px}
details.review{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details.review summary{cursor:pointer;font-weight:700}
.rv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.rv:first-of-type{border-top:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}

/* ---------- game layer ---------- */
.profile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.profile .rank{display:flex;align-items:center;gap:12px}
.profile .rank .lv{width:48px;height:48px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:20px;flex:none}
.profile .rank b{font-family:var(--f-display);font-size:20px;display:block;line-height:1.1}
.profile .rank span{font-size:13px;color:var(--ink-3)}
.xpbar{height:10px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.xpbar b{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--v-sf));border-radius:5px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.xprow{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hero > *{min-width:0}
.stats3 div{background:var(--surface-2);border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:8px}
.stats3 b{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums;line-height:1}
.stats3 span{font-size:12px;color:var(--ink-3);line-height:1.2}
.cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn.big{padding:14px 22px;font-size:17px;border-radius:12px}
.stars{display:inline-flex;gap:2px;vertical-align:middle}
.case .stars svg{width:20px;height:20px}
.levelno{font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--accent)}
.case:not(.locked){transition:transform .15s, box-shadow .15s}
.case:not(.locked):hover{transform:translateY(-2px)}
.lockicon{display:inline-block;vertical-align:-3px;margin-right:4px}

.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.side .monitor{position:static}
.room{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.room .rh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.room .rh b{font-family:var(--f-display);font-size:16px}
.room .rh span{font-size:12px;color:var(--ink-3);font-family:var(--f-mono)}
.table{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.seat{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:6px 2px;border-radius:12px;transition:background .3s}
.seat svg{width:56px;height:56px;transition:transform .3s}
.seat.spoke{background:var(--accent-soft)}
.seat.spoke svg{animation:bob .9s ease 2}
@keyframes bob{50%{transform:translateY(-4px)}}
.seat .nm{font-size:12.5px;font-weight:700;line-height:1.15}
.seat .md{font-size:11px;font-family:var(--f-mono);letter-spacing:.04em}
.pips{display:flex;gap:2px}
.pips i{width:8px;height:4px;border-radius:2px;background:var(--line)}
.m0{color:var(--poor)} .m1{color:var(--warn)} .m2{color:var(--ink-3)} .m3{color:var(--good)} .m4{color:var(--accent)}
.pips.p0 i:nth-child(-n+1){background:var(--poor)}
.pips.p1 i:nth-child(-n+2){background:var(--warn)}
.pips.p2 i:nth-child(-n+3){background:var(--ink-3)}
.pips.p3 i:nth-child(-n+4){background:var(--good)}
.pips.p4 i{background:var(--accent)}
.moodchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.moodchips span{font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:999px}
.moodchips .up{background:var(--good-soft)} .moodchips .down{background:var(--poor-soft)}
.combo{margin-top:10px;display:flex;justify-content:space-between;align-items:center;background:var(--monitor-2);border-radius:10px;padding:8px 10px;font-family:var(--f-mono);font-size:12px}
.combo b{font-size:20px;color:var(--v-ld)}
.combo .runxp{color:var(--v-sf);font-weight:700}
.line .av svg{width:34px;height:34px;display:block}
.line .av.pic{border:0;background:none}
.say.typing::after{content:"▍";color:var(--accent);animation:blink .8s infinite}
.pending{display:none!important}
.skip{font-size:13px;color:var(--ink-3);background:none;border:0;text-decoration:underline;align-self:flex-end;padding:0}
.xppop{position:fixed;z-index:30;pointer-events:none;font-family:var(--f-mono);font-weight:700;font-size:22px;color:var(--accent);text-shadow:0 2px 10px var(--ground);animation:rise 1.6s ease-out forwards;white-space:nowrap}
.xppop small{display:block;font-size:13px;color:var(--warn)}
@keyframes rise{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
.hotseat{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-family:var(--f-mono);font-size:13px;color:var(--ink-2)}
.ring{width:40px;height:40px;flex:none}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .25s linear}
.hotseat.late .fg{stroke:var(--poor)}
.decision.hot{border-color:var(--warn)}
.fb.flip{animation:flip .45s ease both}
@keyframes flip{from{opacity:0;transform:perspective(600px) rotateX(-12deg) translateY(8px)}to{opacity:1;transform:none}}
.result-stars{display:flex;gap:8px;margin:6px 0 4px}
.result-stars svg{width:52px;height:52px}
.result-stars .s{animation:starpop .5s cubic-bezier(.3,1.6,.5,1) both}
.result-stars .s:nth-child(2){animation-delay:.25s}
.result-stars .s:nth-child(3){animation-delay:.5s}
@keyframes starpop{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
.levelup{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 14px;font-weight:700;margin-top:10px;display:inline-block}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}
@media (prefers-reduced-motion: reduce){.seat.spoke svg,.result-stars .s,.fb.flip,.xppop{animation:none}}

@media (max-width: 900px){
  .side{position:static;order:-1}
  .table{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}
  .hero,.play,.res-top{grid-template-columns:1fr}
  .cases{grid-template-columns:1fr 1fr}
  .badges{grid-template-columns:1fr 1fr}
  .ref{grid-template-columns:1fr}
  .ref > div{border-right:0;border-bottom:1px solid var(--line)}
  .ref > div:last-child{border-bottom:0}
  .monitor{position:static;order:-1}
  .vitals{grid-template-columns:repeat(4,1fr)}
  .vital .v{font-size:24px}
  .vital .l{display:none}
}
@media (max-width: 600px){
  body{font-size:16px}
  .cases,.badges{grid-template-columns:1fr}
  .brief .grid{grid-template-columns:1fr}
  .stepper li{font-size:0;padding:10px 2px}
  .stepper li i{font-size:11px;margin:0;opacity:1}
  .vitals{grid-template-columns:1fr 1fr}
  .line{max-width:100%}
  .stats3 div{flex-direction:column;align-items:flex-start;gap:4px}
}
/* ================= v2: motion + game components ================= */
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.iconbtn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.iconbtn[aria-pressed="true"]{color:var(--accent)}
.pill.plain{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.topbar .tools{align-items:center}

/* level cards deal in */
.cases .case{animation:dealin .5s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes dealin{from{opacity:0;transform:translateY(18px) rotate(-1.5deg) scale(.97)}to{opacity:1;transform:none}}
.caseteam{display:flex;margin:-2px 0 -4px}
.caseteam svg{width:38px;height:38px;margin-right:-8px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.15));transition:transform .2s}
.case:not(.locked):hover .caseteam svg{transform:translateY(-3px)}
.case:not(.locked):hover .caseteam svg:nth-child(2){transition-delay:.04s}
.case:not(.locked):hover .caseteam svg:nth-child(3){transition-delay:.08s}
.case:not(.locked):hover .caseteam svg:nth-child(4){transition-delay:.12s}
.case.locked .caseteam{filter:grayscale(1);opacity:.5}
.btn.primary.big{box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 60%,#000);transform:translateY(0);transition:transform .08s,box-shadow .08s}
.btn.primary.big:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 60%,#000)}

/* intro cinematic */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--ground) 55%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:ovin .3s ease both;overflow-y:auto}
.overlay.out{animation:ovout .28s ease both}
@keyframes ovin{from{opacity:0}to{opacity:1}}
@keyframes ovout{to{opacity:0}}
.introcard{width:min(640px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:12px;animation:cardin .5s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes cardin{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:none}}
.introcard h2{font-size:clamp(32px,6vw,48px);font-weight:800;letter-spacing:-.02em}
.introcard .muted{margin:0}
.introteam{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin:6px 0}
.introseat{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;animation:seatin .45s cubic-bezier(.2,.9,.3,1.4) both}
.introseat svg{width:64px;height:64px}
.introseat b{font-size:14px}
.introseat span{font-size:12px;color:var(--ink-3);line-height:1.25}
@keyframes seatin{from{opacity:0;transform:translateY(24px) scale(.6)}to{opacity:1;transform:none}}
.introrow{display:flex;gap:8px;flex-wrap:wrap}
.introcard .btn{align-self:flex-start;margin-top:6px}

/* phase title card */
.phasecard{position:fixed;inset:0;z-index:45;display:grid;place-items:center;pointer-events:auto;cursor:pointer}
.phasecard .band{width:100%;background:var(--accent);color:var(--accent-ink);padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:2px;animation:band 1.5s cubic-bezier(.7,0,.3,1) both;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.phasecard .pn{font-family:var(--f-mono);font-size:12px;letter-spacing:.2em;opacity:.85}
.phasecard b{font-family:var(--f-display);font-size:clamp(36px,7vw,64px);line-height:1;letter-spacing:-.02em}
.phasecard .po{font-size:16px;opacity:.9}
@keyframes band{0%{transform:translateX(-105%) skewX(-12deg)}22%{transform:translateX(0) skewX(0)}78%{transform:translateX(0) skewX(0);opacity:1}100%{transform:translateX(105%) skewX(12deg);opacity:.6}}

/* case file */
details.brief > summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline}
details.brief > summary::-webkit-details-marker{display:none}
details.brief > summary::before{content:"▸";color:var(--accent);transition:transform .2s;display:inline-block}
details.brief[open] > summary::before{transform:rotate(90deg)}
details.brief[open] > summary{margin-bottom:10px}
details.brief > summary .muted{font-size:14px}

/* simulation replay */
.simhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.rec{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--poor)}
.rec i{width:9px;height:9px;border-radius:50%;background:var(--poor);animation:blink 1s infinite}
.pm{background:#05090B;border-radius:14px;padding:10px 12px;color:#9FB1B8;border:2px solid #1d2a30;transition:border-color .3s}
.pm.alarm{animation:alarm 1.1s infinite}
@keyframes alarm{0%,100%{border-color:#1d2a30}50%{border-color:#FF4D6D;box-shadow:0 0 0 3px rgba(255,77,109,.18)}}
.pm-top{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;gap:10px}
.pm-top b{color:#E3ECEA}
.pm-top [data-v="label"]{color:#3DDC84;text-align:right}
.pm.alarm .pm-top [data-v="label"]{color:#FF7AA2}
.ecg{display:block;width:100%;height:78px;margin:8px 0}
.pm-nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pm-nums .n{background:#0E1619;border-radius:8px;padding:6px 8px;min-width:0}
.pm-nums span{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em}
.pm-nums b{display:block;font-family:var(--f-mono);font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.pm-nums .hr{color:#3DDC84}.pm-nums .bp{color:#FF7AA2}.pm-nums .sp{color:#4FD1E8}.pm-nums .rr{color:#F2C94C}.pm-nums .tp{color:#E3ECEA}
.bump{animation:bump .5s ease}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.25);filter:brightness(1.6)}100%{transform:scale(1)}}
.simprog{height:4px;border-radius:2px;background:var(--line);margin:10px 0 4px;overflow:hidden}
.simprog b{display:block;height:100%;background:var(--accent);transition:width .6s ease}
.events{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.event{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:6px 8px;border-radius:8px;transition:background .3s}
.event .ts{font-family:var(--f-mono);font-size:12.5px;color:var(--accent);padding-top:2px}
.event.now{background:var(--accent-soft)}
.obs-h{background:none!important;color:var(--ink-3)!important;font-family:var(--f-mono);font-size:11.5px!important;letter-spacing:.08em;text-transform:uppercase;padding-left:0!important}
.observed span{animation:chipin .4s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes chipin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}

/* decision */
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.instbtn{display:inline-flex;align-items:center;gap:8px;border:1px dashed var(--accent-line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 8px;font-size:13.5px;font-weight:700;color:var(--ink-2)}
.instbtn:not([disabled]):hover{background:var(--accent-soft);border-style:solid}
.instbtn[disabled]{opacity:.55;cursor:default}
.bulbs{display:inline-flex}
.instinct{background:color-mix(in srgb,var(--v-ld) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--v-ld) 55%,var(--line));border-radius:12px;padding:10px 12px;margin:-4px 0 14px;font-size:15.5px}
.instinct b{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;display:block;color:var(--warn)}
.instinct.pop{animation:starpop .45s cubic-bezier(.3,1.6,.5,1) both}
.decision.fade .opt{animation:optin .42s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes optin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.opt{position:relative;transition:transform .12s,border-color .12s,background .12s,opacity .25s}
.opt:not([disabled]):hover{transform:translateX(4px)}
.opt.chosen{border-color:var(--accent);background:var(--accent-soft);animation:chosen .38s ease both}
@keyframes chosen{30%{transform:scale(1.025)}100%{transform:scale(1)}}
.opt.dim{opacity:.25;transform:scale(.98)}
.opt.struck{opacity:.45;cursor:not-allowed}
.opt.struck > span{text-decoration:line-through;text-decoration-color:var(--poor)}
.opt .x{grid-column:2;font-style:normal;font-size:12.5px;font-weight:700;color:var(--poor)}
.hfbanner.shake{animation:fadein .35s ease both,shake .5s .35s ease}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

/* feedback */
.fb.flip .stamp{animation:stamp .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stamp{from{transform:scale(2.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.fb.flip .moodchips span{animation:chipin .4s .3s cubic-bezier(.2,.9,.3,1.4) both}
.xppop .brk{color:var(--poor)}

/* room reactions */
.seat{position:relative}
.seat.hop svg{animation:hop .6s cubic-bezier(.3,1.8,.5,1)}
.seat.shake svg{animation:shake .5s ease}
@keyframes hop{40%{transform:translateY(-10px)}}
.seat.talking{background:var(--accent-soft)}
.seat.talking::after{content:"…";position:absolute;top:0;right:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px 10px 10px 2px;padding:0 6px;font-weight:800;color:var(--accent);animation:blink .8s infinite}
.emote{position:absolute;top:0;right:12px;font-size:13px;font-weight:800;animation:emote 1.4s ease-out both;pointer-events:none}
.emote.up{color:var(--good)} .emote.down{color:var(--poor)}
@keyframes emote{0%{opacity:0;transform:translateY(8px) scale(.6)}20%{opacity:1;transform:translateY(0) scale(1.2)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.vital{position:relative}
.vital.flash{animation:vflash .9s ease}
@keyframes vflash{30%{background:#20303a}}
.dv{position:absolute;top:6px;right:8px;font-family:var(--f-mono);font-size:12px;font-weight:700;animation:emote 1.8s ease-out both}
.dv.up{color:#3DDC84}.dv.down{color:#FF7AA2}
.combo.burst{animation:burst .6s cubic-bezier(.3,1.6,.5,1)}
.combo.burst b{text-shadow:0 0 12px var(--v-ld)}
@keyframes burst{40%{transform:scale(1.06)}}
.combo.broken{animation:shake .5s ease}
.combo.broken span:nth-child(2){color:var(--v-cl)}
.vbar{height:5px;border-radius:3px;background:#1f2c31;margin:4px 0 2px;overflow:hidden}
.vbar b{display:block;height:100%;border-radius:3px;transition:width 1s cubic-bezier(.2,.8,.2,1)}

/* results */
.newbadges .nb{display:inline-flex;align-items:center;gap:8px;animation:starpop .55s cubic-bezier(.3,1.6,.5,1) both}
.newbadges .nb i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--accent-ink);color:var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px}
.coach li{animation:fadein .4s ease both}

/* mobile HUD */
.hud{display:none}
@media (max-width: 900px){
  .play > .side{display:none}
  #hudwrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
  .hud{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--monitor);border-radius:12px;padding:6px 10px;margin:0 0 12px;box-shadow:var(--shadow)}
  .hud-faces{display:flex;gap:2px;min-width:0}
  .hud-faces svg{width:30px;height:30px;display:block}
  .hf.hop svg{animation:hop .6s cubic-bezier(.3,1.8,.5,1)}
  .hf.shake svg{animation:shake .5s ease}
  .hud-v{display:flex;gap:8px;font-family:var(--f-mono);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
  .hud-c{font-family:var(--f-mono);font-weight:700;color:var(--v-ld);font-size:14px}
  .pm-nums{grid-template-columns:repeat(3,1fr)}
}
@media (max-width: 420px){ .hud-v{gap:5px;font-size:14px} .hud-faces svg{width:26px;height:26px} }
@media (prefers-reduced-motion: reduce){
  .cases .case,.introcard,.introseat,.opt,.decision.fade .opt,.observed span,.fb.flip .stamp,.seat.hop svg,.seat.shake svg,.emote,.dv,.combo.burst,.combo.broken,.hfbanner.shake,.newbadges .nb,.coach li,.bump,.pm.alarm,.instinct.pop{animation:none!important}
}
/* ================= v3: voice, coach, tour, lighter reading ================= */
.iconbtn.lab{width:auto;padding:0 12px;gap:6px;display:inline-flex;align-items:center;font-size:13.5px;font-weight:700}
.iconbtn.lab span{white-space:nowrap}
@media (max-width:600px){ .iconbtn.lab span{display:none} .iconbtn.lab{width:42px;padding:0;justify-content:center} }
.ot{display:flex;flex-direction:column;gap:2px;min-width:0}
.ot .gist{font-family:var(--f-display);font-size:17px;font-weight:700;line-height:1.25}
.ot .q{font-size:14.5px;color:var(--ink-2);line-height:1.45}
.opt.reading{border-color:var(--v-ld);box-shadow:0 0 0 3px color-mix(in srgb,var(--v-ld) 35%,transparent)}
.coachrow{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start}
.coachav svg{width:52px;height:52px;display:block}
.cbody .lead{margin:4px 0 0;font-size:17px}
.cbody .lead b{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-right:4px}
details.why{margin-top:6px}
details.why summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--accent);list-style:none;display:inline-flex;gap:6px;align-items:center}
details.why summary::-webkit-details-marker{display:none}
details.why summary::before{content:"+";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor;font-size:13px;line-height:1}

<script>
/* ==========================================================================
   CASE LIBRARY
   --------------------------------------------------------------------------
   To add a case, push a new object into CASES with this shape:

   {
     id, title, topic, setting, level, intensity: 'Low'|'Medium'|'High',
     budget: debrief minutes,
     unlock: null | { after: '<caseId>', min: <overall score 0-100> },
     afterScenario: { teamId: mood 0-4 } mood of learners entering the debrief
                    (0 distressed, 1 guarded, 2 neutral, 3 open, 4 engaged; default 2),
     team: [{ id, name, role }],
     gaps: { cognitive, technical, behavioural },
     objectives: [ ... ],
     intro: 'narrative paragraph',
     steps: [
       { type:'narrative', phase:'scenario', title, paras:[...], observed:[...],
         monitor:[{ t, rhythm:'sinus'|'wide'|'vf'|'pea'|'asys', hr, bp, spo2, rr, temp, alarm?, label? }] one per para },
       { type:'choice', phase:'prebrief'|'reactions'|'description'|'analysis'|'summary',
         title, setup?: [[who,text]...], prompt,
         challenge?: 'emotion'|'hierarchy'|'peer'|'interrupt'|'load'|'voice',
         options: [{
           id, text, g?: 'short neutral headline (3-6 words)', strat: 'strategy label', grade: 'best'|'good'|'weak',
           s: [psychSafety, structureFit, learningDepth, cogLoad]  (0-3 each),
           t: minutes of debrief time used,
           tags: ['ai','emotion','hierarchy','peer','load','voice','lsum','dir'],
           fb: 'feedback, first sentence = the key point',
           reply: [[who, text], ...]
         }]
       }
     ]
   }
   who = a team id, 'narr' for narration, 'you' for the facilitator.
   ========================================================================== */

const CASES = [
/* ------------------------------------------------------------------ CASE 1 */
{
  id: 'ward-sepsis',
  title: 'The Quiet Slide',
  topic: 'Early sepsis on a surgical ward',
  setting: 'Surgical ward, high-fidelity manikin',
  level: 'Novice',
  intensity: 'Low',
  budget: 20,
  unlock: null,
  afterScenario: { priya:1, leah:1 },
  team: [
    { id:'priya', name:'Priya', role:'RN, 8 months' },
    { id:'tom',   name:'Tom',   role:'RN, 2 years' },
    { id:'amir',  name:'Dr. Khan', role:'PGY1 surgery' },
    { id:'leah',  name:'Leah',  role:'Nursing student' }
  ],
  gaps: {
    cognitive: 'Tachycardia and confusion blamed on post-op pain. No early warning score calculated.',
    technical: 'Antibiotic hung before blood cultures were drawn.',
    behavioural: 'Vague escalation call with no vitals and no read-back. A student cue went unheard.'
  },
  objectives: [
    'Recognize early sepsis with an early warning score',
    'Escalate with a structured SBAR call',
    'Start the sepsis bundle in the right order'
  ],
  intro: 'Tuesday, 14:00. The manikin in bed 12 is Mr. Doug Fraser, 68, post-op day 2 after a bowel resection. Four learners, first time working together, none of them have done a ward sim before. They will have 15 minutes in the room. You have 20 minutes to debrief.',
  steps: [
    { type:'choice', phase:'prebrief', title:'Open the prebrief',
      setup:[['narr','The four learners stand near the door. Priya is gripping her badge. Leah keeps glancing at the manikin.']],
      prompt:'How do you prebrief the group?',
      options:[
        { id:'a', grade:'best', strat:'Full prebrief: safety, objectives, logistics, orientation', s:[3,3,3,3], t:0, tags:[],
          text:'"Today is practice, not a test, and what happens here stays in this room. We assume everyone here is capable and wants to improve, so mistakes are expected. You get 15 minutes with a post-op patient, focused on noticing and escalating a change, then 20 minutes to debrief, and I will show you the manikin, monitor and phone first."',
          fb:'This covers all four pillars in under a minute: psychological safety, a learning focus without spoiling the diagnosis, time structure, and technology orientation. Naming mistakes as expected lowers threat before it builds. Orienting learners to the phone and monitor removes extraneous load that would otherwise leak into the debrief as frustration.',
          reply:[['priya','Okay. Good to know it is not graded.'],['leah','Can we touch the patient? Like, does he feel a pulse?']] },
        { id:'b', grade:'good', strat:'Logistics only', s:[1,2,1,2], t:0, tags:[],
          text:'"Here is the plan: 15 minutes in the room, 20 minutes debrief. The manikin speaks through me and the monitor is live. Let\'s go."',
          fb:'Clear on time and technology, which reduces uncertainty. It says nothing about confidentiality, error, or the basic assumption, so anxious learners fill the gap with their own story about being judged. It also gives no learning focus, so the debrief has nothing to anchor to.',
          reply:[['tom','Sure.'],['narr','Priya and Leah exchange a look.']] },
        { id:'c', grade:'weak', strat:'Evaluative framing', s:[0,1,1,1], t:0, tags:[],
          text:'"Treat this like a real shift. I will be watching and taking notes on everything you do, so give it your best."',
          fb:'This raises threat. "Watching and taking notes" signals assessment, and novice learners shift attention from the patient to self-monitoring, which adds extraneous load. Prefer: "This is practice. I take notes only to help our conversation afterwards."',
          reply:[['priya','...Okay.'],['narr','Leah steps behind Tom.']] },
        { id:'d', grade:'weak', strat:'Content cueing', s:[1,0,0,2], t:0, tags:[],
          text:'"We\'re doing sepsis today. Remember early warning scores and get blood cultures before antibiotics."',
          fb:'Announcing the diagnosis and the answers removes the recognition challenge, which is the main objective. Learners perform a checklist instead of revealing their real mental models, so the debrief loses its best material. Share the learning focus, not the answer key.',
          reply:[['amir','Sepsis, got it.']] }
      ]
    },
    { type:'narrative', phase:'scenario', title:'What happened in the room',
      paras:[
        'Priya takes handover at 14:05. Mr. Fraser is restless and says his belly hurts.',
        'Vitals: HR 112, BP 98/60, RR 24, T 38.4 °C, SpO2 94% on room air. Priya gives PRN hydromorphone and plans to recheck in 30 minutes.',
        'Leah notices he is confused about the date. She mentions it softly. Nobody responds.',
        'At minute 8 the BP falls to 86/50. Nobody calculates an early warning score.',
        'Priya calls Dr. Khan: "Mr. Fraser in 12 isn\'t looking great, can you come?" She gives no vitals. He does not read back.',
        'Dr. Khan arrives at minute 11 and orders piperacillin-tazobactam, a 500 mL bolus, lactate and blood cultures.',
        'The antibiotic is hung at minute 13. Blood cultures are drawn at minute 14, after the first dose is running.',
        'The scenario ends with BP 90/55 and the team unsure what comes next.'
      ],
      monitor:[
        { t:'00:00', rhythm:'sinus', hr:108, bp:'104/64', spo2:95, rr:22, temp:'38.1' },
        { t:'00:02', rhythm:'sinus', hr:112, bp:'98/60',  spo2:94, rr:24, temp:'38.4' },
        { t:'00:05', rhythm:'sinus', hr:114, bp:'96/58',  spo2:94, rr:24, temp:'38.4' },
        { t:'00:08', rhythm:'sinus', hr:118, bp:'86/50',  spo2:93, rr:26, temp:'38.5', alarm:true },
        { t:'00:09', rhythm:'sinus', hr:120, bp:'86/50',  spo2:93, rr:26, temp:'38.5', alarm:true },
        { t:'00:11', rhythm:'sinus', hr:122, bp:'84/48',  spo2:93, rr:26, temp:'38.6', alarm:true },
        { t:'00:14', rhythm:'sinus', hr:118, bp:'88/52',  spo2:94, rr:24, temp:'38.6', alarm:true },
        { t:'00:15', rhythm:'sinus', hr:116, bp:'90/55',  spo2:94, rr:24, temp:'38.6' }
      ],
      observed:['Anchoring on pain as the cause of tachycardia','No early warning score','Unstructured escalation, no read-back','Cultures drawn after antibiotic started','Student cue lost']
    },
    { type:'choice', phase:'reactions', title:'Reactions',
      setup:[['narr','Everyone sits. Priya exhales loudly. Tom is still frowning at the wall phone.']],
      prompt:'How do you open the debrief?',
      options:[
        { id:'a', grade:'best', strat:'Emotion invitation with normalization', s:[3,3,2,3], t:2, tags:['emotion'],
          text:'"Let\'s start with how you are feeling. That was a busy 15 minutes and the phone in there is clunky, so any frustration is fair game."',
          fb:'You invite emotion openly and normalize a system irritant before it becomes a hidden distraction. Venting early clears space for reflection later. Naming the phone also tells learners you see the environment, not only them.',
          reply:[['priya','Rattled. I felt one step behind the whole time.'],['tom','The phone line kept cutting out, I was so annoyed.'],['narr','Leah smiles slightly but says nothing.']] },
        { id:'b', grade:'good', strat:'One-word check-in', s:[2,3,2,3], t:2, tags:['emotion'],
          text:'"Let\'s go around. One word that captures that case for you."',
          fb:'Fast, inclusive, and gives every learner an equal first turn, which helps quiet voices. One word can hide the story behind it, so follow up on the strongest word before moving on.',
          reply:[['priya','Behind.'],['tom','Annoying.'],['amir','Late.'],['leah','Uncertain.']] },
        { id:'c', grade:'weak', strat:'Skipped reactions, singled out a learner', s:[0,0,1,1], t:1, tags:[],
          text:'"Let\'s jump straight in. Priya, why did you give the hydromorphone?"',
          fb:'Skipping reactions leaves emotion unprocessed, and it resurfaces later as defensiveness. "Why did you" aimed at one person in the first minute reads as blame. Open with reactions, then move to analysis with a preview statement.',
          reply:[['priya','Because he said he was in pain? Was that wrong?'],['narr','The room goes quiet.']] },
        { id:'d', grade:'weak', strat:'Premature evaluation', s:[1,0,0,2], t:1, tags:[],
          text:'"That went pretty well overall, so we can keep this quick."',
          fb:'Early global praise closes the door on concerns learners want to raise, and it conflicts with what they felt in the room. Learners discount feedback that does not match their experience. Ask before you evaluate.',
          reply:[['priya','Oh. Okay.'],['narr','Priya looks unconvinced.']] }
      ]
    },
    { type:'choice', phase:'description', title:'Description',
      prompt:'How do you establish the facts?',
      options:[
        { id:'a', grade:'best', strat:'Learner-led summary with shared diagnosis check', s:[3,3,3,3], t:2, tags:[],
          text:'"Tom, could you give us a 30-second summary of the case? Then, what was the working diagnosis, and does everyone agree?"',
          fb:'Short, learner-led, and it tests the shared mental model. The disagreement you uncover here, Priya only thinking of sepsis late, becomes your richest analysis material. Two minutes well spent.',
          reply:[['tom','Post-op day 2, got tachy and hypotensive. We thought pain at first, then sepsis, probably abdominal.'],['amir','Agree, intra-abdominal sepsis.'],['priya','I only thought sepsis once Dr. Khan said it.']] },
        { id:'b', grade:'weak', strat:'Minute-by-minute replay', s:[1,1,1,0], t:7, tags:[],
          text:'"Let\'s walk through it minute by minute from handover. Priya, start with the first set of vitals."',
          fb:'A full replay burns a third of your time and makes learners relive every misstep, which raises anxiety and cognitive load. It also puts Priya on stage first. Aim for a brief summary and move to analysis.',
          reply:[['priya','Okay, so first I got handover from the day nurse, and then...'],['narr','Seven minutes pass.']] },
        { id:'c', grade:'good', strat:'Facilitator summary', s:[2,2,1,3], t:1, tags:[],
          text:'"Here is what I saw: a post-op patient becoming septic, with some delays in recognition and treatment. Does that match your view?"',
          fb:'Efficient and neutral in tone. You lose the chance to hear the learners\' own frame, and you have already named the gap ("delays") before they have. Learner summaries reveal mental models, and facilitator summaries hide them.',
          reply:[['tom','Yeah, pretty much.']] }
      ]
    },
    { type:'choice', phase:'analysis', title:'Issue 1: Recognizing the slide',
      setup:[['narr','Gap: HR 112, T 38.4 and new confusion were treated as pain for 8 minutes.']],
      prompt:'How do you open the first performance gap?',
      options:[
        { id:'a', grade:'best', strat:'Focused facilitation: preview + advocacy-inquiry', s:[3,3,3,2], t:5, tags:['ai'],
          text:'"I\'d like to talk about the first 8 minutes, because early recognition is where sepsis outcomes are won. Priya, I saw hydromorphone go in with a heart rate of 112 and a fever, and I worried we lost time to call sepsis. How were you seeing it then?"',
          fb:'A preview statement, then an honest observation, your point of view, and a genuine question. The gap is cognitive, so the frame behind the action matters more than the action. Your curiosity keeps safety high while making the concern clear.',
          reply:[['priya','He kept saying his belly hurt, and post-op patients on my unit are always tachy. Pain was top of my list and I stayed there.'],['tom','Same. I didn\'t think fever plus confusion until later.']] },
        { id:'b', grade:'good', strat:'Learner self-assessment', s:[3,2,2,3], t:3, tags:[],
          text:'"Looking back at the first 8 minutes, what went well, and what would you change?"',
          fb:'Safe and efficient, and it lets learners find the gap themselves. Broad self-assessment often surfaces surface fixes ("check vitals sooner") without reaching the anchoring bias underneath. Follow with advocacy-inquiry if the frame stays hidden.',
          reply:[['priya','Went well: I did vitals quickly. Change: recheck sooner, I guess.']] },
        { id:'c', grade:'good', strat:'Directive feedback', s:[2,2,1,3], t:2, tags:['dir'],
          text:'"Fever, tachycardia and new confusion after surgery is sepsis until proven otherwise. Calculate the early warning score before you treat pain."',
          fb:'Accurate and concise. The gap here is a mental model, not missing knowledge: they know the sepsis criteria but did not apply them. Teaching without exploring why leaves the anchor in place for the next shift.',
          reply:[['priya','Right. Yes.'],['narr','She writes it down but looks deflated.']] },
        { id:'d', grade:'weak', strat:'Leading question', s:[0,1,1,2], t:2, tags:[],
          text:'"Didn\'t you think a heart rate of 112 was a bit high to blame on pain?"',
          fb:'A "guess what I\'m thinking" question with judgment built in. Learners hear criticism, defend, and stop sharing reasoning. Say what you saw and what you think openly, then ask how they saw it.',
          reply:[['priya','I mean... in hindsight, sure.'],['narr','Priya crosses her arms.']] }

    { type:'choice', phase:'analysis', title:'Human factors: the quiet voice', challenge:'voice',
      setup:[['narr','Leah hasn\'t spoken since reactions. She noticed the confusion in the room, but nobody heard her. She is looking at her notes.']],
      prompt:'What do you do?',
      options:[
        { id:'a', grade:'best', strat:'Direct, open invitation with open body language', s:[3,3,3,3], t:2, tags:['voice','hierarchy'],
          text:'(You turn toward Leah, hands open and relaxed.) "Leah, you were right beside Mr. Fraser. What did you notice about him in those first minutes?"',
          fb:'You name her useful position, not her rank, and ask an open question she is expert on. Turning your body and opening your hands signals her turn without pressure. This flattens the hierarchy between student and staff.',

        { id:'b', grade:'good', strat:'General invitation', s:[2,2,1,3], t:1, tags:[],
          text:'"Does anyone else have anything to add?"',
          fb:'Open and harmless, but quiet learners rarely take a general invitation, especially the most junior person in the room. Name the person and give a concrete, low-risk question.',

        { id:'c', grade:'weak', strat:'Labelling and leading', s:[0,1,1,2], t:1, tags:[],
          text:'"Leah, as the student, you probably didn\'t feel you could speak up, right?"',
          fb:'Well meant, but it labels her by rank in front of the team and answers for her. It reinforces the hierarchy you want to flatten. Ask what she noticed, not how junior she felt.',

    { type:'choice', phase:'analysis', title:'Issue 2: The call to Dr. Khan',
      setup:[['narr','Gap: "Mr. Fraser isn\'t looking great, can you come?" No vitals, no request, no read-back. Arrival took 3 minutes.']],
      prompt:'How do you explore the escalation?',
      options:[
        { id:'a', grade:'best', strat:'Focused facilitation: guided team self-correction', s:[3,3,3,2], t:4, tags:['peer'],
          text:'"Let\'s look at the call, because clear escalation gets help to the bedside faster. Dr. Khan, you were on the receiving end. What did you need to hear, and what did you get? Priya, what would you say next time?"',
          fb:'The team corrects itself using both sides of the phone line. The receiver\'s perspective makes the value of SBAR concrete in a way a lecture cannot. Peer insight also carries less threat than facilitator critique.',
          reply:[['amir','I heard "not looking great" and thought I could finish my note first. If I\'d heard "BP 86 and new confusion", I\'d have run.'],['priya','Next time I\'ll lead with the numbers and tell you what I need.']] },
        { id:'b', grade:'good', strat:'Learner self-assessment', s:[3,2,2,3], t:2, tags:[],
          text:'"Priya, how do you think the phone call went?"',
          fb:'Safe and fair. It relies on one person\'s view of a two-person event, so you miss the receiver\'s side, which carries the lesson. Bring the other party in.',

        { id:'c', grade:'good', strat:'Directive feedback', s:[2,2,1,3], t:2, tags:['dir'],
          text:'"When you escalate, use SBAR: situation, background, assessment, recommendation. Then ask for a read-back."',
          fb:'Correct and brief. They likely know SBAR already, so a reminder does not explain why it failed under pressure. Use teaching when the gap is knowledge, and exploration when the gap is performance under load.',
          reply:[['priya','Yes, we learned that in school.']] },
        { id:'d', grade:'weak', strat:'Extended lecture', s:[1,1,1,0], t:6, tags:[],
          text:'"Let me take a few minutes to go through SBAR in detail, including where it came from and the evidence behind it."',
          fb:'Six minutes of teaching drains a 20-minute debrief and pushes learners into passive listening. Intrinsic load rises with little payoff. Keep teaching to one or two key points tied to what happened.',
          reply:[['narr','Tom checks the clock. Amir\'s eyes glaze.']] }
      ]
    },
    { type:'choice', phase:'analysis', title:'Issue 3: Cultures and antibiotics',
      setup:[['amir','Honestly I thought we just had to get antibiotics in within the hour. The order doesn\'t matter, right?']],
      prompt:'Dr. Khan has stated a clear knowledge gap. How do you respond?',
      options:[
        { id:'a', grade:'best', strat:'Directive feedback', s:[3,3,3,3], t:2, tags:['dir'],
          text:'"I noticed the cultures were drawn after the antibiotic started. Next time, draw them first when you can do so without delaying the antibiotic, because even one dose can sterilize the cultures and hide the organism."',
          fb:'A clear knowledge gap calls for clear teaching. You follow the PEARLS pattern: behaviour, suggested behaviour, rationale. Two minutes, specific, and respectful.',
          reply:[['amir','That makes sense. I\'ll remember that.'],['tom','Our order set lists cultures first. I never knew why.']] },
        { id:'b', grade:'good', strat:'Focused facilitation', s:[3,2,2,1], t:4, tags:[],
          text:'"What are the team\'s thoughts on the order of cultures and antibiotics?"',
          fb:'Respectful, but the gap is already clear and the answer is factual. Exploring a knowledge gap costs time and can lead to peers guessing. When the learner has shown you the gap, close it.',

          text:'"Who can list the six steps of the Sepsis Six? Anyone?"',
          fb:'Quizzing on the spot is a common psychological safety threat. It rewards recall under pressure and embarrasses whoever gets it wrong. Teach the one point that matters instead.',

    { type:'choice', phase:'summary', title:'Application and summary',
      prompt:'Four minutes left. How do you close?',
      options:[
        { id:'a', grade:'best', strat:'Learner-guided summary with action plans', s:[3,3,3,3], t:3, tags:['lsum'],
          text:'"Let\'s go around. Each of you, one thing you\'ll take to your next shift and one thing you\'ll do differently. I\'ll add anything we missed."',
          fb:'Each learner commits to a concrete change in their own words, which improves transfer. Hearing four takeaways lets you check them against the three objectives. You fill gaps only if needed.',
          reply:[['priya','Early warning score before any PRN on a tachy patient.'],['amir','Cultures first, unless it delays the antibiotic.'],['tom','SBAR with the numbers first.'],['leah','If I see something, I\'ll say it twice.']] },
        { id:'b', grade:'good', strat:'Open group take-aways', s:[2,2,2,3], t:2, tags:[],
          text:'"What are some take-aways from this for your clinical practice?"',
          fb:'The right question from PEARLS. As an open group question, the most confident speakers answer and others coast. A round gives everyone a turn and a commitment.',
          reply:[['tom','Call earlier.'],['amir','Cultures before antibiotics.']] },
        { id:'c', grade:'good', strat:'Educator-driven summary', s:[2,2,1,3], t:1, tags:[],
          text:'"Key points: calculate the early warning score, escalate with SBAR, and draw cultures before antibiotics."',
          fb:'Accurate, aligned with objectives, and fast. Learners hear your list, not theirs, so ownership and recall are lower. Use it when time has run out, or after a learner round.',
          reply:[['narr','The learners nod.']] },
        { id:'d', grade:'weak', strat:'No summary', s:[1,0,0,2], t:0, tags:[],
          text:'"We\'re about out of time. Thanks everyone, great job!"',
          fb:'Without a summary, learning stays in the room. Even 90 seconds of "one thing you\'ll do differently" strengthens transfer to practice.',
          reply:[['narr','The learners gather their things.']] }
      ]
    }

          text:'"IM epinephrine for anaphylaxis is 0.01 mg/kg of the 1 mg/mL solution. For 15 kg that\'s 0.15 mg, which is 0.15 mL. Next time, say both the milligrams and the millilitres out loud, and use the weight chart or an auto-injector when you can."',

          fb:'Learners own their commitments, and you close the loop on the parked topic so nothing feels abandoned. You check alignment with all three objectives.',

/* ==========================================================================

   self-correction; reasoning unclear -> advocacy-inquiry; knowledge gap ->
   directive after eliciting perspective; several perspectives -> circular

        { id:'c', grade:'weak', g:`"Let's hear from Elena first"`, strat:`Opened with SP feedback before learner reactions`, s:[0,1,1,2], t:2, tags:[],
          text:`"Elena, let's start with you. How did that feel on the receiving end?"`,
          fb:`SP feedback is valuable, but opening with it before the learners have spoken puts them on trial while they are still raw. Learner reactions first, then SP feedback during analysis.`,
          reply:[['elena',`Honestly? I felt dismissed.`],['narr',`Dr. Patel's face drops.`]] },
        { id:'d', grade:'weak', g:`"Let's go through the SPIKES steps"`, strat:`Skipped reactions`, s:[0,0,1,2], t:1, tags:[],
          text:`"Right, let's go through the SPIKES steps and see which ones you missed."`,
          fb:`Jumping to a checklist while a learner is tearful tells him his feelings do not count. Reactions come first.`,
          reply:[['raj',`Sure.`],['narr',`He wipes his eyes and stops talking.`]] }
      ]
    },
    { type:'choice', phase:'reactions', title:`Human factors: when it is personal`, challenge:'emotion',
      setup:[['raj',`Sorry. My dad died last year, in an ED like this. I thought I was over it.`]],
      prompt:`Dr. Patel has disclosed a personal loss in front of the group. What do you do?`,
      options:[
        { id:'a', grade:'best', g:`Thank him, normalize, offer choice and follow-up`, strat:`Validation, normalization and choice`, s:[3,3,3,3], t:3, tags:['emotion'],
          text:`"Thank you for trusting us with that, and I'm sorry about your dad. It makes complete sense that this brought it back. You can keep going, take a break, or step out, and there's no wrong choice. Either way, I'd like to check in with you one-to-one after we finish."`,
          fb:`You validate without turning the debrief into therapy, give him control, and promise a private follow-up where you can point him to support services. The INACSL standard asks for support to be available when distress is unexpected.`,
          reply:[['raj',`I'll stay. I want to learn how to do this better.`],['priya',`For what it's worth, I'd never have guessed. You were calm.`]] },
        { id:'b', grade:'good', g:`Suggest a break outside`, strat:`Offered a break only`, s:[2,2,1,2], t:1, tags:['emotion'],
          text:`"Do you want to take a few minutes outside?"`,
          fb:`Kind, but it removes him before he has chosen, and nothing tells him he will be followed up. Offer the choice and a check-in.`,
          reply:[['raj',`No, I'm fine.`]] },
        { id:'c', grade:'weak', g:`Explore his father's death`, strat:`Turned the debrief into therapy`, s:[1,1,1,0], t:5, tags:[],
          text:`"Tell us more about your dad. What happened in the ED that day?"`,
          fb:`A debrief is not a counselling session. Exploring a personal loss in front of peers exposes him and takes the group far from the objectives. Offer support privately.`,
          reply:[['narr',`Dr. Patel talks for five minutes. Priya looks uncomfortable. Elena looks away.`]] },
        { id:'d', grade:'weak', g:`"Let's keep it about the scenario"`, strat:`Moved past the disclosure`, s:[0,1,0,3], t:0, tags:[],
          text:`"Let's try to keep things about the scenario."`,
          fb:`Moving on without acknowledgement tells everyone that emotion is off limits here, and leaves a distressed learner alone with it.`,
          reply:[['raj',`Sure. Sorry.`]] }
      ]
    },
    { type:'choice', phase:'description', title:`Description`,
      prompt:`Now you need a short, shared account of the conversation.`,
      options:[
        { id:'a', grade:'best', g:`Priya summarizes, then "what was your goal?"`, strat:`Learner summary with a goal check`, s:[3,3,3,3], t:2, tags:[],
          text:`"Priya, could you give us a short summary of how the conversation went? Then each of you: what were you trying to achieve in that room?"`,
          fb:`A brief learner account plus a goal check shows the frames they worked from: Dr. Patel wanted to be "accurate", Priya wanted to "not make it worse". Both frames drive what happened.`,
          reply:[['priya',`He told her in the corridor, she didn't understand "lost", she cried, he left, I stayed but froze.`],['raj',`I wanted to be accurate and not give false hope.`],['priya',`I wanted not to make it worse.`]] },
        { id:'b', grade:'weak', g:`Replay the recording line by line`, strat:`Full video replay`, s:[1,1,1,0], t:8, tags:[],
          text:`"Let's watch the whole recording and pause on every line."`,
          fb:`Replaying a painful conversation line by line eats a third of your time and makes the learners relive it. Use one short clip for one teaching point, if at all.`,
          reply:[['narr',`Eight minutes later, Dr. Patel has his head in his hands.`]] },
        { id:'c', grade:'good', g:`You summarize`, strat:`Facilitator summary`, s:[2,2,1,3], t:1, tags:[],
          text:`"Here's what I saw: the news was given standing, with medical terms, and the doctor left early. Fair?"`,
          fb:`Efficient, but you named the gaps before hearing their goals. The frames behind the words are the richest material here.`,
          reply:[['raj',`Fair.`]] }
      ]
    },
    { type:'choice', phase:'analysis', title:`Issue 1: "We lost him"`,
      setup:[['narr',`Gap: jargon, then a euphemism. Elena did not understand that her husband had died.`]],
      prompt:`Dr. Patel's reasoning is the key. How do you explore it?`,
      options:[
        { id:'a', grade:'best', g:`Preview, "I heard... I was worried... what was going on for you?"`, strat:`Focused facilitation: preview + advocacy-inquiry`, s:[3,3,3,2], t:5, tags:['ai'],
          text:`"I'd like to look at the words we use, because families remember them for years. I heard 'asystole', then 'we lost him', and Elena asked where he was. I was worried she didn't know he had died. What was going on for you when you chose those words?"`,
          fb:`The gap sits in his frame: plain words felt brutal to him. Advocacy-inquiry brings that out without blame. The GRIEV_ING protocol's rule follows naturally: say "died" or "dead", then stop and give space.`,
          reply:[['raj',`"Died" felt too harsh. I thought softer words were kinder.`],['priya',`But she didn't understand. Softer made it longer.`],['raj',`So the kind thing is to be clear. "Carlos has died." Then stop.`]] },
        { id:'b', grade:'good', g:`Teach: say "died"`, strat:`Directive feedback`, s:[2,2,2,3], t:2, tags:['dir'],
          text:`"In death notification, use the word 'died' or 'dead'. Euphemisms like 'lost' confuse families."`,
          fb:`Correct, and backed by the GRIEV_ING protocol, but you skipped his reasoning. Unless the belief that plain words are cruel changes, he will soften them again under pressure.`,
          reply:[['raj',`Okay.`]] },
        { id:'c', grade:'weak', g:`"Why would you say 'lost'?"`, strat:`Accusatory why`, s:[0,1,1,2], t:1, tags:[],
          text:`"Why would you say 'we lost him'? That's a classic mistake."`,
          fb:`An accusatory why to a learner who has just disclosed personal grief is especially harmful. He defends himself instead of reflecting.`,
          reply:[['raj',`Everyone says it.`],['narr',`He folds his arms.`]] },
        { id:'d', grade:'good', g:`"What went well, what would you change?"`, strat:`Learner self-assessment`, s:[3,2,2,3], t:3, tags:[],
          text:`"Looking back on the words you used, what went well, and what would you change?"`,
          fb:`Safe, but he believes the softer words were kind, so he cannot name this gap himself. Self-assessment works when learners can see the problem.`,
          reply:[['raj',`I'd sit down, I guess?`]] }
      ]
    },
    { type:'choice', phase:'analysis', title:`Human factors: Elena's feedback`, challenge:'peer',
      setup:[['elena',`I have some notes about how that felt, if it helps.`]],
      prompt:`The simulated participant offers feedback. How do you bring her in?`,
      options:[
        { id:'a', grade:'best', g:`Ask learners first, then her specific moments`, strat:`Structured SP feedback with learner consent`, s:[3,3,3,3], t:4, tags:['peer'],
          text:`"Thank you, Elena. Dr. Patel, Priya, is it okay to hear Elena's perspective now? Elena, could you share one or two moments, what was said, and how it landed for you as the wife?"`,
          fb:`You ask the learners first, then steer the SP to specific, observable moments in first person, which is how the ASPE standards describe SP feedback. It turns her experience into precise, usable data.`,
          reply:[['elena',`When I heard "we lost him", I honestly thought he'd been moved. And when the doctor looked at his pager, I felt I wasn't worth his time.`],['elena',`When Priya knelt down and handed me a tissue, I felt less alone.`],['raj',`The pager. I didn't even notice I did that.`]] },
        { id:'b', grade:'good', g:`"Go ahead, Elena"`, strat:`Open SP feedback`, s:[2,2,2,3], t:3, tags:[],
          text:`"Sure, go ahead, Elena."`,
          fb:`Useful, but without framing the SP may give global impressions ("it felt cold") rather than specific moments, which are harder to learn from.`,
          reply:[['elena',`Overall it felt quite cold, to be honest.`],['narr',`Dr. Patel nods slowly.`]] },
        { id:'c', grade:'weak', g:`Decline: "we'll keep it to the team"`, strat:`Excluded the SP`, s:[1,1,0,3], t:0, tags:[],
          text:`"Thanks, Elena, but we'll keep this to the clinical team."`,
          fb:`You lose the one perspective the learners cannot get anywhere else: how their words landed. SP feedback is a core part of communication simulation.`,
          reply:[['elena',`Of course.`]] },
        { id:'d', grade:'weak', g:`Ask her to rate the doctor`, strat:`Made the SP an assessor`, s:[0,1,1,2], t:2, tags:[],
          text:`"Elena, out of ten, how would you rate Dr. Patel's performance?"`,
          fb:`Asking the SP to grade a learner in front of the group creates threat and gives a number, not a lesson. Ask for specific moments and their impact instead.`,
          reply:[['elena',`Maybe a four?`],['narr',`The room goes quiet.`]] }
      ]
    },
    { type:'choice', phase:'analysis', title:`Issue 2: Filling the silence`,
      setup:[['priya',`I just didn't know what to say when she cried. The silence felt awful.`]],
      prompt:`Priya names a skill gap. How do you close it?`,
      options:[
        { id:'a', grade:'best', g:`Teach silence plus NURSE statements`, strat:`Directive feedback with a model`, s:[3,3,3,3], t:3, tags:['dir'],
          text:`"That's honest, thank you. Two tools. First, silence is not failure: sit, stay close, and count to ten in your head. Second, when you speak, name the emotion instead of adding facts. Something like, 'This is a terrible shock,' or 'I can't imagine how hard this is.' That's the NURSE approach: name, understand, respect, support, explore."`,
          fb:`She has named a knowledge gap and asked for help, so teach. Short, specific, with phrases she can use tomorrow. Evidence from SPIKES and VitalTalk puts responding to emotion at the heart of bad news conversations.`,
          reply:[['priya',`"This is a terrible shock." I could have said that.`],['raj',`And I could have stopped talking.`]] },
        { id:'b', grade:'good', g:`Ask the group what they'd say`, strat:`Open exploration`, s:[3,2,2,1], t:3, tags:[],
          text:`"What could anyone say in that moment?"`,
          fb:`Respectful, but the group has just shown it does not have these phrases. Brief teaching after hearing her gets further, faster.`,
          reply:[['raj',`Sorry for your loss?`],['narr',`Nobody offers more.`]] },
        { id:'c', grade:'weak', g:`Lecture on grief theory`, strat:`Extended lecture`, s:[1,1,1,0], t:6, tags:[],
          text:`"Let me explain the stages of grief and the literature on bereavement." You talk for six minutes.`,
          fb:`A lecture on theory does not give her words for the next time a family member cries. Keep teaching short and practical.`,
          reply:[['narr',`Priya takes notes she will not use.`]] }
      ]
    },
    { type:'choice', phase:'summary', title:`Application and summary`,
      prompt:`Five minutes left. How do you close?`,
      options:[
        { id:'a', grade:'best', g:`Take-aways, self-care plan, thank Elena`, strat:`Learner-guided summary with self-care and SP de-roling`, s:[3,3,3,3], t:5, tags:['lsum','emotion'],
          text:`"Let's go around: one thing you'll take into your next death notification, and one thing you'll do for yourself after a hard shift. Elena, thank you, and please take a moment to step out of the role before you leave. Dr. Patel, let's grab five minutes after this."`,
          fb:`You close with concrete commitments, add self-care, de-role the SP as the ASPE standards recommend, and keep your promise to follow up. After a hard case, how people leave matters as much as what they learned.`,
          reply:[['raj',`Sit down, say "died", then stop talking.`],['priya',`Stay close and name the feeling.`],['raj',`And I'll call my sister tonight.`],['elena',`Thank you both. I'm Maria again now.`]] },
        { id:'b', grade:'good', g:`Take-aways only`, strat:`Learner take-aways without self-care`, s:[2,2,2,3], t:3, tags:[],
          text:`"What will each of you do differently next time?"`,
          fb:`Good, learners speak first. After this case, add self-care and de-role the SP so nobody leaves carrying the scenario.`,
          reply:[['raj',`Say "died".`],['priya',`Use silence.`]] },
        { id:'c', grade:'weak', g:`"Out of time, thanks all"`, strat:`No summary`, s:[0,0,0,2], t:0, tags:[],
          text:`"We're out of time, thanks all."`,
          fb:`Ending abruptly after a disclosure of personal grief leaves a learner exposed and an SP still in role. Protect the last five minutes.`,
          reply:[['narr',`Dr. Patel leaves quickly without speaking to anyone.`]] }
      ]
    }
  ]
},

{
