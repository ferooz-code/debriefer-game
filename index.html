onable that is wrong here.":[920.354,13.09],"coach|Your instinct. Watch who holds the floor. Give the quieter voice a safe, specific opening.":[933.564,5.427],"coach|Strength. Human factors: two stories about the lead. Circular question. GAS matches several perspectives with a circular question.":[939.111,8.409],"coach|A circular question gets the same insight with less heat.":[947.64,3.296],"coach|Try next time. Human factors: two stories about the lead. You chose: Advocacy-inquiry to one person. Try circular question instead. GAS matches several perspectives with a circular question.":[951.055,13.157],"coach|Okafor defends himself, and the team's shared pattern never gets examined.":[964.332,4.338],"coach|Try next time. Human factors: two stories about the lead. You chose: Took sides. Try circular question instead. GAS matches several perspectives with a circular question.":[968.79,11.865],"coach|Chris will stop raising concerns, which is the opposite of what you want.":[980.775,4.103],"coach|Try next time. Human factors: two stories about the lead. You chose: Shut down the conflict. Try circular question instead. GAS matches several perspectives with a circular question.":[984.998,12.388],"coach|Nobody is blamed for a latent safety threat.":[997.506,2.457],"coach|Strength. Topic 2: The magnesium delay. Systems-focused inquiry. GAS matches system problems with systems-focused inquiry.":[1000.083,8.681],"coach|Try next time. Topic 2: The magnesium delay. You chose: Directive feedback on closed loop. Try systems-focused inquiry instead. GAS matches system problems with systems-focused inquiry.":[1008.884,13.438],"coach|Try next time. Topic 2: The magnesium delay. You chose: Normalized a system flaw. Try systems-focused inquiry instead. GAS matches system problems with systems-focused inquiry.":[1022.442,13.012],"coach|Maya becomes defensive and the stock problem stays hidden.":[1035.574,3.447],"coach|Try next time. Topic 2: The magnesium delay. You chose: Blamed an individual. Try systems-focused inquiry instead. GAS matches system problems with systems-focused inquiry.":[1039.142,12.622],"coach|A clear signpost that the debrief is ending helps people leave settled.":[1051.884,4.096],"coach|Strength. Summarize. Learner take-aways with commitments, signposted ending. Learners speak first, each commits to a behaviour, and you add the one system action.":[1056.1,9.913],"coach|Try next time. Summarize. You chose: Facilitator summary. Try learner take-aways with commitments, signposted ending instead. Learners speak first, each commits to a behaviour, and you add the one system action.":[1066.133,13.525],"coach|Try next time. Summarize. You chose: Take-aways without a commitment. Try learner take-aways with commitments, signposted ending instead. Learners speak first, each commits to a behaviour, and you add the one system action.":[1079.778,14.267],"coach|Protect the last four minutes.":[1094.165,1.478],"coach|Try next time. Summarize. You chose: No summary. Try learner take-aways with commitments, signposted ending instead. Learners speak first, each commits to a behaviour, and you add the one system action.":[1095.762,12.931]},"gas-hyperk":{"narr|Five learners. Ben is bouncing on his toes. Dr. Patel is reading the monitor settings.":[0.0,6.14],"narr|This is a high-intensity resus. How do you open?":[6.26,3.358],"you|This is about learning and improvement, not blame. Everyone here is capable and wants to do their best. Resus sims can feel very real, and the outcome may not be good, so if you need a moment, step out and come back. 16 minutes, then 25 minutes to gather, analyze and summarize.":[9.738,19.291],"ben|Good to know.":[29.15,1.015],"grace|Appreciated.":[30.285,1.251],"coach|Strong choice. For a high-intensity case the opening adds an honest warning and a step-out rule.":[31.656,5.692],"you|Learning, not blame. What's said here stays here. 16 minutes in, 25 minutes of debrief.":[37.468,6.584],"raj|Let's go.":[44.172,0.828],"coach|Workable. Safe and clear, but with a likely emotional outcome, a short warning and a step-out rule would protect the newest nurse in the room.":[45.12,8.519],"you|Fair warning: this is the hardest scenario we run. Most teams fail it.":[53.759,4.756],"ben|Great.":[58.634,0.713],"narr|Ben stops bouncing.":[59.468,1.633],"coach|Missed opportunity. Predicting failure raises threat and primes defensiveness for the debrief.":[61.221,5.561],"you|You all know how this works. In you go.":[66.902,2.505],"narr|They file in without a word.":[69.527,2.185],"coach|Missed opportunity. Skipping the opening assumes a safety that nobody has built. Even experienced teams need the purpose and the basic assumption said out loud.":[71.832,10.056],"narr|Mr. Osei is pale and weak. The monitor shows tall, peaked T waves. Nobody comments on it.":[82.008,6.522],"narr|At minute 2 he loses his pulse. PEA. Ben starts compressions and Dr. Patel calls the arrest.":[88.649,6.805],"narr|Minute 3: Grace says, He's a dialysis patient, he missed... Dr. Patel cuts in: Not now. Adrenaline, please.":[95.574,7.55],"narr|Minute 5: Dr. Patel snaps at Ben, Those compressions are useless. Harder. Ben goes quiet and pale.":[103.244,7.24],"narr|Pulse checks run long, up to 18 seconds. Sofia places a supraglottic airway at minute 6.":[110.604,6.721],"narr|Minute 9: Tom asks, Should we go through the Hs and Ts? Grace repeats, Dialysis. Missed session. Dr. Patel orders calcium.":[117.446,9.127],"narr|Calcium goes in at minute 11, then insulin with dextrose. Return of circulation at minute 14.":[126.693,7.342],"narr|The scenario ends at minute 16 with a pulse, blood pressure 84 over 50, and an exhausted team.":[134.155,7.168],"narr|Ben sits apart, staring at his hands. Dr. Patel is already on his phone. Grace is tight-lipped.":[141.443,6.753],"narr|The room is tense. How do you open?":[148.316,2.437],"you|That was an intense 16 minutes. Phones away for now, please. Let's start with how you're feeling. Anyone can go first, and it's fine to just listen. You pull your chair next to Ben's.":[150.873,12.228],"sofia|Wired. Relieved we got him back.":[163.221,1.643],"grace|Angry, if I'm honest.":[164.984,1.416],"ben|I feel like I was the problem.":[166.52,1.948],"raj|Stressed. It was a hard code.":[168.588,1.62],"coach|Strong choice. You name the intensity, remove a distraction, and invite feelings without forcing anyone.":[170.328,6.16],"you|One word each for how that felt.":[176.608,1.978],"sofia|Relieved.":[178.705,0.679],"grace|Angry.":[179.505,0.775],"ben|...Bad.":[180.4,0.741],"raj|Stressed.":[181.261,0.709],"tom|Tired.":[182.09,0.6],"coach|Workable. Quick and everyone speaks. With this much emotion, one word may not be enough, so be ready to follow up with Ben and Grace.":[182.81,7.74],"you|Great job, you got him back! So let's look at what could be better.":[190.67,3.833],"narr|Grace raises an eyebrow. Ben does not look up.":[194.623,3.416],"coach|Missed opportunity. Early praise glosses over what Ben and Grace are carrying, and it clashes with how they feel.":[198.16,6.647],"you|Ben, let's start with you. How do you think your compressions went?":[204.927,3.614],"ben|Apparently useless.":[208.662,1.427],"narr|The room goes silent.":[210.208,1.664],"coach|Missed opportunity. Opening with the most vulnerable learner's performance, before any reactions, deepens his distress in front of the whole team.":[211.992,8.51],"ben|He said my compressions were useless. He's probably right.":[220.622,3.399],"narr|Dr. Patel shifts in his chair.":[224.141,2.251],"narr|Ben is distressed. What do you do?":[226.513,2.432],"you|Ben, thank you for saying that. Hearing that in the middle of a code is hard, and it's normal for it to stay with you. For what it's worth, the feedback device showed your depth at 5 to 6 centimetres most of the time. We'll look at the pauses as a team issue later.":[229.065,16.457],"ben|Really? Okay. That helps.":[245.642,1.719],"raj|Ben, I'm sorry. That came out harsh. I was stressed.":[247.481,2.544],"narr|Ben nods. His shoulders drop a little.":[250.145,2.489],"coach|Strong choice. You validate and normalize first, then replace a harsh comment with objective data.":[252.754,5.9],"you|That sounds really hard. Do you want to take a moment outside?":[258.773,3.789],"ben|No, I'm fine.":[262.683,1.32],"narr|He is not fine.":[264.123,1.272],"coach|Workable. Kind, and the step-out option matters. But it removes Ben while leaving the harm unaddressed, and he comes back to a room that never corrected the record.":[265.515,9.854],"you|It's just a sim, Ben. Don't take it personally.":[275.489,2.968],"ben|Sure.":[278.577,0.607],"narr|Ben stares at the floor.":[279.304,1.952],"coach|Missed opportunity. Minimizing tells Ben his reaction is wrong. He stops sharing, and the harm from the code goes home with him.":[281.376,7.738],"you|Dr. Patel, why did you say that to him?":[289.234,2.846],"raj|Because the compressions were shallow. I was running a code.":[292.2,2.626],"narr|Ben shrinks further.":[294.946,1.519],"coach|Missed opportunity. A public, accusatory why to the senior escalates the conflict and makes Ben the cause of a confrontation.":[296.585,7.798],"raj|Let me summarize. PEA arrest, hyperkalaemia, we got there, circulation back at 14.":[304.503,4.674],"narr|Dr. Patel has started to give the account for everyone. What next?":[309.297,4.438],"you|Thanks, Dr. Patel, that's the headline. Let's hear it from other spots in the room too. Tom, from the drugs position, and Grace, from where you stood: when did high potassium first come up for you?":[313.854,12.51],"tom|Minute 9, when I asked about the Hs and Ts.":[326.484,2.583],"grace|Minute 3. I said dialysis and missed session. I was told not now.":[329.187,3.971],"raj|I didn't register that. I heard noise, not information.":[333.278,2.919],"coach|Strong choice. The senior defining the account is a common GAS error. You accept his summary without a rebuke, then widen it.":[336.316,7.9],"you|Good, that's clear. Let's move on.":[344.337,1.905],"narr|Grace's jaw tightens.":[346.361,1.858],"coach|Workable. Efficient, but the account belongs to the senior. Grace's crucial minute-3 cue stays hidden, and so does your best analysis topic.":[348.339,8.97],"you|Let's go through all 16 minutes in order. Who called the arrest?":[357.429,3.972],"narr|Eight minutes later you reach minute 9 of the sim.":[361.521,3.254],"coach|Missed opportunity. A full replay is a named GAS error. It eats a third of your time and makes Ben relive the worst moment again.":[364.895,8.139],"you|Stop there. Let's hear from someone who wasn't in charge.":[373.154,3.121],"raj|Fine.":[376.395,0.592],"narr|Dr. Patel folds his arms for the rest of the session.":[377.107,3.691],"coach|Missed opportunity. Cutting off the senior publicly models the exact behaviour you want to change.":[380.919,5.655],"narr|Gap: Grace named the cause at minute 3. Calcium went in at minute 11.":[386.693,4.688],"narr|This gap sits in the lead's thinking. How do you explore it?":[391.501,3.557],"you|I'd like to look at minute 3 to minute 9, because in PEA the cause is often the cure. Dr. Patel, I heard Grace mention dialysis at minute 3, and I saw peaked T waves on the monitor. I was worried we were running the algorithm without a cause in mind. What was your focus at that point?":[395.178,19.631],"raj|Adrenaline, rhythm checks, airway. I planned to do Hs and Ts when things settled. They never settle.":[414.929,5.07],"grace|And when I spoke, I didn't say what I wanted. I could have said I think it's potassium, I want calcium.":[420.119,5.351],"sofia|What if we check Hs and Ts at the first rhythm check, every time?":[425.59,3.744],"coach|Strong choice. The reasoning behind the delay is not visible, so advocacy-inquiry fits.":[429.454,5.467],"you|As a team, what's the standard for reversible causes in PEA, and how close did we get?":[435.041,6.116],"tom|Earlier. We knew that.":[441.277,1.009],"coach|Workable. Reasonable, but the reason the lead delayed is still hidden. Without that frame, the team's fix stays on the surface: do Hs and Ts earlier.":[442.406,9.711],"you|Why did you ignore Grace?":[452.238,1.657],"raj|I didn't ignore anyone. I was running a code.":[454.014,2.286],"narr|Grace looks away.":[456.42,1.421],"coach|Missed opportunity. An accusatory why to the senior produces a defence, not reflection. You also made Grace the cause of his discomfort.":[457.961,8.735],"you|Let me go through all the Hs and Ts, and the evidence for each. You talk for six minutes.":[466.816,5.9],"narr|Dr. Patel checks the clock.":[472.836,2.069],"coach|Missed opportunity. Every learner here knows the Hs and Ts. The gap was in how the team used them under pressure, which a lecture cannot reach.":[475.024,8.663],"tom|I wasn't sure how much calcium to draw up. I guessed.":[483.807,2.664],"narr|Tom has named a knowledge gap. How do you close it?":[486.591,3.257],"you|Thanks for saying that, Tom. In suspected hyperkalaemic arrest, give calcium chloride 10 percent, 10 millilitres IV, or calcium gluconate 10 percent, 30 millilitres, then insulin with dextrose. Say the dose out loud so the lead can confirm it. And check your local protocol.":[489.968,19.878],"tom|Ten of chloride, or thirty of gluconate. I'll put it on a card in the drug tray.":[509.966,4.58],"raj|And I'll call the dose, not just the drug.":[514.667,1.916],"coach|Strong choice. He named the gap himself, so teach it. Specific doses, the next step, and a team habit, all in under two minutes.":[516.702,7.836],"you|What do others think the dose is?":[524.658,1.859],"sofia|One amp?":[526.638,0.681],"grace|Of which one, though?":[527.439,1.252],"narr|Nobody is sure.":[528.81,1.473],"coach|Workable. Respectful, but it turns a clear fact into a guessing game, and it costs time you need for the team topics.":[530.403,6.825],"you|Tom, at what potassium level do we treat? Anyone?":[537.348,3.281],"tom|Six? Seven?":[540.75,0.845],"narr|Tom looks at the table.":[541.715,1.667],"coach|Missed opportunity. Quizzing someone who just admitted a gap punishes honesty. The next person with a gap will stay quiet.":[543.502,7.357],"sofia|The pauses felt long, but nobody was counting.":[550.979,2.542],"narr|Long pauses were a team and set-up problem. How do you handle it?":[553.642,4.082],"you|Let's look at the set-up. What in the room could have helped you keep pauses under 10 seconds?":[557.844,5.051],"grace|The feedback screen was facing the wall.":[563.015,2.1],"ben|Nobody called the pause time. The recorder could count out loud.":[565.235,3.58],"raj|I'll pre-announce: Pulse check in 10 seconds. Charge the defib. Ben, get ready to swap.":[568.935,4.12],"coach|Strong choice. Framing it as a system question stops the pauses landing on Ben again.":[573.175,5.438],"you|Pauses should be under 10 seconds. Next time, plan the pulse check before you stop.":[578.733,5.298],"raj|Noted.":[584.151,0.645],"coach|Workable. Correct and quick, but it misses the set-up problems the team could have found and fixed themselves.":[584.916,5.978],"you|Ben, those pauses were long. Next time, get back on the chest faster.":[591.014,4.41],"ben|Okay.":[595.544,0.859],"narr|Ben shrinks back into his chair.":[596.523,1.971],"coach|Missed opportunity. You just rebuilt Ben's confidence, and this knocks it down again. The pauses were the team's, not his.":[598.613,7.068],"you|Let's also go through the airway, the drug timings, the documentation and the handover.":[605.801,5.726],"narr|Twenty minutes gone. Everyone is flagging.":[611.647,2.717],"coach|Missed opportunity. Trying to discuss every error is a named GAS pitfall. It overloads the team and crowds out the summary.":[614.483,7.819],"narr|Five minutes left. How do you close this debrief?":[622.422,3.248],"you|Let's go around: one take-away and one thing you'll do on your next shift. Then I'll add anything we missed. After we finish, I'll stay for a few minutes if anyone wants to talk.":[625.79,11.513],"raj|Hs and Ts at the first rhythm check. And listen when someone names a cause.":[637.423,4.204],"grace|Say the cause and what I want, with the lead's name.":[641.747,2.778],"tom|Call doses out loud.":[644.644,1.19],"sofia|Count the pauses out loud.":[645.954,1.389],"ben|My compressions were okay. I'll trust the device, not the noise.":[647.463,3.71],"narr|Ben stays behind for a minute. He leaves smiling.":[651.294,3.142],"coach|Strong choice. Learners speak first, each commits to a behaviour, and you signal the end.":[654.556,5.139],"you|What's one thing each of you learned today?":[659.815,2.178],"raj|Think about causes early.":[662.113,1.471],"ben|Not sure yet.":[663.704,1.267],"coach|Workable. Learners go first, which is right. Adding what will you do differently? turns each insight into a plan.":[665.091,6.551],"you|Key points: causes early in PEA, calcium doses, say what you want, and keep pauses short.":[671.762,6.525],"narr|Everyone nods. Ben leaves first.":[678.408,2.439],"coach|Workable. Accurate but it is yours, not theirs, and it misses the chance to check on Ben before he leaves.":[680.967,6.138],"you|We're out of time. Thanks, everyone.":[687.225,2.153],"narr|Ben is the first out of the door.":[689.498,2.513],"coach|Missed opportunity. Ending without a summary leaves Ben's distress unresolved and the lessons in the room.":[692.131,6.411],"coach|Level 3. The Hidden Cause. Hyperkalaemic cardiac arrest in a dialysis patient. Your goals: Review reversible causes early in PEA arrest. Treat suspected hyperkalaemia in cardiac arrest. Build a team where concerns land, even under pressure.":[698.662,17.421],"coach|Your instinct. Cover safety, objectives, logistics and orientation, without giving away the answer.":[716.203,6.38],"coach|People cope better with a hard outcome they were told might happen, and the rule gives them control.":[722.703,5.187],"coach|Strength. Open the session. Full opening with an emotional safety plan. For a hi
