  },
  objectives: [
    `De-escalate an angry family member by naming the emotion underneath`,
    `Disclose a patient safety event honestly, with an apology`,
    `Know when to set a boundary and when to call for help`
  ],
  intro: `Sunday, 14:00. Mrs. Joan Brooks, 82, fell overnight going to the bathroom. She waited three hours for pain relief and nobody called her family. Her son Daniel has just arrived and seen the bruise on her face. Tom, Leah and Dr. Khan are on the ward. Daniel is played by a trained simulated participant who joins the debrief. 10 minutes in the room. You have 25 minutes to debrief using GAS.`,
  steps: [
    { type:'choice', phase:'prebrief', title:`Open the session`,
      setup:[['narr',`Tom jokes that he deals with angry families every weekend. Leah looks nervous.`]],
      prompt:`This scenario involves a raised voice. How do you open?`,
      options:[
        { id:'a', grade:'best', g:`Purpose, SP role, a safe word`, strat:`Full opening with an SP safety plan`, s:[3,3,3,3], t:0, tags:[],
          text:`"This session is about learning and improvement, not blame. Daniel is a trained simulated participant. He will be angry, but he won't touch anyone. If anyone feels unsafe, say 'time out' and everything stops. Afterwards he'll give you feedback from the son's point of view. 10 minutes in, then 25 to gather, analyze and summarize."`,
          fb:`A simulated confrontation needs clear physical boundaries and a pause word. Naming the SP's feedback role in advance makes it feel expected, not like an ambush.`,
          reply:[['leah',`A time-out word helps.`],['tom',`Sounds good.`]] },
        { id:'b', grade:'good', g:`Purpose and timing`, strat:`Standard opening, no safety plan`, s:[2,3,2,3], t:0, tags:[],
          text:`"Learning, not blame. 10 minutes in the room, then 20 minutes to debrief."`,
          fb:`Clear, but a confrontation scenario needs a pause word and a word on physical boundaries.`,
          reply:[['tom',`Let's go.`]] },
        { id:'c', grade:'weak', g:`"He's going to be really aggressive"`, strat:`Threat framing`, s:[0,1,1,1], t:0, tags:[],
          text:`"Heads up, this guy is going to be really aggressive. Good luck."`,
          fb:`Priming learners to expect aggression makes them defensive before the first word, and they meet anger with guardedness.`,
          reply:[['leah',`Great.`],['narr',`Leah steps back.`]] },
        { id:'d', grade:'weak', g:`Teach de-escalation first`, strat:`Content cueing`, s:[1,0,0,2], t:0, tags:[],
          text:`"Remember: acknowledge, apologize, don't say calm down."`,
          fb:`Handing over the answers removes the chance to see their real instincts under pressure.`,
          reply:[['tom',`Acknowledge, apologize. Easy.`]] }
      ]
    },
    { type:'narrative', phase:'scenario', title:`What happened on the ward`,
      paras:[
        `Daniel arrives at the nursing station: "Why is my mother's face bruised? Why did nobody call me?"`,
        `Tom stands up and says, "Sir, I need you to calm down." Daniel's voice gets louder.`,
        `Dr. Khan explains the ward was short-staffed overnight and falls happen with elderly patients.`,
        `Daniel slams his palm on the counter: "So it's her fault for being old?"`,
        `At minute 4 Tom says, "If you keep shouting, I'll call security."`,
        `Leah says quietly, "I'd be upset too if it were my mum." Daniel turns to her and his shoulders drop for a moment. Nobody builds on it.`,
        `At minute 8 Dr. Khan says, "I'm sorry this happened," and explains the X-ray plan.`,
        `The scenario ends at minute 10. Daniel is calmer but asks for the manager and says he will complain.`
      ],
      monitor:[
        { t:'00:00', rhythm:'sinus', hr:84, bp:'142/80', spo2:96, rr:16, temp:'36.8', label:'Mrs. Brooks, stable' },
        { t:'00:01', rhythm:'sinus', hr:86, bp:'144/82', spo2:96, rr:16, temp:'36.8', label:'"Calm down, sir"', alarm:true },
        { t:'00:02', rhythm:'sinus', hr:86, bp:'144/82', spo2:96, rr:16, temp:'36.8', label:'Staffing explained' },
        { t:'00:03', rhythm:'sinus', hr:88, bp:'146/84', spo2:96, rr:17, temp:'36.8', label:'Palm on the counter', alarm:true },
        { t:'00:04', rhythm:'sinus', hr:88, bp:'146/84', spo2:96, rr:17, temp:'36.8', label:'Security threatened', alarm:true },
        { t:'00:06', rhythm:'sinus', hr:86, bp:'142/80', spo2:96, rr:16, temp:'36.8', label:'"I\'d be upset too"' },
        { t:'00:08', rhythm:'sinus', hr:84, bp:'140/80', spo2:96, rr:16, temp:'36.8', label:'Apology and plan' },
        { t:'00:10', rhythm:'sinus', hr:84, bp:'140/80', spo2:96, rr:16, temp:'36.8', label:'Asks for manager' }
      ],
      observed:[`"Calm down" escalated the anger`,`Staffing given as an excuse`,`Security threatened for a raised voice`,`No disclosure or apology until minute 8`,`Leah's empathic line not built on`,`Nobody called the family after the fall`,`Strength: Dr. Khan apologized and gave a plan`]
    },
    { type:'choice', phase:'gather', title:`Gather: reactions`,
      setup:[['tom',`Look, he was out of line. You can't shout at staff.`],['narr',`Leah is quiet. Dr. Khan looks tired.`]],
      prompt:`Tom opens defensively. How do you respond?`,
      options:[
        { id:'a', grade:'best', g:`Acknowledge Tom, then open to all`, strat:`Validation, then widen the reactions`, s:[3,3,2,3], t:2, tags:['emotion'],
          text:`"Being shouted at is stressful, Tom, and your safety matters. We'll look at that. Before we do, how is everyone feeling?"`,
          fb:`You acknowledge his stress without endorsing his verdict, and promise to return to safety. Then you widen the invitation, which is what Gather is for.`,
          reply:[['leah',`Shaky. I wanted to help but didn't know if I was allowed.`],['amir',`Embarrassed. I think I made it worse with the staffing thing.`],['tom',`Wound up, if I'm honest.`]] },
        { id:'b', grade:'good', g:`One word each`, strat:`One-word check-in`, s:[2,3,2,3], t:1, tags:['emotion'],
          text:`"One word each for how that felt."`,
          fb:`Quick, but Tom's defensiveness needs acknowledgement or it will colour the whole debrief.`,
          reply:[['tom',`Annoyed.`],['leah',`Nervous.`],['amir',`Tired.`]] },
        { id:'c', grade:'weak', g:`"Actually, he had a point"`, strat:`Took the family's side`, s:[0,1,1,2], t:1, tags:[],
          text:`"Actually, Tom, I think he had a point."`,
          fb:`Arguing with a learner's reaction in the first minute tells him his feelings are wrong, and he will defend himself for the rest of the debrief.`,
          reply:[['tom',`Right. So it's my fault.`],['narr',`Tom leans back and crosses his arms.`]] },
        { id:'d', grade:'weak', g:`Jump to "calm down"`, strat:`Skipped Gather`, s:[0,0,1,2], t:1, tags:[],
          text:`"Let's start with 'calm down'. That was the turning point."`,
          fb:`Skipping reactions is the most common GAS error, and here it lands squarely on the most defensive learner.`,
          reply:[['tom',`Here we go.`]] }
      ]
    },
    { type:'choice', phase:'gather', title:`Gather: a shared account`,
      prompt:`You need a short account, and a check on what each person thought Daniel needed.`,
      options:[
        { id:'a', grade:'best', g:`Leah summarizes, then "what did Daniel need?"`, strat:`Learner summary with a needs check`, s:[3,3,3,3], t:3, tags:['voice'],
          text:`"Leah, could you give us the short version? Then each of you: what do you think Daniel needed in that moment?"`,
          fb:`Asking the newest nurse first flattens the hierarchy, and the needs question moves the team from "an angry man" to "a frightened son". That reframe is the heart of de-escalation.`,
          reply:[['leah',`He saw the bruise, nobody had told him, Tom said calm down, it got worse, Dr. Khan apologized at the end.`],['leah',`I think he needed someone to say they were sorry.`],['amir',`Information. He didn't know what happened.`],['tom',`...To know she was safe, I guess.`]] },
        { id:'b', grade:'good', g:`You describe what you saw`, strat:`Facilitator account`, s:[2,2,1,3], t:1, tags:[],
          text:`"Here's what I saw: an upset son, a defensive response, and an apology at the end. Fair?"`,
          fb:`Efficient, but you named the gap first, and you miss the reframe that comes from asking what Daniel needed.`,
          reply:[['tom',`I wasn't defensive.`]] },
        { id:'c', grade:'weak', g:`"Dr. Khan, you were senior"`, strat:`Senior defines the account`, s:[1,1,1,2], t:2, tags:['hierarchy'],
          text:`"Dr. Khan, you were the senior person there. Tell us what happened."`,
          fb:`Letting the most senior person define the account is a named GAS error. Leah's key moment disappears from the story.`,
          reply:[['amir',`He was angry, we explained, I apologized.`]] }
      ]
    },
    { type:'choice', phase:'analyze', title:`Topic 1: "Calm down, sir"`,
      setup:[['narr',`Gap: "calm down" and a security threat escalated a son who was frightened, not dangerous.`]],
      prompt:`Tom's reasoning is the key. How do you open this topic?`,
      options:[
        { id:'a', grade:'best', g:`Preview, observation, concern, question`, strat:`Preview plus advocacy-inquiry`, s:[3,3,3,2], t:4, tags:['ai'],
          text:`"I'd like to look at the first two minutes, because that's where anger either grows or settles. Tom, I heard 'calm down, sir', and I saw Daniel's voice get louder straight after. I was worried he heard it as 'your feelings are the problem'. What was your goal at that moment?"`,
          fb:`The reasoning behind the words is hidden, so advocacy-inquiry fits. You make your concern honest and specific, then stay curious. Tom's real goal, keeping the station safe, comes out and can be met in a better way.`,
          reply:[['tom',`Protect Leah, honestly. I thought if I took control fast, he'd back off.`],['amir',`Instead it felt like we were squaring up.`],['tom',`Yeah. Maybe name what he's feeling first, then set the line if I need to.`]] },
        { id:'b', grade:'good', g:`Team self-correction`, strat:`Guided team self-correction`, s:[3,2,2,3], t:3, tags:['peer'],
          text:`"As a team, what's the standard for de-escalating an angry family member, and how close did we get?"`,
          fb:`Reasonable, but Tom's protective frame stays hidden, and without it his behaviour will repeat.`,
          reply:[['leah',`Don't say calm down?`],['tom',`Everyone says that.`]] },
        { id:'c', grade:'weak', g:`"Why did you threaten security?"`, strat:`Accusatory why`, s:[0,1,1,2], t:1, tags:[],
          text:`"Why did you threaten him with security?"`,
          fb:`An accusatory why recreates the confrontation inside the debrief. Tom defends himself and learns nothing.`,
          reply:[['tom',`Because he was shouting. Obviously.`]] },
        { id:'d', grade:'weak', g:`Lecture on de-escalation models`, strat:`Extended lecture`, s:[1,1,1,0], t:6, tags:[],
          text:`"Let me walk you through three de-escalation models." You talk for six minutes.`,
          fb:`Lecturing is a named GAS trap. The team needs to see its own pattern, not a list of models.`,
          reply:[['narr',`Tom checks the clock.`]] }
      ]
    },
    { type:'choice', phase:'analyze', title:`Human factors: when to call security`, challenge:'hierarchy',
      setup:[['tom',`But what if he had actually got violent? Are we supposed to just take it?`]],
      prompt:`Tom raises a real safety question. How do you respond?`,
      options:[
        { id:'a', grade:'best', g:`Teach the line: threat or not`, strat:`Directive teaching on boundaries`, s:[3,3,3,3], t:2, tags:['dir'],

const VOICE_BANK = {"common":{"narr|Human factors moment: equity of voice":[0.0,2.969],"narr|Human factors moment: strong emotion":[3.088,2.76],"narr|Human factors moment: cognitive load":[5.969,2.937],"narr|Human factors moment: hierarchy":[9.026,2.594],"narr|Human factors moment: peer feedback":[11.74,2.757],"narr|Human factors moment: refocusing the group":[14.617,2.851],"coach|Welcome to The Debriefer Game. You play the facilitator. A team has just finished a manikin simulation. Your job is to guide the conversation, so they feel safe, make sense of what happened, and take lessons back to real practice. I am Coach Nadia. I score every move you make, and tell you why.":[17.588,18.345],"coach|Every GAS level follows the same structure. Open the session to set up safety. Watch the scenario. Then gather, analyze, and summarize.":[36.052,9.311],"coach|Every level follows the PEARLS debriefing structure. Prebrief to set up safety. Watch the scenario. Then reactions, description, analysis, and summary.":[45.483,9.752],"coach|Try it. Priya looks upset after the sim. Pick what you would say, and watch her face.":[55.355,4.697],"coach|You are scored on four facilitator vitals, from zero to one hundred. Psychological safety. Strategy fit. Learning depth. And load management. Your overall score is the average of the four.":[60.172,12.525],"coach|Each learner has a mood, from distressed to engaged. A distressed learner stops learning. Every move also uses debrief minutes. Going over the clock costs load points.":[72.817,10.613],"coach|Score sixty, seventy five, or ninety for one, two, or three stars. Ninety or more unlocks the next level. Chain strong moves for a combo, up to double points. You get three instincts per level: each gives a hint and removes one weak option. Turn on voice to hear every line instead of reading. Ready? Let us start.":[83.55,19.522],"coach|Strong choice. Feelings first opens the door to reflection.":[103.192,3.624],"coach|Missed opportunity. Why did you, in the first minute, sounds like blame.":[106.936,3.896],"coach|Voice on.":[110.951,0.76],"narr|Option 1.":[111.832,1.024],"narr|Option 2.":[112.975,1.101],"narr|Option 3.":[114.196,1.156],"narr|Option 4.":[115.472,1.114],"coach|Phase 1. Prebrief. Set the scene. Create a safe context for learning.":[116.706,4.549],"coach|Phase 2. Scenario. Watch the simulation. Spot the gaps.":[121.375,3.7],"coach|Phase 3. Reactions. Explore feelings before facts.":[125.195,3.557],"coach|Phase 4. Description. Clarify facts. Build a shared picture of the case.":[128.872,4.789],"coach|Phase 5. Analysis. Explore performance. Match your strategy to the gap.":[133.781,4.803],"coach|Phase 6. Summary. Turn insight into action for real practice.":[138.704,4.171],"coach|Phase 1. Opening. Set the purpose: learning and improvement, not blame.":[142.995,4.806],"coach|Phase 3. Gather. Listen. Hear reactions and build a shared account.":[147.921,4.468],"coach|Phase 4. Analyze. Facilitate reflection. Match your strategy to the gap.":[152.509,4.798],"coach|Phase 5. Summarize. Learners name take-aways and one commitment.":[157.427,4.332],"coach|You scored 0 out of 100.":[161.879,1.818],"coach|You scored 1 out of 100.":[163.816,1.643],"coach|You scored 2 out of 100.":[165.579,1.59],"coach|You scored 3 out of 100.":[167.289,1.712],"coach|You scored 4 out of 100.":[169.12,1.624],"coach|You scored 5 out of 100.":[170.864,1.715],"coach|You scored 6 out of 100.":[172.699,1.601],"coach|You scored 7 out of 100.":[174.42,1.798],"coach|You scored 8 out of 100.":[176.337,1.691],"coach|You scored 9 out of 100.":[178.148,1.746],"coach|You scored 10 out of 100.":[180.015,1.724],"coach|You scored 11 out of 100.":[181.858,1.797],"coach|You scored 12 out of 100.":[183.775,1.772],"coach|You scored 13 out of 100.":[185.667,1.945],"coach|You scored 14 out of 100.":[187.733,1.973],"coach|You scored 15 out of 100.":[189.826,1.824],"coach|You scored 16 out of 100.":[191.77,1.835],"coach|You scored 17 out of 100.":[ You scored 98 out of 100.":[362.341,1.986],"coach|You scored 99 out of 100.":[364.447,2.071],"coach|You scored 100 out of 100.":[366.638,1.938],"coach|Expert-level facilitation.":[368.696,1.617],"coach|Solid, safe debrief. Room to sharpen.":[370.433,2.513],"coach|Developing. Some choices cost safety or depth.":[373.067,2.775],"coach|Replay this one. The coaching shows where.":[375.961,2.4],"coach|Badge earned: Psychological Safety Champion.":[378.481,2.803],"coach|Badge earned: Advocacy-Inquiry Explorer.":[381.404,2.472],"coach|Badge earned: Cognitive Load Manager.":[383.996,2.35],"coach|Badge earned: Emotion Navigator.":[386.466,2.044],"coach|Badge earned: Hierarchy Flattener.":[388.63,2.056],"coach|Badge earned: Peer Coaching Catalyst.":[390.806,2.196],"coach|Badge earned: Take-Home Architect.":[393.121,2.073],"coach|Badge earned: Deliberate Practitioner.":[395.315,2.066],"coach|Badge earned: PEARLS Master.":[397.5,1.76],"coach|Badge earned: GAS Master.":[399.381,1.904],"coach|Badge earned: Bilingual Debriefer.":[401.405,2.04],"coach|Badge earned: Strategy Sprinter.":[403.565,1.957],"coach|Rank up. You are now a Observer.":[405.642,1.75],"coach|Rank up. You are now a Novice Facilitator.":[407.512,2.298],"coach|Rank up. You are now a Facilitator.":[409.93,1.941],"coach|Rank up. You are now a Skilled Debriefer.":[411.99,2.07],"coach|Rank up. You are now a Senior Debriefer.":[414.18,2.143],"coach|Rank up. You are now a Master Debriefer.":[416.444,2.141],"coach|Here is your debrief, the PEARLS way.":[418.705,1.863],"coach|Here is your debrief, the GAS way.":[420.688,2.038],"coach|Level unlocked. The Tenfold Dose is open.":[422.846,2.68],"coach|Level unlocked. No Return is open.":[425.646,2.374],"coach|Level unlocked. Silent Chest is open.":[428.14,2.507],"coach|Level unlocked. The Hidden Cause is open.":[430.768,2.541],"coach|Level unlocked. The Last Word is open.":[433.429,2.394],"coach|Level unlocked. Visiting Hours is open.":[435.943,2.661],"coach|Level unlocked. Small Hands is open.":[438.724,2.371],"coach|Setting the scene. Strong.":[441.215,1.618],"coach|Setting the scene. Workable.":[442.953,1.703],"coach|Setting the scene. Needs work.":[444.776,1.856],"coach|Reactions. Strong.":[446.752,1.313],"coach|Reactions. Workable.":[448.184,1.431],"coach|Reactions. Needs work.":[449.736,1.546],"coach|Description. Strong.":[451.402,1.409],"coach|Description. Workable.":[452.931,1.407],"coach|Description. Needs work.":[454.458,1.551],"coach|Analysis. Strong.":[456.128,1.303],"coach|Analysis. Workable.":[457.551,1.395],"coach|Analysis. Needs work.":[459.066,1.535],"coach|Application and summary. Strong.":[460.72,2.094],"coach|Application and summary. Workable.":[462.934,2.162],"coach|Application and summary. Needs work.":[465.216,2.299],"coach|Opening. Strong.":[467.635,1.093],"coach|Opening. Workable.":[468.849,1.239],"coach|Opening. Needs work.":[470.207,1.389],"coach|Gather. Strong.":[471.716,1.086],"coach|Gather. Workable.":[472.922,1.174],"coach|Gather. Needs work.":[474.216,1.31],"coach|Analyze. Strong.":[475.646,1.202],"coach|Analyze. Workable.":[476.969,1.371],"coach|Analyze. Needs work.":[478.46,1.513],"coach|Summarize. Strong.":[480.093,1.25],"coach|Summarize. Workable.":[481.463,1.457],"coach|Summarize. Needs work.":[483.04,1.633],"coach|Focus: Psychological Safety. Lead with validation before analysis, and swap why did you for I saw... I think... how did you see it?":[484.792,8.329],"coach|Focus: Structure & Strategy Fit. Match the tool to the gap: teach clear knowledge gaps, explore mental models for cognitive and behavioural gaps, and keep every phase of your framework.":[493.241,11.549],"coach|Focus: Learning Depth. Go below the action to the frame behind it. After a learner answers, ask one more what were you thinking at that moment?":[504.91,8.163],"coach|Focus: Cognitive Load Management. Pick two topics, park the rest on the whiteboard, keep teaching to one point, and interrupt monologues early.":[513.193,8.907],"coach|Stretch. Replay and pick a workable option on purpose. Watching how the room responds builds judgement for when the ideal move is not available.":[522.22,8.845]},"ward-sepsis":{"narr|The four learners stand near the door. Priya is gripping her badge. Leah keeps glancing at the manikin.":[0.0,6.251],"narr|How do you prebrief the group?":[6.371,1.736],"you|Today is practice, not a test, and what happens here stays in this room. We assume everyone here is capable and wants to improve, so mistakes are expected. You get 15 minutes with a post-op patient, focused on noticing and escalating a change, then 20 minutes to debrief, and I will show you the manikin, monitor and phone first.":[8.228,21.906],"priya|Okay. Good to know it is not graded.":[30.254,2.174],"leah|Can we touch the patient? Like, does he feel a pulse?":[32.548,4.276],"coach|Strong choice. This covers all four pillars in under a minute: psychological safety, a learning focus without spoiling the diagnosis, time structure, and technology orientation.":[36.943,11.59],"you|Here is the plan: 15 minutes in the room, 20 minutes debrief. The manikin speaks through me and the monitor is live. Let's go.":[48.653,8.628],"tom|Sure.":[57.401,0.533],"narr|Priya and Leah exchange a look.":[58.054,2.438],"coach|Workable. Clear on time and technology, which reduces uncertainty. It says nothing about confidentiality, error, or the basic assumption, so anxious learners fill the gap with their own story about being judged.":[60.612,13.668],"you|Treat this like a real shift. I will be watching and taking notes on everything you do, so give it your best.":[74.4,6.96],"priya|...Okay.":[81.48,0.664],"narr|Leah steps behind Tom.":[82.264,1.814],"coach|Missed opportunity. This raises threat. Watching and taking notes signals assessment, and novice learners shift attention from the patient to self-monitoring, which adds extraneous load.":[84.198,11.791],"you|We're doing sepsis today. Remember early warning scores and get blood cultures before antibiotics.":[96.109,6.517],"amir|Sepsis, got it.":[102.746,0.979],"coach|Missed opportunity. Announcing the diagnosis and the answers removes the recognition challenge, which is the main objective.":[103.845,7.715],"narr|Priya takes handover at 14:05. Mr. Fraser is restless and says his belly hurts.":[111.68,6.976],"narr|Vitals: HR 112, BP 98/60, RR 24, T 38.4 \u00b0C, SpO2 94% on room air. Priya gives PRN hydromorphone and plans to recheck in 30 minutes.":[118.775,16.461],"narr|Leah notices he is confused about the date. She mentions it softly. Nobody responds.":[135.356,6.029],"narr|At minute 8 the BP falls to 86/50. Nobody calculates an early warning score.":[141.505,6.825],"narr|Priya calls Dr. Khan: Mr. Fraser in 12 isn't looking great, can you come? She gives no vitals. He does not read back.":[148.449,8.627],"narr|Dr. Khan arrives at minute 11 and orders piperacillin-tazobactam, a 500 mL bolus, lactate and blood cultures.":[157.196,8.981],"narr|The antibiotic is hung at minute 13. Blood cultures are drawn at minute 14, after the first dose is running.":[166.297,7.655],"narr|The scenario ends with BP 90/55 and the team unsure what comes next.":[174.072,6.017],"narr|Everyone sits. Priya exhales loudly. Tom is still frowning at the wall phone.":[180.209,5.25],"narr|How do you open the debrief?":[185.579,1.946],"you|Let's start with how you are feeling. That was a busy 15 minutes and the phone in there is clunky, so any frustration is fair game.":[187.645,8.16],"priya|Rattled. I felt one step behind the whole time.":[195.924,2.793],"tom|The phone line kept cutting out, I was so annoyed.":[198.838,2.317],"narr|Leah smiles slightly but says nothing.":[201.275,2.554],"coach|Strong choice. You invite emotion openly and normalize a system irritant before it becomes a hidden distraction.":[203.949,7.234],"you|Let's go around. One word that captures that case for you.":[211.304,3.797],"priya|Behind.":[215.22,0.661],"tom|Annoying.":[216.002,0.632],"amir|Late.":[216.754,0.526],"leah|Uncertain.":[217.4,0.971],"coach|Workable. Fast, inclusive, and gives every learner an equal first turn, which helps quiet voices.":[218.492,6.035],"you|Let's jump straight in. Priya, why did you give the hydromorphone?":[224.647,4.13],"priya|Because he said he was in pain? Was that wrong?":[228.897,2.568],"narr|The room goes quiet.":[231.585,1.666],"coach|Missed opportunity. Skipping reactions leaves emotion unprocessed, and it resurfaces later as defensiveness.":[233.371,6.997],"you|That went pretty well overall, so we can keep this quick.":[240.488,3.336],"priya|Oh. Okay.":[243.944,1.004],"narr|Priya looks unconvinced.":[245.068,2.034],"coach|Missed opportunity. Early global praise closes the door on concerns learners want to raise, and it conflicts with what they felt in the room.":[247.222,8.368],"narr|How do you establish the facts?":[255.71,1.844],"you|Tom, could you give us a 30-second summary of the case? Then, what was the working diagnosis, and does everyone agree?":[257.674,7.756],"tom|Post-op day 2, got tachy and hypotensive. We thought pain at first, then sepsis, probably abdominal.":[265.55,6.479],"amir|Agree, intra-abdominal sepsis.":[272.15,1.76],"priya|I only thought sepsis once Dr. Khan said it.":[274.03,2.753],"coach|Strong choice. Short, learner-led, and it tests the shared mental model. The disagreement you uncover here, Priya only thinking of sepsis late, becomes your richest analysis material.":[276.903,11.669],"you|Let's walk through it minute by minute from handover. Priya, start with the first set of vitals.":[288.692,5.771],"priya|Okay, so first I got handover from the day nurse, and then...":[294.583,3.763],"narr|Seven minutes pass.":[298.466,1.352],"coach|Missed opportunity. A full replay burns a third of your time and makes learners relive every misstep, which raises anxiety and cognitive load.":[299.938,9.082],"you|Here is what I saw: a post-op patient becoming septic, with some delays in recognition and treatment. Does that match your view?":[309.14,8.501],"tom|Yeah, pretty much.":[317.762,0.981],"coach|Workable. Efficient and neutral in tone. You lose the chance to hear the learners' own frame, and you have already named the gap before they have.":[318.862,8.179],"narr|Gap: HR 112, T 38.4 and new confusion were treated as pain for 8 minutes.":[327.161,7.51],"narr|How do you open the first performance gap?":[334.791,2.416],"you|I'd like to talk about the first 8 minutes, because early recognition is where sepsis outcomes are won. Priya, I saw hydromorphone go in with a heart rate of 112 and a fever, and I worried we lost time to call sepsis. How were you seeing it then?":[337.327,17.073],"priya|He kept saying his belly hurt, and post-op patients on my unit are always tachy. Pain was top of my list and I stayed there.":[354.52,7.759],"tom|Same. I didn't think fever plus confusion until later.":[362.4,2.891],"coach|Strong choice. A preview statement, then an honest observation, your point of view, and a genuine question.":[365.41,6.33],"you|Looking back at the first 8 minutes, what went well, and what would you change?":[371.86,4.409],"priya|Went well: I did vitals quickly. Change: recheck sooner, I guess.":[376.39,4.102],"coach|Workable. Safe and efficient, and it lets learners find the gap themselves. Broad self-assessment often surfaces surface fixes without reaching the anchoring bias underneath.":[380.611,10.764],"you|Fever, tachycardia and new confusion after surgery is sepsis until proven otherwise. Calculate the early warning score before you treat pain.":[391.496,10.633],"priya|Right. Yes.":[402.249,1.022],"narr|She writes it down but looks deflated.":[403.391,2.651],"coach|Workable. Accurate and concise. The gap here is a mental model, not missing knowledge: they know the sepsis criteria but did not apply them.":[406.162,8.789],"you|Didn't you think a heart rate of 112 was a bit high to blame on pain?":[415.071,5.102],"priya|I mean... in hindsight, sure.":[420.293,1.814],"narr|Priya crosses her arms.":[422.226,1.859],"coach|Missed opportunity. A guess what I'm thinking question with judgment built in. Learners hear criticism, defend, and stop sharing reasoning.":[424.205,8.519],"narr|Leah hasn't spoken since reactions. She noticed the confusion in the room, but nobody heard her. She is looking at her notes.":[432.844,7.768],"narr|What do you do?":[440.733,1.05],"you|Leah, you were right beside Mr. Fraser. What did you notice about him in those first minutes?":[441.903,5.587],"leah|He asked me what day it was, twice. I said it out loud but I wasn't sure it mattered.":[447.61,7.985],"priya|I didn't hear that. That would have changed things for me.":[455.715,2.698],"coach|Strong choice. You name her useful position, not her rank, and ask an open question she is expert on.":[458.533,6.34],"you|Does anyone else have anything to add?":[464.993,2.067],"tom|Not really.":[467.18,0.775],"narr|Leah stays silent.":[468.075,1.399],"coach|Workable. Open and harmless, but quiet learners rarely take a general invitation, especially the most junior person in the room.":[469.594,8.225],"you|Leah, as the student, you probably didn't feel you could speak up, right?":[477.94,4.16],"leah|I guess.":[482.22,0.839],"narr|She goes back to her notes.":[483.179,1.828],"coach|Missed opportunity. Well meant, but it labels her by rank in front of the team and answers for her.":[485.127,5.691],"you|Tom, what do you think Leah was seeing from where she stood?":[490.938,2.938],"tom|Uh, probably the same as us?":[493.995,1.488],"leah|Actually, he was confused about the date.":[495.603,3.723],"coach|Workable. Circular questions build perspective-taking and help teams see each other's view.":[499.446,5.154],"narr|Gap: Mr. Fraser isn't looking great, can you come? No vitals, no request, no read-back. Arrival took 3 minutes.":[504.72,7.71],"narr|How do you explore the escalation?":[512.549,2.023],"you|Let's look at the call, because clear escalation gets help to the bedside faster. Dr. Khan, you were on the receiving end. What did you need to hear, and what did you get? Priya, what would you say next time?":[514.692,13.121],"amir|I heard not looking great and thought I could finish my note first. If I'd heard BP 86 and new confusion, I'd have run.":[527.933,7.651],"priya|Next time I'll lead with the numbers and tell you what I need.":[535.704,3.438],"coach|Strong choice. The team corrects itself using both sides of the phone line. The receiver's perspective makes the value of SBAR concrete in a way a lecture cannot.":[539.263,10.117],"you|Priya, how do you think the phone call went?":[549.5,2.262],"priya|Not great. I was flustered.":[551.881,1.46],"coach|Workable. Safe and fair. It relies on one person's view of a two-person event, so you miss the receiver's side, which carries the lesson.":[553.462,8.458],"you|When you escalate, use SBAR: situation, background, assessment, recommendation. Then ask for a read-back.":[562.039,7.35],"priya|Yes, we learned that in school.":[569.509,1.611],"coach|Workable. Correct and brief. They likely know SBAR already, so a reminder does not explain why it failed under pressure.":[571.24,7.263],"you|Let me take a few minutes to go through SBAR in detail, including where it came from and the evidence behind it.":[578.624,6.795],"narr|Tom checks the clock. Amir's eyes glaze.":[585.538,2.993],"coach|Missed opportunity. Six minutes of teaching drains a 20-minute debrief and pushes learners into passive listening.":[588.651,6.895],"amir|Honestly I thought we just had to get antibiotics in within the hour. The order doesn't matter, right?":[595.666,5.669],"narr|Dr. Khan has stated a clear knowledge gap. How do you respond?":[601.455,4.101],"you|I noticed the cultures were drawn after the antibiotic started. Next time, draw them first when you can do so without delaying the antibiotic, because even one dose can sterilize the cultures and hide the organism.":[605.676,14.612],"amir|That makes sense. I'll remember that.":[620.408,1.699],"tom|Our order set lists cultures first. I never knew why.":[622.227,2.859],"coach|Strong choice. A clear knowledge gap calls for clear teaching. You follow the PEARLS pattern: behaviour, suggested behaviour, rationale.":[625.207,8.392],"you|What are the team's thoughts on the order of cultures and antibiotics?":[633.718,3.833],"tom|I think cultures first?":[637.672,1.248],"priya|Or at the same time?":[639.039,1.057],"narr|Nobody sounds sure.":[640.217,1.623],"coach|Workable. Respectful, but the gap is already clear and the answer is factual. Exploring a knowledge gap costs time and can lead to peers guessing.":[641.96,9.339],"you|Who can list the six steps of the Sepsis Six? Anyone?":[651.418,3.205],"narr|Silence. Leah looks at the floor.":[654.743,2.083],"coach|Missed opportunity. Quizzing on the spot is a common psychological safety threat. It rewards recall under pressure and embarrasses whoever gets it wrong.":[656.946,9.551],"narr|Four minutes left. How do you close?":[666.617,2.35],"you|Let's go around. Each of you, one thing you'll take to your next shift and one thing you'll do differently. I'll add anything we missed.":[669.087,7.926],"priya|Early warning score before any PRN on a tachy patient.":[677.133,3.776],"amir|Cultures first, unless it delays the antibiotic.":[681.029,2.856],"tom|SBAR with the numbers first.":[684.005,1.397],"leah|If I see something, I'll say it twice.":[685.522,3.188],"coach|Strong choice. Each learner commits to a concrete change in their own words, which improves transfer.":[688.83,5.775],"you|What are some take-aways from this for your clinical practice?":[694.725,3.258],"tom|Call earlier.":[698.103,0.804],"amir|Cultures before antibiotics.":[699.027,1.729],"coach|Workable. The right question from PEARLS. As an open group question, the most confident speakers answer and others coast.":[700.876,7.419],"you|Key points: calculate the early warning score, escalate with SBAR, and draw cultures before antibiotics.":[708.415,7.644],"narr|The learners nod.":[716.18,1.316],"coach|Workable. Accurate, aligned with objectives, and fast. Learners hear your list, not theirs, so ownership and recall are lower.":[717.616,7.576],"you|We're about out of time. Thanks everyone, great job!":[725.312,3.192],"narr|The learners gather their things.":[728.624,2.113],"coach|Missed opportunity. Without a summary, learning stays in the room. Even 90 seconds of one thing you'll do differently strengthens transfer to practice.":[730.857,8.707],"coach|Level 1. The Quiet Slide. Early sepsis on a surgical ward. Your goals: Recognize early sepsis with an early warning score. Escalate with a structured SBAR call. Start the sepsis bundle in the right order.":[739.684,13.519],"coach|Your instinct. Cover safety, objectives, logistics and orientation, without giving away the answer.":[753.323,6.38],"coach|Naming mistakes as expected lowers threat before it builds. Orienting learners to the phone and monitor removes extraneous load that would otherwise leak into the debrief as frustration.":[759.824,11.382],"coach|Strength. Open the prebrief. Full prebrief: safety, objectives, logistics, orientation. This covers all four pillars in under a minute: psychological safety, a learning focus without spoiling the diagnosis, time structure, and technology orientation.":[771.326,16.93],"coach|It also gives no learning focus, so the debrief has nothing to anchor to.":[788.375,4.366],"coach|Try next time. Open the prebrief. You chose: Logistics only. Try full prebrief: safety, objectives, logistics, orientation instead. This covers all four pillars in under a minute: psychological safety, a learning focus without spoiling the diagnosis, time structure, and technology orientation.":[792.861,19.877],"coach|Prefer: This is practice. I take notes only to help our conversation afterwards.":[812.858,4.928],"coach|Try next time. Open the prebrief. You chose: Evaluative framing. Try full prebrief: safety, objectives, logistics, orientation instead. This covers all four pillars in under a minute: psychological safety, a learning focus without spoiling the diagnosis, time structure, and technology orientation.":[817.905,20.081],"coach|Learners perform a checklist instead of revealing their real mental models, so the debrief loses its best material. Share the learning focus, not the answer key.":[838.106,9.808],"coach|Try next time. Open the prebrief. You chose: Content cueing. Try full prebrief: safety, objectives, logistics, orientation instead. This covers all four pillars in under a minute: psychological safety, a learning focus without spoiling the diagnosis, time structure, and technology orientation.":[848.034,19.908],"coach|Gaps observed: Anchoring on pain as the cause of tachycardia. No early warning score. Unstructured escalation, no read-back. Cultures drawn after antibiotic started. Student cue lost.":[868.062,12.888],"coach|Your instinct. Open the door to feelings before facts.":[881.07,3.312],"coach|Venting early clears space for reflection later. Naming the phone also tells learners you see the environment, not only them.":[884.502,7.497],"coach|Strength. Reactions. Emotion invitation with normalization. You invite emotion openly and normalize a system irritant before it becomes a hidden distraction.":[892.12,10.788],"coach|One word can hide the story behind it, so follow up on the strongest word before moving on.":[903.028,5.278],"coach|Try next time. Reactions. You chose: One-word check-in. Try emotion invitation with normalization instead. You invite emotion openly and normalize a system irritant before it becomes a hidden distraction.":[908.426,14.435],"coach|Why did you aimed at one person in the first minute reads as blame. Open with reactions, then move to analysis with a preview statement.":[922.981,8.104],"coach|Try next time. Reactions. You chose: Skipped reactions, singled out a learner. Try emotion invitation with normalization instead. You invite emotion openly and normalize a system irritant before it becomes a hidden distraction.":[931.205,15.598],"coach|Learners discount feedback that does not match their experience. Ask before you evaluate.":[946.923,5.188],"coach|Try next time. Reactions. You chose: Premature evaluation. Try emotion invitation with normalization instead. You invite emotion openly and normalize a system irritant before it becomes a hidden distraction.":[952.231,14.684],"coach|Your instinct. Keep it short, let a learner lead, and check that everyone agrees.":[967.035,4.635],"coach|Two minutes well spent.":[971.79,1.212],"coach|Strength. Description. Learner-led summary with shared diagnosis check. Short, learner-led, and it tests the shared mental model.":[973.122,7.769],"coach|It also puts Priya on stage first. Aim for a brief summary and move to analysis.":[981.01,5.337],"coach|Try next time. Description. You chose: Minute-by-minute replay. Try learner-led summary with shared diagnosis check instead. Short, learner-led, and it tests the shared mental model.":[986.468,11.64],"coach|Learner summaries reveal mental models, and facilitator summaries hide them.":[998.227,4.471],"coach|Try next time. Description. You chose: Facilitator summary. Try learner-led summary with shared diagnosis check instead. Short, learner-led, and it tests the shared mental model.":[1002.819,11.488],"coach|Your instinct. The action only makes sense once you see the thinking behind it. Say what you saw, then get curious.":[1014.427,6.543],"coach|The gap is cognitive, so the frame behind the action matters more than the action. Your curiosity keeps safety high while making the concern clear.":[1021.09,8.857],"coach|Strength. Issue 1: Recognizing the slide. Focused facilitation: preview + advocacy-inquiry. A preview statement, then an honest observation, your point of view, and a genuine question.":[1030.067,12.258],"coach|Follow with advocacy-inquiry if the frame stays hidden.":[1042.445,3.099],"coach|Try next time. Issue 1: Recognizing the slide. You chose: Learner self-assessment. Try focused facilitation: preview + advocacy-inquiry instead. A preview statement, then an honest observation, your point of view, and a genuine question.":[1045.664,16.203],"coach|Teaching without exploring why leaves the anchor in place for the next shift.":[1061.987,4.018],"coach|Try next time. Issue 1: Recognizing the slide. You chose: Directive feedback. Try focused facilitation: preview + advocacy-inquiry instead. A preview statement, then an honest observation, your point of view, and a genuine question.":[1066.126,15.878],"coach|Say what you saw and what you think openly, then ask how they saw it.":[1082.124,3.873],"coach|Try next time. Issue 1: Recognizing the slide. You chose: Leading question. Try focused facilitation: preview + advocacy-inquiry instead. A preview statement, then an honest observation, your point of view, and a genuine question.":[1086.117,15.678],"coach|Your instinct. Watch who holds the floor. Give the quieter voice a safe, specific opening.":[1101.916,5.427],"coach|Turning your body and opening your hands signals her turn without pressure. This flattens the hierarchy between student and staff.":[1107.462,7.691],"coach|Strength. Human factors: the quiet voice. Direct, open invitation with open body language. You name her useful position, not her rank, and ask an open question she is expert on.":[1115.273,11.78],"coach|Name the person and give a concrete, low-risk question.":[1127.173,3.243],"coach|Try next time. Human factors: the quiet voice. You chose: General invitation. Try direct, open invitation with open body language instead. You name her useful position, not her rank, and ask an open question she is expert on.":[1130.536,15.744],"coach|It reinforces the hierarchy you want to flatten. Ask what she noticed, not how junior she felt.":[1146.4,5.7],"coach|Try next time. Human factors: the quiet voice. You chose: Labelling and leading. Try direct, open invitation with open body language instead. You name her useful position, not her rank, and ask an open question she is expert on.":[1152.22,15.528],"coach|Using one on the quietest learner talks about her rather than to her. Save circular questions for learners already engaged.":[1167.868,7.388],"coach|Try next time. Human factors: the quiet voice. You chose: Circular question. Try direct, open invitation with open body language instead. You name her useful position, not her rank, and ask an open question she is expert on.":[1175.376,15.445],"coach|Peer insight also carries less threat than facilitator critique.":[1190.941,3.812],"coach|Strength. Issue 2: The call to Dr. Khan. Focused facilitation: guided team self-correction. The team corrects itself using both sides of the phone line.":[1194.873,10.177],"coach|Bring the other party in.":[1205.17,1.325],"coach|Try next time. Issue 2: The call to Dr. Khan. You chose: Learner self-assessment. Try focused facilitation: guided team self-correction instead. The team corrects itself using both sides of the phone line.":[1206.615,14.303],"coach|Use teaching when the gap is knowledge, and exploration when the gap is performance under load.":[1221.038,5.126],"coach|Try next time. Issue 2: The call to Dr. Khan. You chose: Directive feedback. Try focused facilitation: guided team self-correction instead. The team corrects itself using both sides of the phone line.":[1226.285,13.778],"coach|Intrinsic load rises with little payoff. Keep teaching to one or two key points tied to what happened.":[1240.183,6.07],"coach|Try next time. Issue 2: The call to Dr. Khan. You chose: Extended lecture. Try focused facilitation: guided team self-correction instead. The team corrects itself using both sides of the phone line.":[1246.372,13.703],"coach|Your instinct. This looks like a clear knowledge gap. Close it with one short, specific teaching point.":[1260.196,5.821],"coach|Two minutes, specific, and respectful.":[1266.136,2.001],"coach|Strength. Issue 3: Cultures and antibiotics. Directive feedback. A clear knowledge gap calls for clear teaching.":[1268.257,7.487],"coach|When the learner has shown you the gap, close it.":[1275.864,2.053],"coach|Try next time. Issue 3: Cultures and antibiotics. You chose: Focused facilitation. Try directive feedback instead. A clear knowledge gap calls for clear teaching.":[1278.037,11.709],"coach|Teach the one point that matters instead.":[1289.866,2.141],"coach|Try next time. Issue 3: Cultures and antibiotics. You chose: Quizzing. Try directive feedback instead. A clear knowledge gap calls for clear teaching.":[1292.127,10.603],"coach|Your instinct. Let every learner name their own take-away and a change for practice.":[1302.849,5.049],"coach|Hearing four takeaways lets you check them against the three objectives. You fill gaps only if needed.":[1308.018,5.806],"coach|Strength. Application and summary. Learner-guided summary with action plans. Each learner commits to a concrete change in their own words, which improves transfer.":[1313.944,9.71],"coach|A round gives everyone a turn and a commitment.":[1323.774,2.66],"coach|Try next time. Application and summary. You chose: Open group take-aways. Try learner-guided summary with action plans instead. Each learner commits to a concrete change in their own words, which improves transfer.":[1326.555,13.864],"coach|Use it when time has run out, or after a learner round.":[1340.539,2.893],"coach|Try next time. Application and summary. You chose: Educator-driven summary. Try learner-guided summary with action plans instead. Each learner commits to a concrete change in their own words, which improves transfer.":[1343.552,14.039],"coach|Try next time. Application and summary. You chose: No summary. Try learner-guided summary with action plans instead. Each learner commits to a concrete change in their own words, which improves transfer.":[1357.711,12.932]},"peds-epi":{"narr|This team knows each other. Dr. Okafor is chatting confidently. Jordan is quiet.":[0.0,5.929],"narr|How do you prebrief?":[6.049,1.355],"you|This is practice, and what happens here stays here. We believe everyone is capable and wants to improve, and in here every voice carries equal weight, so if something seems off, say it. Ten minutes in the room, 25 to debrief, and the weight is on the Broselow tape as usual.":[7.524,17.982],"jordan|Okay.":[25.626,0.604],"sam|Sounds good. Let's do it.":[26.35,1.278],"coach|Strong choice. You add a team norm that directly targets this group's risk: equal voice.":[27.748,5.315],"you|This is practice, and it stays in this room. We assume everyone wants to do their best. Ten minutes in the room, then 25 to debrief.":[33.183,8.71],"sam|Great.":[42.013,0.565],"coach|Workable. Solid basics. For a team with a clear hierarchy, adding an explicit norm about speaking up would have set up your third objective.":[42.698,8.354],"you|You all know how this works. Same as always, let's go.":[51.172,3.524],"narr|Jordan hesitates, then follows the others in.":[54.815,3.027],"coach|Missed opportunity. Familiar teams still need a prebrief. Skipping it assumes safety you have not established and leaves the error scenario without a safety net.":[57.963,9.457],"narr|Ava presents with urticaria, lip swelling, wheeze, SpO2 91% and BP 78/40.":[67.539,7.994],"narr|Dr. Okafor directs two IV attempts and nebulized salbutamol for the first 4 minutes.":[75.653,6.257],"narr|At minute 5 he says, Give epi, one point five, IM. Maya repeats, Epi one point five, and draws up 1.5 mL of 1 mg/mL.":[82.03,10.773],"narr|Jordan says quietly, Isn't that a lot for 15 kilos? Dr. Okafor, focused on the airway, says, Just give it, she's crashing.":[92.923,8.657],"narr|Maya gives 1.5 mg IM, ten times the intended 0.15 mg.":[101.7,6.626],"narr|At minute 8 the heart rate climbs to 230 with frequent ectopy and BP 150/100. Chris calls out the rhythm.":[108.445,10.146],"narr|At minute 10 Jordan checks the empty syringe and the team recognizes the error.":[118.711,5.501],"narr|The scenario ends as Ava slowly stabilizes. Maya is pale and silent.":[124.332,5.672],"narr|The room is tense. How do you open?":[130.123,2.437],"you|That was an intense one. How is everyone doing right now? It's okay if some of that still feels heavy.":[132.681,6.493],"maya|Awful. I gave that dose. In real life she'd be dead.":[139.294,3.167],"sam|I'm frustrated with myself.":[142.581,1.432],"narr|Jordan stays quiet.":[144.133,1.54],"coach|Strong choice. You name the intensity and give permission for strong feelings. After an error scenario, this is where shame first shows up, and you want it in the open where you can work with it.":[145.793,11.028],"you|One word each for how you're feeling right now.":[156.942,2.615],"maya|Sick.":[159.676,0.611],"sam|Frustrated.":[160.407,0.818],"jordan|Shaky.":[161.345,0.68],"chris|Relieved.":[162.145,0.765],"coach|Workable. Quick and fair. With a high-emotion error, one word can feel too small for what someone needs to say.":[163.031,6.56],"you|Before we get into feelings, let's figure out how that dose happened.":[169.711,4.031],"maya|I gave what was ordered.":[173.862,1.276],"sam|I didn't order 1.5.":[175.258,1.418],"narr|Tension rises.":[176.796,1.467],"coach|Missed opportunity. This signals that the error matters more than the people. Maya will spend the debrief defending herself instead of learning.":[178.383,8.055],"you|Don't worry, it's only a manikin. Nobody got hurt.":[186.558,3.354],"maya|Right.":[190.032,0.633],"narr|Maya stares at the floor.":[190.785,1.917],"coach|Missed opportunity. Minimizing tells learners their feelings are wrong, and it breaks the fictional contract you asked them to accept.":[192.823,7.775],"maya|I keep thinking about her parents. I should have caught it. I've been doing this four years.":[200.717,4.583],"narr|Maya is close to tears. What do you say?":[205.421,2.732],"you|Maya, that feeling makes sense, it shows how much you care about your patients. Tenfold errors happen to experienced teams everywhere, which is why we practice them here. We'll look at how the team and system set this up, not at blame.":[208.273,15.296],"maya|Okay. Thank you.":[223.689,1.187],"sam|For what it's worth, I think I said it wrong.":[224.995,1.967],"coach|Strong choice. You validate the emotion, normalize the experience without excusing the error, and reframe the focus to systems and team.":[227.082,8.605],"you|Say more about that, if you'd like.":[235.807,1.948],"maya|I just feel stupid.":[237.875,1.178],"narr|Her eyes fill.":[239.173,1.282],"coach|Workable. Silence gives space and signals you are not rushing her. Without validation or normalization, inviting more can deepen distress in front of peers.":[240.575,9.974],"you|Let's hold that thought and come back to it later.":[250.669,2.692],"narr|Maya nods but withdraws.":[253.481,2.105],"coach|Missed opportunity. Parking emotion leaves Maya holding it alone while the group moves on.":[255.706,5.384],"you|It's good you feel that. It'll help you remember to check your doses.":[261.209,3.886],"maya|Yeah.":[265.215,0.578],"narr|Jordan glances at Dr. Okafor.":[265.913,2.813],"coach|Missed opportunity. This ties her distress to personal failure and confirms the shame. It also puts the error on one person when the scenario shows a team and system failure.":[268.846,11.004],"narr|How do you establish the facts?":[279.971,1.844],"you|Jordan, could you give us a short summary of the case and what you think the working diagnosis was? Others, does that match what you saw?":[281.935,8.709],"jordan|Four-year-old with anaphylaxis after peanuts. We worked on IV and salbutamol, then epi went in at 1.5 milligrams and she got a bad tachycardia. We saw it was ten times the dose.":[290.764,12.109],"sam|Agree. Anaphylaxis, then epinephrine toxicity.":[302.993,2.875],"coach|Strong choice. Asking the most junior person first flattens hierarchy from the start and prevents the leader's frame from becoming the group's frame.":[305.988,8.646],"you|Dr. Okafor, as team lead, could you summarize the case?":[314.754,3.865],"sam|Anaphylaxis, we had trouble with access, and there was a dosing issue with the epi.":[318.739,4.473],"coach|Workable. Efficient and conventional. It lets the leader's framing set the story, and quieter members tend to adopt it.":[323.332,7.277],"you|Let's replay the whole thing from the moment the parent walked in.":[330.73,3.675],"narr|Eight minutes pass. Maya grows quieter.":[334.524,2.834],"coach|Missed opportunity. Replaying an error in full forces Maya to relive it step by step and costs a third of your time.":[337.478,7.119],"narr|About 17 minutes remain. You see at least four topics: the epinephrine delay, the dose, the verbal order, and Jordan's unheard concern.":[344.717,9.47],"narr|How do you manage the agenda?":[354.307,2.021],"you|Here's what you've raised and what I noticed. We have about 15 minutes. Which two matter most for your real practice?":[356.448,7.033],"jordan|The order and the dose.":[363.6,1.097],"sam|And how I missed Jordan. I want to talk about that.":[364.818,2.718],"coach|Strong choice. The whiteboard holds the agenda so nobody has to keep it in working memory, which cuts extraneous load.":[367.656,7.267],"you|We'll focus on the order and the dose, since those drove the outcome.":[375.043,4.219],"sam|Okay.":[379.381,0.624],"coach|Workable. Clear and time-efficient, and aligned with your objectives. You miss the chance to learn what the team cares about, and you may skip the speaking-up issue they wanted.":[380.125,9.987],"you|Let's quickly go through all four.":[390.232,1.935],"narr|The pace quickens. Chris checks his watch.":[392.287,2.652],"coach|Missed opportunity. Four topics in 15 minutes means about 3 minutes each: enough to name them, not to change anything.":[395.059,7.343],"narr|Gap: verbal order without units. Maya repeated the number back, and both felt the loop was closed.":[402.523,6.371],"narr|How do you explore the order?":[409.014,1.581],"you|I'd like to talk about the moment of the order, because that's where the error entered. I heard 'epi, one point five, IM' with no units, and 'one point five' repeated back. I'm curious what each of you meant by one point five?":[410.714,14.825],"sam|In my head I said point one five milligrams. Maybe I didn't say it out loud.":[425.66,4.801],"maya|I heard one point five. I repeated it and thought that was closed loop.":[430.581,4.092],"coach|Strong choice. You state precisely what you heard, without blame, and ask about meaning.":[434.793,4.663],"you|How well did communication work around the epi order?":[439.576,3.171],"sam|Could have been better, it was loud in there.":[442.867,1.895],"coach|Workable. Safe and open. It is broad enough that the team may talk about communication in general and miss the units problem at the core.":[444.882,8.03],"you|For high-risk drugs, say the drug, dose, units and route, and read back the full order, for example 'epinephrine zero point one five milligrams IM'.":[453.031,10.868],"maya|Got it.":[464.019,0.735],"coach|Workable. Specific and correct. Teaching before exploring skips the most powerful moment: the team discovering they had different numbers in their heads.":[464.874,9.085],"you|Dr. Okafor, why would anyone order 1.5 milligrams for a 15 kilo child?":[474.079,6.372],"sam|I didn't. I'm pretty sure I said point one five.":[480.571,2.576],"narr|Maya looks away.":[483.267,1.249],"coach|Missed opportunity. This assumes intent and blames publicly. It also misstates what he meant, which you haven't explored.":[484.636,7.245],"sam|Look, honestly the real issue is the double-check. In every ED I've worked in, nurses verify the dose before giving it. When I trained in Toronto we had this whole system where...":[492.001,11.02],"narr|He is two minutes in. Jordan and Maya look at the table.":[503.141,3.428],"narr|What do you do?":[506.689,1.05],"you|Dr. Okafor, let me pause you there, because I want to hear from the whole team on this. Jordan, you had a concern about that dose. What was going on for you?":[507.859,9.914],"jordan|I said isn't that a lot? but it came out like a question. He said just give it and I figured he knew something I didn't.":[517.893,6.15],"sam|I didn't even register that as a concern.":[524.163,2.177],"coach|Strong choice. You interrupt early, name your reason, and redirect with body language to the voice that matters most.":[526.46,6.685],"you|Thanks. Anyone else?":[533.266,1.233],"narr|Silence. Jordan shakes his head.":[534.619,2.21],"coach|Workable. Polite, but four minutes of monologue reinforces who holds the floor. Quieter members rarely step in after the leader has framed the problem as a nursing issue.":[536.948,10.67],"you|Dr. Okafor, you're dominating the conversation.":[547.739,3.416],"sam|Fine. I'll stop talking.":[551.275,1.291],"narr|He sits back, arms crossed.":[552.686,1.997],"coach|Missed opportunity. Direct, but it shames a senior in front of his team. He will likely withdraw or defend, and others learn that speaking in this room carries risk.":[554.803,9.739],"narr|Maya's shoulders drop.":[564.662,1.648],"coach|Missed opportunity. Letting the frame stand implies agreement that this was a nursing failure, which contradicts what you told Maya.":[566.43,7.477],"chris|Can I say something to Dr. Okafor? I'm not sure how to put it.":[574.028,3.298],"narr|Chris wants to give feedback to the team lead. How do you respond?":[577.445,3.977],"you|Please do. Try starting with what you saw and why it mattered to you, then ask how he saw it.":[581.542,5.761],"chris|I saw Jordan raise the dose while you were looking at the airway. I worried the team felt they couldn't stop you. How did it look from your spot?":[587.423,6.699],"sam|I didn't hear it as a stop. If someone had said Stop, I'm concerned about the dose, I would have stopped. Jordan, next time, use my name and say stop.":[594.242,8.737],"coach|Strong choice. You give Chris
