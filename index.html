unt is a common GAS error.":[953.611,12.69],"coach|Try next time. Gather: a shared account. You chose: Minute-by-minute replay. Try widened the account beyond the senior instead. The senior defining the account is a common GAS error.":[966.42,12.278],"coach|Flatten the hierarchy by widening the conversation, not by putting him down.":[978.819,4.317],"coach|Try next time. Gather: a shared account. You chose: Cut off the senior sharply. Try widened the account beyond the senior instead. The senior defining the account is a common GAS error.":[983.255,12.459],"coach|Your instinct. The action only makes sense once you see the thinking behind it. Say what you saw, then get curious.":[995.834,6.543],"coach|A preview, two observations, your honest concern and a real question. His frame, Hs and Ts when things settle, is now something the whole team can fix.":[1002.497,10.167],"coach|Strength. Topic 1: The six-minute gap. Preview plus advocacy-inquiry. The reasoning behind the delay is not visible, so advocacy-inquiry fits.":[1012.784,9.314],"coach|Try next time. Topic 1: The six-minute gap. You chose: Guided team self-correction. Try preview plus advocacy-inquiry instead. The reasoning behind the delay is not visible, so advocacy-inquiry fits.":[1022.218,13.614],"coach|Try next time. Topic 1: The six-minute gap. You chose: Accusatory why. Try preview plus advocacy-inquiry instead. The reasoning behind the delay is not visible, so advocacy-inquiry fits.":[1035.952,13.059],"coach|Try next time. Topic 1: The six-minute gap. You chose: Extended lecture. Try preview plus advocacy-inquiry instead. The reasoning behind the delay is not visible, so advocacy-inquiry fits.":[1049.131,13.114],"coach|Your instinct. This looks like a clear knowledge gap. Close it with one short, specific teaching point.":[1062.365,5.821],"coach|Strength. Topic 2: Calcium dosing. Directive feedback after eliciting perspective. He named the gap himself, so teach it.":[1068.306,8.0],"coach|Try next time. Topic 2: Calcium dosing. You chose: Open exploration. Try directive feedback after eliciting perspective instead. He named the gap himself, so teach it.":[1076.426,12.023],"coach|Try next time. Topic 2: Calcium dosing. You chose: Quizzing. Try directive feedback after eliciting perspective instead. He named the gap himself, so teach it.":[1088.569,11.0],"coach|The team finds three fixes: the screen, a counter and a pre-announced check.":[1099.69,4.285],"coach|Strength. Topic 3: The long pauses. Systems-focused inquiry. Framing it as a system question stops the pauses landing on Ben again.":[1104.095,8.956],"coach|Try next time. Topic 3: The long pauses. You chose: Directive feedback. Try systems-focused inquiry instead. Framing it as a system question stops the pauses landing on Ben again.":[1113.17,12.537],"coach|Try next time. Topic 3: The long pauses. You chose: Blamed an individual. Try systems-focused inquiry instead. Framing it as a system question stops the pauses landing on Ben again.":[1125.827,12.808],"coach|Pick two or three topics that matter most.":[1138.755,2.063],"coach|Try next time. Topic 3: The long pauses. You chose: Discussed every error. Try systems-focused inquiry instead. Framing it as a system question stops the pauses landing on Ben again.":[1140.939,12.658],"coach|Offering to stay behind is a quiet safety net after a hard case.":[1153.717,4.112],"coach|Strength. Summarize. Learner take-aways with commitments, signposted ending. Learners speak first, each commits to a behaviour, and you signal the end.":[1157.949,9.169],"coach|Try next time. Summarize. You chose: Take-aways without a commitment. Try learner take-aways with commitments, signposted ending instead. Learners speak first, each commits to a behaviour, and you signal the end.":[1167.238,13.522],"coach|Try next time. Summarize. You chose: Facilitator summary. Try learner take-aways with commitments, signposted ending instead. Learners speak first, each commits to a behaviour, and you signal the end.":[1180.88,12.836],"coach|Protect the last five minutes, especially after a hard case.":[1193.836,3.451],"coach|Try next time. Summarize. You chose: No summary. Try learner take-aways with commitments, signposted ending instead. Learners speak first, each commits to a behaviour, and you signal the end.":[1197.407,12.284]},"angry-family":{"narr|Tom jokes that he deals with angry families every weekend. Leah looks nervous.":[0.0,5.234],"narr|This scenario involves a raised voice. How do you open?":[5.354,3.823],"you|This session is about learning and improvement, not blame. Daniel is a trained simulated participant. He will be angry, but he won't touch anyone. If anyone feels unsafe, say 'time out' and everything stops. Afterwards he'll give you feedback from the son's point of view. 10 minutes in, then 25 to gather, analyze and summarize.":[9.297,22.102],"leah|A time-out word helps.":[31.519,1.832],"tom|Sounds good.":[33.471,0.752],"coach|Strong choice. A simulated confrontation needs clear physical boundaries and a pause word.":[34.343,5.464],"you|Learning, not blame. 10 minutes in the room, then 20 minutes to debrief.":[39.927,4.831],"tom|Let's go.":[44.878,0.728],"coach|Workable. Clear, but a confrontation scenario needs a pause word and a word on physical boundaries.":[45.725,6.222],"you|Heads up, this guy is going to be really aggressive. Good luck.":[52.067,3.731],"leah|Great.":[55.918,0.718],"narr|Leah steps back.":[56.755,1.206],"coach|Missed opportunity. Priming learners to expect aggression makes them defensive before the first word, and they meet anger with guardedness.":[58.081,8.114],"you|Remember: acknowledge, apologize, don't say calm down.":[66.315,3.739],"tom|Acknowledge, apologize. Easy.":[70.174,1.848],"coach|Missed opportunity. Handing over the answers removes the chance to see their real instincts under pressure.":[72.142,6.192],"narr|Daniel arrives at the nursing station: Why is my mother's face bruised? Why did nobody call me?":[78.455,6.185],"narr|Tom stands up and says, Sir, I need you to calm down. Daniel's voice gets louder.":[84.759,5.444],"narr|Dr. Khan explains the ward was short-staffed overnight and falls happen with elderly patients.":[90.323,6.226],"narr|Daniel slams his palm on the counter: So it's her fault for being old?":[96.669,4.348],"narr|At minute 4 Tom says, If you keep shouting, I'll call security.":[101.137,4.428],"narr|Leah says quietly, I'd be upset too if it were my mum. Daniel turns to her and his shoulders drop for a moment. Nobody builds on it.":[105.685,8.479],"narr|At minute 8 Dr. Khan says, I'm sorry this happened, and explains the X-ray plan.":[114.284,5.811],"narr|The scenario ends at minute 10. Daniel is calmer but asks for the manager and says he will complain.":[120.215,6.756],"tom|Look, he was out of line. You can't shout at staff.":[127.091,2.273],"narr|Leah is quiet. Dr. Khan looks tired.":[129.485,2.983],"narr|Tom opens defensively. How do you respond?":[132.588,3.119],"you|Being shouted at is stressful, Tom, and your safety matters. We'll look at that. Before we do, how is everyone feeling?":[135.827,7.249],"leah|Shaky. I wanted to help but didn't know if I was allowed.":[143.196,5.096],"amir|Embarrassed. I think I made it worse with the staffing thing.":[148.412,2.688],"tom|Wound up, if I'm honest.":[151.22,1.142],"coach|Strong choice. You acknowledge his stress without endorsing his verdict, and promise to return to safety.":[152.483,6.126],"you|One word each for how that felt.":[158.729,1.978],"tom|Annoyed.":[160.826,0.608],"leah|Nervous.":[161.554,0.783],"amir|Tired.":[162.457,0.614],"coach|Workable. Quick, but Tom's defensiveness needs acknowledgement or it will colour the whole debrief.":[163.191,6.055],"you|Actually, Tom, I think he had a point.":[169.366,2.461],"tom|Right. So it's my fault.":[171.947,1.181],"narr|Tom leans back and crosses his arms.":[173.248,2.593],"coach|Missed opportunity. Arguing with a learner's reaction in the first minute tells him his feelings are wrong, and he will defend himself for the rest of the debrief.":[175.961,9.239],"you|Let's start with 'calm down'. That was the turning point.":[185.32,3.318],"tom|Here we go.":[188.758,0.748],"coach|Missed opportunity. Skipping reactions is the most common GAS error, and here it lands squarely on the most defensive learner.":[189.626,7.677],"narr|You need a short account, and a check on what each person thought Daniel needed.":[197.423,4.744],"you|Leah, could you give us the short version? Then each of you: what do you think Daniel needed in that moment?":[202.287,6.356],"leah|He saw the bruise, nobody had told him, Tom said calm down, it got worse, Dr. Khan apologized at the end.":[208.763,11.572],"leah|I think he needed someone to say they were sorry.":[220.454,3.209],"amir|Information. He didn't know what happened.":[223.784,1.948],"tom|...To know she was safe, I guess.":[225.851,1.397],"coach|Strong choice. Asking the newest nurse first flattens the hierarchy, and the needs question moves the team from an angry man to a frightened son.":[227.368,8.706],"you|Here's what I saw: an upset son, a defensive response, and an apology at the end. Fair?":[236.195,6.005],"tom|I wasn't defensive.":[242.32,1.112],"coach|Workable. Efficient, but you named the gap first, and you miss the reframe that comes from asking what Daniel needed.":[243.552,6.758],"you|Dr. Khan, you were the senior person there. Tell us what happened.":[250.43,3.874],"amir|He was angry, we explained, I apologized.":[254.424,2.384],"coach|Missed opportunity. Letting the most senior person define the account is a named GAS error.":[256.928,5.664],"narr|Gap: calm down and a security threat escalated a son who was frightened, not dangerous.":[262.712,5.918],"narr|Tom's reasoning is the key. How do you open this topic?":[268.75,3.633],"you|I'd like to look at the first two minutes, because that's where anger either grows or settles. Tom, I heard 'calm down, sir', and I saw Daniel's voice get louder straight after. I was worried he heard it as 'your feelings are the problem'. What was your goal at that moment?":[272.503,16.615],"tom|Protect Leah, honestly. I thought if I took control fast, he'd back off.":[289.238,4.114],"amir|Instead it felt like we were squaring up.":[293.473,1.837],"tom|Yeah. Maybe name what he's feeling first, then set the line if I need to.":[295.43,3.638],"coach|Strong choice. The reasoning behind the words is hidden, so advocacy-inquiry fits. You make your concern honest and specific, then stay curious.":[299.187,9.222],"you|As a team, what's the standard for de-escalating an angry family member, and how close did we get?":[308.53,6.285],"leah|Don't say calm down?":[314.935,1.546],"tom|Everyone says that.":[316.601,0.998],"coach|Workable. Reasonable, but Tom's protective frame stays hidden, and without it his behaviour will repeat.":[317.719,6.362],"you|Why did you threaten him with security?":[324.201,2.123],"tom|Because he was shouting. Obviously.":[326.444,1.76],"coach|Missed opportunity. An accusatory why recreates the confrontation inside the debrief. Tom defends himself and learns nothing.":[328.324,8.068],"you|Let me walk you through three de-escalation models. You talk for six minutes.":[336.512,4.762],"narr|Tom checks the clock.":[341.394,1.517],"coach|Missed opportunity. Lecturing is a named GAS trap. The team needs to see its own pattern, not a list of models.":[343.031,7.156],"tom|But what if he had actually got violent? Are we supposed to just take it?":[350.307,3.684],"narr|Tom raises a real safety question. How do you respond?":[354.111,3.868],"you|No, you never have to take abuse, and your safety comes first. The line is behaviour: threats, throwing things, blocking an exit, or moving towards someone means call for help early and keep your distance. A raised voice from a frightened relative usually means name the feeling and give information first. If it keeps escalating, set a calm limit: 'I want to help, and I can't while you're shouting.'":[358.099,24.988],"tom|So the line is behaviour, not volume.":[383.207,2.132],"leah|I want to help, and I can't while you're shouting. I like that.":[385.46,5.375],"coach|Strong choice. Tom asked a direct question with a clear answer, so teach. You protect staff safety and draw a behavioural line, which turns calm down into a real boundary skill.":[390.955,11.514],"you|What does everyone think? When should we call security?":[402.589,3.043],"amir|When they hit someone?":[405.752,1.037],"leah|Before that, surely?":[406.909,1.454],"coach|Workable. Respectful, but staff safety has a clear answer, and a guessing game costs time.":[408.483,5.252],"you|Honestly, dealing with angry families is part of the job.":[413.855,3.777],"tom|Right.":[417.752,0.556],"narr|Tom stops contributing.":[418.427,1.852],"coach|Missed opportunity. Dismissing a genuine safety question damages trust and ignores workplace violence risk.":[420.399,7.218],"daniel|I can share how some of that landed, if it's useful.":[427.738,2.842],"narr|Bring in the simulated participant.":[430.699,2.428],"you|Thank you, Daniel. Is everyone okay to hear this now? Daniel, could you pick two or three moments, what was said, and how it felt as the son?":[433.247,8.704],"daniel|Calm down made me feel like the problem. When I heard about short staffing, I heard not our fault.":[442.071,5.171],"daniel|When Leah said she'd be upset too, I nearly cried. That was the moment I could have stopped shouting.":[447.362,4.889],"daniel|The apology came so late I didn't trust it.":[452.372,2.548],"leah|I didn't know it helped. I thought I'd overstepped.":[455.04,4.027],"coach|Strong choice. Consent first, then specific moments in first person. SP feedback turns the team's guesses about what he needed into evidence.":[459.188,9.113],"you|Sure, Daniel, go ahead.":[468.421,1.408],"daniel|Overall, I felt fobbed off.":[469.949,1.887],"coach|Workable. Useful, but unframed feedback tends to be global. Ask for moments and impact.":[471.956,5.665],"you|Thanks, Daniel, we'll keep it to the team today.":[477.742,2.851],"daniel|No problem.":[480.712,1.085],"coach|Missed opportunity. You lose the only view of how the words landed. Leah never learns her line worked.":[481.917,5.654],"amir|Honestly, nobody called him after the fall. That's what really started this.":[487.691,4.147],"narr|A system issue: the fall was never disclosed to the family. How do you handle it?":[491.958,5.154],"you|Let's look at the system. After a fall overnight, who is supposed to tell the family, and when? Where did that break? And a quick fact: disclosing a safety event and saying 'I'm sorry' is expected practice. In BC the Apology Act means an apology is not an admission of liability.":[497.233,18.779],"tom|Night shift thought days would call. Days thought nights had.":[516.132,2.844],"leah|We could add family informed to the post-fall checklist.":[519.096,4.21],"amir|And I'll apologize first, not last.":[523.426,1.931],"coach|Strong choice. Systems inquiry finds the gap in the process, not in a person. Adding one clear fact about disclosure removes a common fear that stops clinicians from apologizing early.":[525.477,12.206],"you|Next time, disclose the fall and apologize in the first minute.":[537.804,3.975],"amir|Fair.":[541.899,0.492],"coach|Workable. Correct, but it misses the handover gap that will catch the next team too.":[542.512,4.762],"you|That's night shift for you.":[547.394,1.411],"narr|The problem walks out of the room with them.":[548.925,2.684],"coach|Missed opportunity. Blaming another team is the opposite of systems thinking and leaves the gap open.":[551.728,6.162],"narr|Four minutes left. How do you close?":[558.011,2.35],"you|Each of you: one take-away and one thing you'll do on your next shift. Then, Daniel, thank you. Please take a moment to step out of the role.":[560.481,8.288],"tom|Name the feeling first. Set a limit on behaviour, not volume.":[568.889,3.407],"leah|Say it louder when something I say helps.":[572.416,3.379],"amir|Apologize first, then explain.":[575.915,1.785],"daniel|Thanks, all. That was a good group.":[577.82,1.852],"coach|Strong choice. Learners own the summary, each commits to a behaviour, and the SP is de-roled.":[579.792,5.802],"you|Key points: don't say calm down, apologize early, call the family after falls.":[585.714,5.761],"narr|Nods around the room.":[591.595,1.451],"coach|Workable. Accurate but yours, and it misses de-roling the SP.":[593.166,3.817],"you|Let's wrap up there.":[597.103,1.156],"narr|Tom leaves first.":[598.379,1.349],"coach|Missed opportunity. No summary means no commitments, and a defensive learner leaves without a plan.":[599.848,5.91],"coach|Level 4. Visiting Hours. An angry son after his mother falls on the ward. Your goals: De-escalate an angry family member by naming the emotion underneath. Disclose a patient safety event honestly, with an apology. Know when to set a boundary and when to call for help.":[605.878,17.877],"coach|Your instinct. Cover safety, objectives, logistics and orientation, without giving away the answer.":[623.875,6.38],"coach|Naming the SP's feedback role in advance makes it feel expected, not like an ambush.":[630.375,5.114],"coach|Strength. Open the session. Full opening with an SP safety plan. A simulated confrontation needs clear physical boundaries and a pause word.":[635.61,9.416],"coach|Try next time. Open the session. You chose: Standard opening, no safety plan. Try full opening with an sp safety plan instead. A simulated confrontation needs clear physical boundaries and a pause word.":[645.145,14.089],"coach|Try next time. Open the session. You chose: Threat framing. Try full opening with an sp safety plan instead. A simulated confrontation needs clear physical boundaries and a pause word.":[659.354,12.611],"coach|Try next time. Open the session. You chose: Content cueing. Try full opening with an sp safety plan instead. A simulated confrontation needs clear physical boundaries and a pause word.":[672.085,12.677],"coach|Gaps observed: Calm down escalated the anger. Staffing given as an excuse. Security threatened for a raised voice. No disclosure or apology until minute 8. Leah's empathic line not built on. Nobody called the family after the fall. Strength: Dr. Khan apologized and gave a plan.":[684.882,19.662],"coach|Your instinct. Ask learners to judge their own performance first.":[704.664,3.746],"coach|Then you widen the invitation, which is what Gather is for.":[708.531,3.309],"coach|Strength. Gather: reactions. Validation, then widen the reactions. You acknowledge his stress without endorsing his verdict, and promise to return to safety.":[711.96,9.855],"coach|Try next time. Gather: reactions. You chose: One-word check-in. Try validation, then widen the reactions instead. You acknowledge his stress without endorsing his verdict, and promise to return to safety.":[721.935,13.628],"coach|Try next time. Gather: reactions. You chose: Took the family's side. Try validation, then widen the reactions instead. You acknowledge his stress without endorsing his verdict, and promise to return to safety.":[735.684,13.853],"coach|Try next time. Gather: reactions. You chose: Skipped Gather. Try validation, then widen the reactions instead. You acknowledge his stress without endorsing his verdict, and promise to return to safety.":[749.657,13.287],"coach|That reframe is the heart of de-escalation.":[763.064,2.475],"coach|Strength. Gather: a shared account. Learner summary with a needs check. Asking the newest nurse first flattens the hierarchy, and the needs question moves the team from an angry man to a frightened son.":[765.659,12.335],"coach|Try next time. Gather: a shared account. You chose: Facilitator account. Try learner summary with a needs check instead. Asking the newest nurse first flattens the hierarchy, and the needs question moves the team from an angry man to a frightened son.":[778.114,15.872],"coach|Leah's key moment disappears from the story.":[794.106,2.424],"coach|Try next time. Gather: a shared account. You chose: Senior defines the account. Try learner summary with a needs check instead. Asking the newest nurse first flattens the hierarchy, and the needs question moves the team from an angry man to a frightened son.":[796.65,16.305],"coach|Your instinct. The action only makes sense once you see the thinking behind it. Say what you saw, then get curious.":[813.075,6.543],"coach|Tom's real goal, keeping the station safe, comes out and can be met in a better way.":[819.738,4.887],"coach|Strength. Topic 1: Calm down, sir. Preview plus advocacy-inquiry. The reasoning behind the words is hidden, so advocacy-inquiry fits.":[824.745,8.781],"coach|Try next time. Topic 1: Calm down, sir. You chose: Guided team self-correction. Try preview plus advocacy-inquiry instead. The reasoning behind the words is hidden, so advocacy-inquiry fits.":[833.646,13.077],"coach|Try next time. Topic 1: Calm down, sir. You chose: Accusatory why. Try preview plus advocacy-inquiry instead. The reasoning behind the words is hidden, so advocacy-inquiry fits.":[846.843,12.437],"coach|Try next time. Topic 1: Calm down, sir. You chose: Extended lecture. Try preview plus advocacy-inquiry instead. The reasoning behind the words is hidden, so advocacy-inquiry fits.":[859.4,12.504],"coach|Your instinct. Watch who holds the floor. Give the quieter voice a safe, specific opening.":[872.025,5.427],"coach|Strength. Human factors: when to call security. Directive teaching on boundaries. Tom asked a direct question with a clear answer, so teach.":[877.571,8.976],"coach|Try next time. Human factors: when to call security. You chose: Open exploration. Try directive teaching on boundaries instead. Tom asked a direct question with a clear answer, so teach.":[886.667,12.843],"coach|Staff safety is never just part of the job.":[899.63,2.589],"coach|Try next time. Human factors: when to call security. You chose: Minimized a safety concern. Try directive teaching on boundaries instead. Tom asked a direct question with a clear answer, so teach.":[902.338,13.529],"coach|Strength. Topic 2: Daniel's view and the apology. Structured SP feedback with learner consent. Consent first, then specific moments in first person.":[915.987,10.26],"coach|Try next time. Topic 2: Daniel's view and the apology. You chose: Open SP feedback. Try structured sp feedback with learner consent instead. Consent first, then specific moments in first person.":[926.367,14.13],"coach|Try next time. Topic 2: Daniel's view and the apology. You chose: Excluded the SP. Try structured sp feedback with learner consent instead. Consent first, then specific moments in first person.":[940.617,13.962],"coach|Strength. Topic 3: Nobody called the family. Systems-focused inquiry with disclosure teaching. Systems inquiry finds the gap in the process, not in a person.":[954.699,10.343],"coach|Try next time. Topic 3: Nobody called the family. You chose: Directive feedback. Try systems-focused inquiry with disclosure teaching instead. Systems inquiry finds the gap in the process, not in a person.":[965.162,13.884],"coach|Try next time. Topic 3: Nobody called the family. You chose: Blamed another team. Try systems-focused inquiry with disclosure teaching instead. Systems inquiry finds the gap in the process, not in a person.":[979.166,14.037],"coach|A clear end after a confrontation lets everyone leave settled.":[993.323,3.871],"coach|Strength. Summarize. Learner take-aways with commitments and SP de-roling. Learners own the summary, each commits to a behaviour, and the SP is de-roled.":[997.314,9.763],"coach|Try next time. Summarize. You chose: Facilitator summary. Try learner take-aways with commitments and sp de-roling instead. Learners own the summary, each commits to a behaviour, and the SP is de-roled.":[1007.197,13.169],"coach|Try next time. Summarize. You chose: No summary. Try learner take-aways with commitments and sp de-roling instead. Learners own the summary, each commits to a behaviour, and the SP is de-roled.":[1020.487,12.924]},"bad-news":{"narr|Dr. Patel is reading the case card twice. Priya asks if the wife is a real actor.":[0.0,6.129],"narr|This scenario may touch personal grief. How do you prebrief?":[6.249,3.857],"you|This one is about telling a family that someone has died. It can stir up personal loss, so if it's close to home, tell me privately now or step out at any time. Elena is a trained simulated participant. She'll stay in role in the room and give feedback afterwards. We're practising, not judging, and what's said here stays here.":[10.226,21.155],"raj|Thanks. I'll be fine.":[31.501,1.224],"narr|He hesitates for a second before saying it.":[32.845,2.853],"priya|Good to know she'll give feedback.":[35.818,1.403],"coach|Strong choice. Naming the emotional content and offering a private opt-out follows the INACSL prebriefing standard.":[37.341,7.218],"you|This is a safe space for practice. Ten minutes in the family room, then we debrief. Elena is an actor.":[44.679,6.891],"priya|Okay.":[51.69,0.566],"coach|Workable. Safe and clear, but it does not warn about personal grief or offer a way out.":[52.377,5.021],"you|It's just acting, don't overthink it. Tell her the news and we'll talk after.":[57.518,4.615],"raj|Right.":[62.253,0.65],"coach|Missed opportunity. Minimizing the task before it starts leaves learners unprepared for the real feelings that simulated death can bring up, and signals that emotion is not welcome in the debrief.":[63.023,12.151],"you|Before you go in, remember SPIKES: setting, perception, invitation, knowledge, emotions, summary.":[75.294,6.021],"raj|S, P, I, K, E, S. Got it.":[81.435,1.738],"coach|Missed opportunity. Giving the answer removes the chance to see what the learners do naturally, which is exactly what the debrief needs to work with.":[83.293,8.347],"narr|Dr. Patel meets Elena in a corridor alcove, standing. His pager goes off twice.":[91.761,5.97],"narr|He starts straight away: Your husband had a cardiac arrest, we ran ACLS for 40 minutes, he was in asystole.":[97.85,7.45],"narr|Elena asks, But is he okay? Can I see him? Dr. Patel says, I'm afraid we lost him.":[105.42,5.976],"narr|Elena says, Lost him? Where is he? There is a long pause. Dr. Patel fills it with details about adrenaline and rhythm checks.":[111.516,8.543],"narr|Elena starts to cry. Dr. Patel says, We did everything we could, and glances at his pager.":[120.178,6.771],"narr|Priya kneels beside Elena and hands her a tissue, but says nothing. At minute 4 Dr. Patel says he has to go.":[127.069,7.571],"narr|Priya stays. Elena asks, Did he suffer? Priya says, I'm not sure, you'd have to ask the doctor.":[134.76,6.08],"narr|The scenario ends at minute 10. Elena is sitting alone with Priya, asking to call her daughter.":[140.96,6.196],"narr|Dr. Patel is staring at the floor. His eyes are wet. Elena, now out of role, sits quietly at the side.":[147.276,7.099],"narr|The room is heavy. How do you open?":[154.495,2.27],"you|That was a hard conversation, even in simulation. Let's take a breath. How are you each feeling right now? You wait, and let the silence do the work.":[156.885,9.475],"raj|Honestly, not great. That hit closer than I expected.":[166.48,2.665],"priya|I felt useless. I didn't know what to say to her.":[169.264,2.65],"coach|Strong choice. Simulated death and grief can cause real distress. Slowing down and inviting feelings first lets the strongest reactions surface before any analysis, and your own pause models the silence you will teach later.":[172.034,14.606],"you|One word each for how that felt.":[186.76,1.978],"raj|Heavy.":[188.858,0.645],"priya|Helpless.":[189.623,0.698],"coach|Workable. Quick and inclusive, but after a death notification one word may not be enough, especially with a learner who is visibly upset.":[190.44,8.483],"you|Elena, let's start with you. How did that feel on the receiving end?":[199.043,4.03],"elena|Honestly? I felt dismissed.":[203.193,1.513],"narr|Dr. Patel's face drops.":[204.825,2.097],"coach|Missed opportunity. SP feedback is valuable, but opening with it before the learners have spoken puts them on trial while they are still raw.":[207.042,8.264],"you|Right, let's go through the SPIKES steps and see which ones you missed.":[215.426,3.735],"raj|Sure.":[219.281,0.485],"narr|He wipes his eyes and stops talking.":[219.887,2.648],"coach|Missed opportunity. Jumping to a checklist while a learner is tearful tells him his feelings do not count.":[222.654,5.955],"raj|Sorry. My dad died last year, in an ED like this. I thought I was over it.":[228.729,3.84],"narr|Dr. Patel has disclosed a personal loss in front of the group. What do you do?":[232.689,5.298],"you|Thank you for trusting us with that, and I'm sorry about your dad. It makes complete sense that this brought it back. You can keep going, take a break, or step out, and there's no wrong choice. Either way, I'd like to check in with you one-to-one after we finish.":[238.107,15.351],"raj|I'll stay. I want to learn how to do this better.":[253.578,2.26],"priya|For what it's worth, I'd never have guessed. You were calm.":[255.958,2.815],"coach|Strong choice. You validate without turning the debrief into therapy, give him control, and promise a private follow-up where you can point him to support services.":[258.893,9.445],"you|Do you want to take a few minutes outside?":[268.458,2.094],"raj|No, I'm fine.":[270.673,1.135],"coach|Workable. Kind, but it removes him before he has chosen, and nothing tells him he will be followed up.":[271.928,5.875],"you|Tell us more about your dad. What happened in the ED that day?":[277.923,3.777],"narr|Dr. Patel talks for five minutes. Priya looks uncomfortable. Elena looks away.":[281.82,5.426],"coach|Missed opportunity. A debrief is not a counselling session. Exploring a personal loss in front of peers exposes him and takes the group far from the objectives.":[287.366,10.338],"you|Let's try to keep things about the scenario.":[297.823,2.374],"raj|Sure. Sorry.":[300.317,0.92],"coach|Missed opportunity. Moving on without acknowledgement tells everyone that emotion is off limits here, and leaves a distressed learner alone with it.":[301.358,8.505],"narr|Now you need a short, shared account of the conversation.":[309.983,3.479],"you|Priya, could you give us a short summary of how the conversation went? Then each of you: what were you trying to achieve in that room?":[313.582,7.705],"priya|He told her in the corridor, she didn't understand lost, she cried, he left, I stayed but froze.":[321.407,5.8],"raj|I wanted to be accurate and not give false hope.":[327.327,2.329],"priya|I wanted not to make it worse.":[329.776,1.411],"coach|Strong choice. A brief learner account plus a goal check shows the frames they worked from: Dr.":[331.307,5.807],"you|Let's watch the whole recording and pause on every line.":[337.234,3.149],"narr|Eight minutes later, Dr. Patel has his head in his hands.":[340.503,3.987],"coach|Missed opportunity. Replaying a painful conversation line by line eats a third of your time and makes the learners relive it.":[344.61,7.685],"you|Here's what I saw: the news was given standing, with medical terms, and the doctor left early. Fair?":[352.415,6.419],"raj|Fair.":[358.955,0.6],"coach|Workable. Efficient, but you named the gaps before hearing their goals. The frames behind the words are the richest material here.":[359.675,7.589],"narr|Gap: jargon, then a euphemism. Elena did not understand that her husband had died.":[367.384,5.535],"narr|Dr. Patel's reasoning is the key. How do you explore it?":[373.039,3.846],"you|I'd like to look at the words we use, because families remember them for years. I heard 'asystole', then 'we lost him', and Elena asked where he was. I was worried she didn't know he had died. What was going on for you when you chose those words?":[377.005,15.052],"raj|Died felt too harsh. I thought softer words were kinder.":[392.176,2.776],"priya|But she didn't understand. Softer made it longer.":[395.073,2.687],"raj|So the kind thing is to be clear. Carlos has died. Then stop.":[397.879,3.134],"coach|Strong choice. The gap sits in his frame: plain words felt brutal to him. Advocacy-inquiry brings that out without blame.":[401.133,7.54],"you|In death notification, use the word 'died' or 'dead'. Euphemisms like 'lost' confuse families.":[408.793,6.534],"raj|Okay.":[415.448,0.703],"coach|Workable. Correct, and backed by the GRIEV_ING protocol, but you skipped his reasoning.":[416.271,5.248],"you|Why would you say 'we lost him'? That's a classic mistake.":[421.639,3.342],"raj|Everyone says it.":[425.1,1.124],"narr|He folds his arms.":[426.344,1.463],"coach|Missed opportunity. An accusatory why to a learner who has just disclosed personal grief is especially harmful.":[427.927,6.926],"you|Looking back on the words you used, what went well, and what would you change?":[434.973,4.438],"raj|I'd sit down, I guess?":[439.531,1.431],"coach|Workable. Safe, but he believes the softer words were kind, so he cannot name this gap himself.":[441.081,5.955],"elena|I have some notes about how that felt, if it helps.":[447.156,2.627],"narr|The simulated participant offers feedback. How do you bring her in?":[449.903,4.225],"you|Thank you, Elena. Dr. Patel, Priya, is it okay to hear Elena's perspective now? Elena, could you share one or two moments, what was said, and how it landed for you as the wife?":[454.249,11.998],"elena|When I heard we lost him, I honestly thought he'd been moved. And when the doctor looked at his pager, I felt I wasn't worth his time.":[466.366,7.589],"elena|When Priya knelt down and handed me a tissue, I felt less alone.":[474.075,3.757],"raj|The pager. I didn't even notice I did that.":[477.952,2.207],"coach|Strong choice. You ask the learners first, then steer the SP to specific, observable moments in first person, which is how the ASPE standards describe SP feedback.":[480.28,10.654],"you|Sure, go ahead, Elena.":[491.053,1.351],"elena|Overall it felt quite cold, to be honest.":[492.524,2.402],"narr|Dr. Patel nods slowly.":[495.046,2.173],"coach|Workable. Useful, but without framing the SP may give global impressions rather than specific moments, which are harder to learn from.":[497.339,8.224],"you|Thanks, Elena, but we'll keep this to the clinical team.":[505.683,3.319],"elena|Of course.":[509.122,0.752],"coach|Missed opportunity. You lose the one perspective the learners cannot get anywhere else: how their words landed.":[509.994,6.147],"you|Elena, out of ten, how would you rate Dr. Patel's performance?":[516.261,4.129],"elena|Maybe a four?":[520.51,0.909],"narr|The room goes quiet.":[521.54,1.666],"coach|Missed opportunity. Asking the SP to grade a learner in front of the group creates threat and gives a number, not a lesson.":[523.326,7.345],"priya|I just didn't know what to say when she cried. The silence felt awful.":[530.791,3.755],"narr|Priya names a skill gap. How do you close it?":[534.665,2.932],"you|That's honest, thank you. Two tools. First, silence is not failure: sit, stay close, and count to ten in your head. Second, when you speak, name the emotion instead of adding facts. Something like, 'This is a terrible shock,' or 'I can't imagine how hard this is.' That's the NURSE approach: name, understand, respect, support, explore.":[537.717,21.285],"priya|This is a terrible shock. I could have said that.":[559.122,2.491],"raj|And I could have stopped talking.":[561.733,1.445],"coach|Strong choice. She has named a knowledge gap and asked for help, so teach. Short, specific, with phrases she can use tomorrow.":[563.298,7.514],"you|What could anyone say in that moment?":[570.932,1.887],"raj|Sorry for your loss?":[572.939,1.229],"narr|Nobody offers more.":[574.288,1.694],"coach|Workable. Respectful, but the group has just shown it does not have these phrases.":[576.102,4.641],"you|Let me explain the stages of grief and the literature on bereavement. You talk for six minutes.":[580.863,6.109],"narr|Priya takes notes she will not use.":[587.092,2.532],"coach|Missed opportunity. A lecture on theory does not give her words for the next time a family member cries.":[589.744,6.169],"narr|Five minutes left. How do you close?":[596.033,2.449],"you|Let's go around: one thing you'll take into your next death notification, and one thing you'll do for yourself after a hard shift. Elena, thank you, and please take a moment to step out of the role before you leave. Dr. Patel, let's grab five minutes after this.":[598.603,17.31],"raj|Sit down, say died, then stop talking.":[616.033,2.219],"priya|Stay close and name the feeling.":[618.372,1.619],"raj|And I'll call my sister tonight.":[620.111,1.585],"elena|Thank you both. I'm Maria again now.":[621.816,1.953],"coach|Strong choice. You close with concrete commitments, add self-care, de-role the SP as the ASPE standards recommend, and keep your promise to follow up.":[623.889,9.317],"you|What will each of you do differently next time?":[633.326,2.266],"raj|Say died.":[635.712,0.811],"priya|Use silence.":[636.644,0.85],"coach|Workable. Good, learners speak first. After this case, add self-care and de-role the SP so nobody leaves carrying the scenario.":[637.614,8.527],"you|We're out of time, thanks all.":[646.261,1.54],"narr|Dr. Patel leaves quickly without speaking to anyone.":[647.92,3.703],"coach|Missed opportunity. Ending abruptly after a disclosure of personal grief leaves a learner exposed and an SP still in role.":[651.743,7.698],"coach|Level 4. The Last Word. Telling a wife her husband has died. Your goals: Deliver a death notification with a structured approach such as SPIKES or GRIEV_ING. Respond to strong emotion with silence and empathic statements . Look after yourself and your colleagues after a hard conversation.":[659.561,18.804],"coach|Your instinct. Cover safety, objectives, logistics and orientation, without giving away the answer.":[678.485,6.38],"coach|Introducing the SP and her role in the debrief makes her feedback expected rather than a surprise. Learners who know the rules can take more risks.":[684.986,9.032],"coach|Strength. Set the scene for a hard conversation. Full prebrief with emotional safety and SP introduction. Naming the emotional content and offering a private opt-out follows the INACSL prebriefing standard.":[694.137,13.509],"coach|With death notification, that is the most useful sentence you can add.":[707.766,3.987],"coach|Try next time. Set the scene for a hard conversation. You chose: Standard prebrief without the emotional warning. Try full prebrief with emotional safety and sp introduction instead. Naming the emotional content and offering a private opt-out follows the INACSL prebriefing standard.":[711.873,18.478],"coach|Try next time. Set the scene for a hard conversation. You chose: Minimized the emotional load. Try full prebrief with emotional safety and sp introduction instead. Naming the emotional content and offering a private opt-out follows the INACSL prebriefing standard.":[730.471,17.467],"coach|Try next time. Set the scene for a hard conversation. You chose: Content cueing. Try full prebrief with emotional safety and sp introduction instead. Naming the emotional content and offering a private opt-out follows the INACSL prebriefing standard.":[748.058,16.545],"coach|Gaps observed: No private room, no chair. No perception check or warning shot. Jargon, then the euphemism we lost him. Silence filled with detail. Emotion met with facts. Resident left at minute 4. Strength: Priya stayed with Elena.":[764.723,15.372],"coach|Your instinct. Open the door to feelings before facts.":[780.215,3.312],"coach|Strength. Reactions. Emotion invitation with normalization. Simulated death and grief can cause real distress.":[783.647,7.665],"coach|Try next time. Reactions. You chose: One-word check-in. Try emotion invitation with normalization instead. Simulated death and grief can cause real distress.":[791.432,11.285],"coach|Learner reactions first, then SP feedback during analysis.":[802.838,3.755],"coach|Try next time. Reactions. You chose: Opened with SP feedback before learner reactions. Try emotion invitation with normalization instead. Simulated death and grief can cause real distress.":[806.712,13.396],"coach|Reactions come first.":[820.229,1.355],"coach|Try next time. Reactions. You chose: Skipped reactions. Try emotion invitation with normalization instead. Simulated death and grief can cause real distress.":[821.704,11.348],"coach|Your instinct. Emotion comes before analysis. Validate what they feel, then normalize it.":[833.172,5.748],"coach|The INACSL standard asks for support to be available when distress is unexpected.":[839.04,4.907],"coach|Strength. Human factors: when it is personal. Validation, normalization and choice. You validate without turning the debrief into therapy, give him control, and promise a private follow-up where you can point him to support services.":[844.067,14.331],"coach|Offer the choice and a check-in.":[858.518,1.583],"coach|Try next time. Human factors: when it is personal. You chose: Offered a break only. Try validation, normalization and choice instead. You validate without turning the debrief into therapy, give him control, and promise a private follow-up where you can point him to support services.":[860.221,17.813],"coach|Offer support privately.":[878.154,1.405],"coach|Try next time. Human factors: when it is personal. You chose: Turned the debrief into therapy. Try validation, normalization and choice instead. You validate without turning the debrief into therapy, give him control, and promise a private follow-up where you can point him to support services.":[879.679,18.451],"coach|Try next time. Human factors: when it is personal. You chose: Moved past the disclosure. Try validation, normalization and choice instead. You validate without turning the debrief into therapy, give him control, and promise a private follow-up where you can point him to support services.":[898.25,18.24],"coach|Your instinct. Keep it short, let a learner lead, and check that everyone agrees.":[916.61,4.635],"coach|Patel wanted to be accurate, Priya wanted to not make it worse. Both frames drive what happened.":[921.365,5.659],"coach|Strength. Description. Learner summary with a goal check. A brief learner account plus a goal check shows the frames they worked from: Dr.":[927.144,8.315],"coach|Use one short clip for one teaching point, if at all.":[935.58,2.967],"coach|Try next time. Description. You chose: Full video replay. Try learner summary with a goal check instead. A brief learner account plus a goal check shows the frames they worked from: Dr.":[938.666,12.34],"coach|Try next time. Description. You chose: Facilitator summary. Try learner summary with a goal check instead. A brief learner account plus a goal check shows the frames they worked from: Dr.":[951.126,12.265],"coach|Your instinct. The action only makes sense once you see the thinking behind it. Say what you saw, then get curious.":[963.511,6.543],"coach|The GRIEV_ING protocol's rule follows naturally: say died or dead, then stop and give space.":[970.174,6.441],"coach|Strength. Issue 1: We lost him. Focused facilitation: preview + advocacy-inquiry. The gap sits in his frame: plain words felt brutal to him.":[976.736,9.695],"coach|Unless the belief that plain words are cruel changes, he will soften them again under pressure.":[986.551,5.023],"coach|Try next time. Issue 1: We lost him. You chose: Directive feedback. Try focused facilitation: preview + advocacy-inquiry instead. The gap sits in his frame: plain words felt brutal to him.":[991.693,13.43],"coach|He defends himself instead of reflecting.":[1005.244,2.139],"coach|Try next time. Issue 1: We lost him. You chose: Accusatory why. Try focused facilitation: preview + advocacy-inquiry instead. The gap sits in his frame: plain words felt brutal to him.":[1007.503,13.483],"coach|Self-assessment works when learners can see the problem.":[1021.106,3.015],"coach|Try next time. Issue 1: We lost him. You chose: Learner self-assessment. Try focused facilitation: preview + advocacy-inquiry instead. The gap sits in his frame: plain words felt brutal to him.":[1024.241,13.856],"coach|Your instinct. Peers can coach each other. Give them a simple structure so feedback stays curious.":[1038.216,5.83],"coach|It turns her experience into precise, usable data.":[1044.166,3.231],"coach|Strength. Human factors: Elena's feedback. Structured SP feedback with learner consent. You ask the learners first, then steer the SP to specific, observable moments in first person, which is how the ASPE standards describe SP feedback.":[1047.517,15.863],"coach|Try next time. Human factors: Elena's feedback. You chose: Open SP feedback. Try structured sp feedback with learner consent instead. You ask the learners first, then steer the SP to specific, observable moments in first person, which is how the ASPE standards describe SP feedback.":[1063.5,19.615],"coach|SP feedback is a core part of communication simulation.":[1083.235,3.651],"coach|Try next time. Human factors: Elena's feedback. You chose: Excluded the SP. Try structured sp feedback with learner consent instead. You ask the learners first, then steer the SP to specific, observable moments in first person, which is how the ASPE standards describe SP feedback.":[1087.006,19.539],"coach|Ask for specific moments and their impact instead.":[1106.665,2.975],"coach|Try next time. Human factors: Elena's feedback. You chose: Made the SP an assessor. Try structured sp feedback with learner consent instead. You ask the learners first, then steer the SP to specific, observable moments in first person, which is how the ASPE standards describe SP feedback.":[1109.76,19.738],"coach|Your instinct. This looks like a clear knowledge gap. Close it with one short, specific teaching point.":[1129.618,5.821],"coach|Evidence from SPIKES and VitalTalk puts responding to emotion at the heart of bad news conversations.":[1135.559,6.319],"coach|Strength. Issue 2: Filling the silence. Directive feedback with a model. She has named a knowledge gap and asked for help, so teach.":[1141.997,8.135],"coach|Brief teaching after hearing her gets further, faster.":[1150.253,2.804],"coach|Try next time. Issue 2: Filling the silence. You chose: Open exploration. Try directive feedback with a model instead. She has named a knowledge gap and asked for help, so teach.":[1153.177,11.989],"coach|Keep teaching short and practical.":[1165.286,1.909],"coach|Try next time. Issue 2: Filling the silence. You chose: Extended lecture. Try directive feedback with a model instead. She has named a knowledge gap and asked for help, so teach.":[1167.315,11.819],"coach|Your instinct. Let every learner name their own take-away and a change for practice.":[1179.254,5.049],"coach|After a hard case, how people leave matters as much as what they learned.":[1184.423,3.915],"coach|Strength. Application and summary. Learner-guided summary with self-care and SP de-roling. You close with concrete commitments, add self-care, de-role the SP as the ASPE standards recommend, and keep your promise to follow up.":[1188.458,14.583],"coach|Try next time. Application and summary. You chose: Learner take-aways without self-care. Try learner-guided summary with self-care and sp de-roling instead. You close with concrete commitments, add self-care, de-role the SP as the ASPE standards recommend, and keep your promise to follow up.":[1203.161,18.854],"coach|Protect the last five minutes.":[1222.135,1.549],"coach|Try next time. Application and summary. You chose: No summary. Try learner-guided summary with self-care and sp de-roling instead. You close with concrete commitments, add self-care, de-role the SP as the ASPE standards recommend, and keep your promise to follow up.":[1223.804,17.383]},"peds-shock":{"narr|Jordan asks if the mother will be in the way. Maya is laying out the infant IO kit.":[0.0,5.983],"narr|A sick infant and a parent in the room. How do you open?":[6.103,3.802],"you|This is about learning and improvement, not blame. Sick infant cases can feel personal, especially for parents, so step out if you need to. Aisha is a simulated participant playing Zara's mother. She'll react like a parent would and give feedback afterwards. Say 'time out' if anything feels unsafe. 16 minutes in, then 30 to gather, analyze and summarize.":[10.024,24.027],"maya|Appreciated. I've got a baby at home.":[34.172,2.333],"sam|Good to know how Aisha fits in.":[36.625,1.474],"coach|Strong choice. You name the emotional weight of paediatric cases, brief the SP role, and give a pause word.":[38.219,6.733],"you|Learning, not blame. 16 minutes in, then 25 to debrief.":[45.072,4.575],"sam|Let's go.":[49.767,0.737],"coach|Workable. Clear, but a sick infant and a parent in the room deserve an emotional warning and an SP briefing.":[50.625,6.633],"you|There's a mother in this one. Keep her out of the way so you can work.":[57.377,3.839],"jordan|Got it.":[61.336,0.637],"coach|Missed opportunity. You have told the team family presence is a problem before the case starts, which is the opposite of current guidance.":[62.093,7.779],"you|Quick reminder: IO early, 20 mL per kilo, antibiotics in the first hour.":[69.992,5.697],"sam|IO early. Noted.":[75.809,1.261],"coach|Missed opportunity. Handing over the bundle removes the recognition challenge the case is built on.":[77.19,6.012],"narr|Zara is floppy and mottled. Heart rate 210, capillary refill 5 seconds, temperature 39.4. Aisha is holding her hand and crying.":[83.322,11.136],"narr|Jordan tries an IV. Two attempts fail. Dr. Okafor asks him to keep trying.":[94.578,6.018],"narr|At minute 5 Jordan says to Aisha, You can't be in here right now, and walks her to the door. Nobody explains why.":[100.715,7.569],"narr|A third IV attempt fails at minute 8. Maya says, Should we go IO? Dr. Okafor says, Yes, now. IO is in at minute 10.":[108.404,8.706],"narr|First fluid bolus, 20 mL per kilo by push-pull, at minute 12. Heart rate falls to 190.":[117.23,7.777],"narr|At minute 14 Aisha pushes back into the room: Is she dying? Nobody's telling me anything!":[125.127,6.11],"narr|Maya takes her aside and explains what is happening. Aisha stays, holding Zara's foot.":[131.357,6.202],"narr|The scenario ends at minute 16. Second bolus running, antibiotics still being drawn up, PICU called.":[137.679,7.246],"sam|That was stressful. The IV took forever.":[145.045,2.202],"jordan|I did what I was supposed to do.":[147.367,1.467],"narr|Aisha, out of role, sits quietly. Maya glances at Jordan.":[148.954,4.307],"narr|Frustration and defensiveness. How do you open?":[153.381,3.366],"you|Sick infant cases are some of the hardest we do, and everyone worked hard in there. Let's start with how you're all feeling.":[156.867,7.605],"maya|Sad. That mother's face when she was sent out.":[164.592,2.361],"chris|Tense. Nobody was talking to each other.":[167.073,2.017],"jordan|Like I got blamed for the IV.":[169.211,1.565],"sam|Frustrated, mostly with myself.":[170.896,1.668],"coach|Strong choice. Normalizing the stress takes the heat out of Dr. Okafor's frustration and Jordan's defensiveness, and gives the quieter voices space.":[172.685,9.454],"you|One word each for how that felt.":[182.259,1.978],"jordan|Blamed.":[184.357,0.593],"maya|Sad.":[185.07,0.599],"coach|Workable. Quick, but Jordan's defensiveness needs more than one word to surface.":[185.789,4.86],"you|Let's start with the IV. Three attempts is too many.":[190.769,3.372],"jordan|I was told to keep trying.":[194.26,1.268],"coach|Missed opportunity. Skipping reactions and opening on the most defensive learner's error confirms his fear of blame.":[195.648,6.767],"you|Aisha, how did it feel to be sent out?":[202.535,2.185],"aisha|Terrifying.":[204.84,1.16],"narr|Jordan stares at the table.":[206.12,2.144],"coach|Missed opportunity. SP feedback belongs in Analyze, after the learners have had their say.":[208.384,5.544],"narr|Build a short account and check the key problem each person was managing.":[214.048,4.514],"you|Chris, you had a view of the whole bay. Could you give us the short version? Then each of you, what was the key problem you were managing?":[218.682,7.931],"chris|Septic infant, IV failed three times, IO at 10, bolus at 12, mum sent out and came back, second bolus running.":[226.733,6.431],"sam|Access.":[233.284,0.619],"jordan|Getting the IV. And keeping the room clear.":[234.022,2.23],"maya|Shock, and then the mum.":[236.372,1.214],"coach|Strong choice. A summary from the person with the widest view, then a key-problem check, shows the team was solving different problems: access, airway, and the mother.":[237.706,9.73],"you|IO at minute 10, bolus at 12, antibiotics not given. Fair?":[247.556,4.705],"sam|Fair.":[252.381,0.484],"coach|Workable. Accurate but yours, and you miss the different problems each person was solving.":[252.985,5.023],"you|Let's go through all 16 minutes. Jordan, start with your first IV attempt.":[258.128,5.321],"narr|Eight minutes later, Jordan has stopped talking.":[263.569,2.96],"coach|Missed opportunity. A full replay starting with the defensive learner's error is two GAS traps at once.":[266.649,6.572],"narr|Gap: three IV attempts over 8 minutes before intraosseous access in a shocked infant.":[273.341,6.318],"narr|The team can already see this gap. How do you open it?":[279.779,3.35],"you|You've all spotted that access took too long. As a team, what's our rule for access in a shocked infant, and who calls it? Let's put it on the board.":[283.248,9.402],"maya|Two failed IV attempts or 90 seconds, then IO.":[292.77,3.259],"sam|And I call it out loud, as lead. I shouldn't have said keep trying.":[296.15,3.687],"jordan|I'd have gone IO if someone had said it was okay.":[299.956,2.346],"coach|Strong choice. The gap is visible to everyone, so let the team fix it. They build a shared rule and a named trigger, which takes the heat off Jordan and puts it on the process.":[302.422,10.545],"you|In a shocked infant, if IV access isn't quick, go straight to IO. Check your local protocol for the exact trigger.":[313.087,8.214],"sam|Understood.":[321.421,0.751],"coach|Workable. Accurate and fast, but the team could have built this themselves, and a team-owned rule sticks better.":[322.292,6.106],"you|Jordan, why did you try three times?":[328.517,2.357],"jordan|Because I was told to.":[330.995,1.222],"narr|Dr. Okafor looks away.":[332.337,2.103],"coach|Missed opportunity. He was told to keep trying. An accusatory why lands blame on the most junior person for a leadership decision.":[334.56,8.018],"jordan|Parents panic and get in the way. I was protecting the team.":[342.698,3.012],"narr|Jordan's belief drove the key moment. How do you explore it?":[345.83,3.932],"you|I'd like to look at minute 5. I saw Aisha walked out with no explanation, and I was worried about how that felt for her, and that she came back more distressed. What made you decide she needed to leave? Then, once you've heard him: Guidelines support offering family presence, and studies found families who witnessed resuscitation coped better, with no interference in care, especially when one person is assigned to support them.":[349.882,26.26],"jordan|I thought she'd freak out and stop us working.":[376.261,2.116],"maya|She calmed down once someone explained things.":[378.498,2.302],"jordan|So the problem wasn't her being there. It was nobody being with her.":[380.92,3.326],"coach|Strong choice. You surface his frame first, then share the evidence he has not seen. The Emergency Nurses Association guideline supports family presence with a designated support person, and observational studies show no delay in care.":[384.366,15.151],"you|Family presence is supported by guidelines. Assign someone to support the parent.":[399.637,5.086],"jordan|Sure.":[404.843,0.533],"narr|He doesn't sound convinced.":[405.495,1.941],"coach|Workable. Correct, but without hearing Jordan's belief, the teaching bounces off it.":[407.556,4.825],"you|Honestly, sending her out like that was pretty cruel.":[412.501,2.889],"jordan|I was doing my job.":[415.51,1.174],"coach|Missed opportunity. A moral verdict shames him in front of peers and shuts down reflection.":[416.804,5.22],"aisha|Can I share what that was like from the doorway?":[422.144,2.637],"narr|Jordan shifts in his seat.":[424.901,1.922],"narr|The SP wants to give feedback, and Jordan is braced. What do you do?":[426.943,4.52],"you|Thank you, Aisha. Is everyone okay to hear this? Aisha, could you share a couple of specific moments, what happened and how it felt as Zara's mum, including anything that helped?":[431.584,11.532],"aisha|When I was walked out without a word, I thought she was dying and they didn't want me to see.":[443.235,4.614],"aisha|When Maya explained what the needle in her leg was for, I could breathe again.":[447.969,4.291],"jordan|That's hard to hear. But it makes sense.":[452.381,1.767],"coach|Strong choice. Consent protects Jordan. Asking for specific moments, including what helped, keeps the feedback balanced and usable rather than a verdict.":[454.268,9.492],"you|Sure, Aisha, go ahead.":[463.879,1.423],"aisha|Being sent out was the worst part.":[465.422,2.275],"narr|Jordan says nothing.":[467.818,1.634],"coach|Workable. Useful, but without consent and framing, Jordan hears it as a verdict.":[469.572,4.758],"you|Let's leave the parent feedback for today.":[474.45,2.245],"aisha|Okay.":[476.815,1.024],"coach|Missed opportunity. You lose the most powerful learning in the case, and Jordan never hears what helped.":[477.959,5.633],"maya|We don't have a family support role on our resus card. It's whoever is free.":[483.712,4.426],"narr|A system gap. How do you handle it?":[488.257,2.305],"you|Let's look at the set-up. Walk me through the resus roles on your card. Where would a family support person fit, and what would they do?":[490.683,8.252],"maya|Add family support to the role card, assigned at the start.":[499.054,3.478],"chris|They explain each step in plain words and stay with the parent.":[502.652,3.036],"sam|And I'll assign it in the first minute, like airway and access.":[505.808,3.059],"coach|Strong choice. Systems inquiry turns a painful moment into a unit improvement. The team designs a role that the evidence supports, and you capture it for the unit lead.":[508.988,10.492],"you|Next time, assign a family support person at the start.":[519.599,3.432],"sam|Will do.":[523.151,0.647],"coach|Workable. Right answer, but the team could have designed it and the role card would still be missing it.":[523.918,5.368],"you|Let's also go through antibiotics timing, the airway, the documentation and the PICU call.":[529.406,6.192],"narr|Twenty-eight minutes gone. Everyone is flagging.":[535.718,2.967],"coach|Missed opportunity. Covering every error is a named GAS trap. It crowds out the summary and overloads a tired team.":[538.805,7.496],"narr|Five minutes left. How do you close?":[546.421,2.449],"you|Let's go around: one take-away and one thing you'll do on your next shift. Then, Aisha, thank you for such a real performance. Please take a minute to step out of the role. And anyone who found this one hard, I'm around after.":[548.99,14.598],"jordan|Keep the parent in, with someone beside them.":[563.708,1.923],"sam|Call IO out loud after two failed attempts.":[565.751,2.55],"maya|Push to add family support to our role card.":[568.422,2.53],"chris|Say what I'm seeing, even if nobody asks.":[571.072,2.409],"aisha|Thank you. I'm me again.":[573.601,1.79],"coach|Strong choice. Learners own the summary, each commits to a behaviour, the SP is de-roled, and you offer support after a paediatric case.":[575.511,8.775],"you|What's one thing each of you learned?":[584.406,1.919],"sam|IO sooner.":[586.446,0.839],"jordan|Family can stay.":[587.405,0.961],"coach|Workable. Good, learners go first. After a paediatric case with an SP, add commitments, de-role her, and offer support.":[588.486,7.591],"you|We're out of time, thanks everyone.":[596.197,1.808],"narr|Maya is the last to leave, looking at the infant manikin.":[598.125,3.792],"coach|Missed opportunity. Leaving without a summary after a sick infant case sends people out with stress and no plan.":[602.037,6.768],"coach|Level 5. Small Hands. Infant septic shock with a parent in the room. Your goals: Recognize infant septic shock and move to intraosseous access without delay. Support family presence with a designated family support person. Keep the team talking when the pressure is high.":[608.925,18.361],"coach|Your instinct. Cover safety, objectives, logistics and orientation, without giving away the answer.":[627.406,6.38],"coach|That is the INACSL prebriefing standard applied to a high-intensity case.":[633.906,4.451],"coach|Strength. Open the session. Full opening with emotional safety and SP briefing. You name the emotional weight of paediatric cases, brief the SP role, and give a pause word.":[638.477,11.19],"coach|Try next time. Open the session. You chose: Standard opening. Try full opening with emotional safety and sp briefing instead. You name the emotional weight of paediatric cases, brief the SP role, and give a pause word.":[649.787,14.963],"coach|Try next time. Open the session. You chose: Set up family exclusion. Try full opening with emotional safety and sp briefing instead. You name the emotional weight of paediatric cases, brief the SP role, and give a pause word.":[664.869,15.538],"coach|Try next time. Open the session. You chose: Content cueing. Try full opening with emotional safety and sp briefing instead. You name the emotional weight of paediatric cases, brief the SP role, and give a pause word.":[680.527,14.903],"coach|Gaps observed: Shock recognized, but IO delayed to minute 10. First bolus at minute 12. Antibiotics not yet given. Mother sent out with no explanation. No family support person assigned. Strength: Maya prompted IO and later supported Aisha.":[695.55,17.135],"coach|Your instinct. Ask learners to judge their own performance first.":[712.804,3.746],"coach|Strength. Gather: reactions. Emotion invitation with normalization. Normalizing the stress takes the heat out of Dr.":[716.671,7.888],"coach|Try next time. Gather: reactions. You chose: One-word check-in. Try emotion invitation with normalization instead. Normalizing the stress takes the heat out of Dr.":[724.678,11.578],"coach|Try next time. Gather: reactions. You chose: Skipped Gather. Try emotion invitation with normalization instead. Normalizing the stress takes the heat out of Dr.":[736.377,11.203],"coach|Here it lands as an accusation against Jordan.":[747.699,2.76],"coach|Try next time. Gather: reactions. You chose: Opened with SP feedback. Try emotion invitation with normalization instead. Normalizing the stress takes the heat out of Dr.":[750.58,12.139],"coach|Strength. Gather: a shared account. Learner summary with a key-problem check. A summary from the person with the widest view, then a key-problem check, shows the team was solving different problems: access, airway, and the mother.":[762.838,13.61],"coach|Try next time. Gather: a shared account. You chose: Facilitator account. Try learner summary with a key-problem check instead. A summary from the person with the widest view, then a key-problem check, shows the team was solving different problems: access, airway, and the mother.":[776.568,17.271],"coach|Try next time. Gather: a shared account. You chose: Minute-by-minute replay. Try learner summary with a key-problem check instead. A summary from the person with the widest view, then a key-problem check, shows the team was solving different problems: access, airway, and the mother.":[793.959,17.321],"coach|Your instinct. The action only makes sense once you see the thinking behind it. Say what you saw, then get curious.":[811.399,6.543],"coach|Strength. Topic 1: Getting access. Guided team self-correction. The gap is visible to everyone, so let the team fix it.":[818.062,7.833],"coach|Try next time. Topic 1: Getting access. You chose: Directive feedback. Try guided team self-correction instead. The gap is visible to everyone, so let the team fix it.":[826.015,11.328],"coach|Try next time. Topic 1: Getting access. You chose: Accusatory why. Try guided team self-correction instead. The gap is visible to everyone, so let the team fix it.":[837.462,11.327],"coach|Your instinct. This looks like a clear knowledge gap. Close it with one short, specific teaching point.":[848.909,5.821],"coach|Strength. Topic 2: The mother at the door. Advocacy-inquiry, then directive evidence. You surface his frame first, then share the evidence he has not seen.":[854.85,9.735],"coach|Try next time. Topic 2: The mother at the door. You chose: Directive feedback. Try advocacy-inquiry, then directive evidence instead. You surface his frame first, then share the evidence he has not seen.":[864.705,13.109],"coach|Stay curious about the belief behind the action.":[877.934,2.634],"coach|Try next time. Topic 2: The mother at the door. You chose: Judgment without inquiry. Try advocacy-inquiry, then directive evidence instead. You surface his frame first, then share the evidence he has not seen.":[880.688,13.556],"coach|Your instinct. Emotion comes before analysis. Validate what they feel, then normalize it.":[894.364,5.748],"coach|Strength. Human factors: Aisha's feedback. Structured SP feedback with learner consent. Consent protects Jordan.":[900.233,7.412],"coach|Try next time. Human factors: Aisha's feedback. You chose: Open SP feedback. Try structured sp feedback with learner consent instead. Consent protects Jordan.":[907.765,11.412],"coach|Try next time. Human factors: Aisha's feedback. You chose: Excluded the SP. Try structured sp feedback with learner consent instead. Consent protects Jordan.":[919.296,11.486],"coach|Strength. Topic 3: No one assigned to the family. Systems-focused inquiry. Systems inquiry turns a painful moment into a unit improvement.":[930.903,9.29],"coach|Try next time. Topic 3: No one assigned to the family. You chose: Directive feedback. Try systems-focused inquiry instead. Systems inquiry turns a painful moment into a unit improvement.":[940.312,12.87],"coach|Try next time. Topic 3: No one assigned to the family. You chose: Discussed every error. Try systems-focused inquiry instead. Systems inquiry turns a painful moment into a unit improvement.":[953.302,13.045],"coach|That is a complete, safe close.":[966.467,1.835],"coach|Strength. Summarize. Learner take-aways with commitments and SP de-roling. Learners own the summary, each commits to a behaviour, the SP is de-roled, and you offer support after a paediatric case.":[968.422,12.663],"coach|Try next time. Summarize. You chose: Take-aways without de-roling. Try learner take-aways with commitments and sp de-roling instead. Learners own the summary, each commits to a behaviour, the SP is de-roled, and you offer support after a paediatric case.":[981.205,16.53],"coach|Try next time. Summarize. You chose: No summary. Try learner take-aways with commitments and sp de-roling instead. Learners own the summary, each commits to a behaviour, the SP is de-roled, and you offer support after a paediatric case.":[997.856,15.807]}};

let actx = null;
function tone(freq, dur, { type='sine', gain=.08, at=0, slide=null } = {}){
  const t0 = actx.currentTime + at, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(gain, t0 + .01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + .02);
}
function sfx(kind, n=0){
  if(!store.sound) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    switch(kind){
      case 'click': tone(660,.05,{type:'triangle',gain:.05}); break;
      case 'type':  tone(1500+Math.random()*300,.012,{type:'square',gain:.008}); break;
      case 'best':  [523,659,784,1047].forEach((f,i)=>tone(f,.18,{type:'triangle',gain:.07,at:i*.07})); break;
      case 'good':  tone(440,.14,{type:'triangle',gain:.06}); tone(554,.2,{type:'triangle',gain:.06,at:.1}); break;
      case 'weak':  tone(196,.35,{type:'sawtooth',gain:.035,slide:110}); break;
      case 'combo': tone(700+n*120,.12,{type:'square',gain:.035}); tone(900+n*120,.12,{type:'square',gain:.035,at:.08}); break;
      case 'break': tone(300,.25,{type:'square',gain:.03,slide:120}); break;
      case 'beep':  tone(1050,.045,{type:'sine',gain:.03}); break;
      case 'alarm': tone(880,.12,{type:'square',gain:.025}); tone(880,.12,{type:'square',gain:.025,at:.2}); break;
      case 'whoosh':tone(180,.35,{type:'sawtooth',gain:.02,slide:900}); break;
      case 'star':  tone(784+n*200,.2,{type:'triangle',gain:.07}); break;
      case 'hint':  tone(988,.1,{type:'sine',gain:.05}); tone(1319,.25,{type:'sine',gain:.05,at:.08}); break;
      case 'level': [392,523,659,784,1047].forEach((f,i)=>tone(f,.25,{type:'triangle',gain:.07,at:i*.09})); break;
    }
  }catch(e){}
}

const VOICE = { ok: typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined', list: [] };
function loadVoices(){ try{ VOICE.list = speechSynthesis.getVoices().filter(v => /^en([-_]|$)/i.test(v.lang)); }catch(e){} }
if(VOICE.ok){ loadVoices(); try{ speechSynthesis.addEventListener('voiceschanged', loadVoices); }catch(e){} }
const FEM = /female|samantha|victoria|karen|moira|tessa|fiona|zira|susan|serena|allison|\bava\b|kate|libby|sonia|jenny|aria|natasha|hazel|emma|joanna|salli|kimberly|\bivy\b|\bamy\b|olivia|catherine|martha|nicky/i;
const CAST_F = new Set(['priya','leah','maya','helen','grace','sofia']);
function voiceFor(who, c){
  const L = VOICE.list; const fem = L.filter(v => FEM.test(v.name)), male = L.filter(v => !FEM.test(v.name));
  if(who === 'narr')  return { v: male[0] || L[0], pitch:.95, rate:1.03 };
  if(who === 'coach') return { v: fem[0] || L[0], pitch:1.05, rate:1.02 };
  if(who === 'you')   return { v: male[1] || male[0] || L[0], pitch:1, rate:1.02 };
  const team = c ? c.team : [], k = Math.max(0, team.findIndex(t => t.id === who));
  const isF = CAST_F.has(who) || ((team.find(t => t.id === who) || {}).v === 'f');
  const pool = (isF ? fem : male).length ? (isF ? fem : male) : L;
  return { v: pool.length ? pool[(k + 1) % pool.length] : null, pitch: isF ? 1.05 + (k % 3) * .07 : .82 + (k % 3) * .08, rate: .98 + (k % 2) * .06 };
}
let playToken = 0;
function stopSpeech(){ if(curSrc){ try{ curSrc.onended = null; curSrc.stop(); }catch(e){} curSrc = null; } if(VOICE.ok) try{ speechSynthesis.cancel(); }catch(e){} }
const wait = ms => new Promise(r => setTimeout(r, ms));
/* Recorded neural voices (Kokoro TTS, generated offline), played from per-case audio banks. */
const vclean = t => String(t).replace(/\([^)]*\)/g,' ').replace(/["“”]/g,'').replace(/\s+/g,' ').trim();
const BANKS = {}; let curSrc = null;
function bankFor(key){
  if(typeof VOICE_BANK === 'undefined') return null;
  const order = ['common', state.caseId].concat(Object.keys(VOICE_BANK));
  for(const b of order){ if(b && VOICE_BANK[b] && VOICE_BANK[b][key]) return b; }
  return null;
}
function audioCtx(){ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if(actx.state === 'suspended') actx.resume(); return actx; }
function loadBank(b){
  if(!b || typeof VOICE_BANK === 'undefined' || !VOICE_BANK[b]) return Promise.resolve(null);
  if(!BANKS[b]) BANKS[b] = fetch('voice-' + b + '.mp3').then(r => { if(!r.ok) throw 0; return r.arrayBuffer(); })
    .then(buf => new Promise((res, rej) => audioCtx().decodeAudioData(buf, res, rej))).catch(() => { BANKS[b] = null; return null; });
  return BANKS[b];
}
function preloadVoices(caseId){ if(!store.voice) return; try{ loadBank('common'); if(caseId) loadBank(caseId); }catch(e){} }
async function playRecorded(key){
  const b = bankFor(key); if(!b) return false;
  const buf = await Promise.race([loadBank(b), wait(6000).then(() => null)]);
  if(!buf) return false;
  const [st, du] = VOICE_BANK[b][key];
  return new Promise(res => {
    try{
      const ctx = audioCtx(), src = ctx.createBufferSource(), g = ctx.createGain();
      g.gain.value = 1; src.buffer = buf; src.connect(g).connect(ctx.destination);
      let done = false; const fin = () => { if(!done){ done = true; if(curSrc === src) curSrc = null; res(true); } };
      src.onended = fin; curSrc = src; src.start(0, st, du);
      setTimeout(fin, du * 1000 + 800);
    }catch(err){ res(false); }
  });
}
function speak(text, who, c){
  if(!store.voice) return Promise.resolve();
  const key = who + '|' + vclean(text);
  if(bankFor(key)) return playRecorded(key).then(ok => ok ? undefined : (typeof VOICE_BANK === 'undefined' ? ttsSpeak(text, who, c) : undefined));
  if(typeof VOICE_BANK !== 'undefined') return Promise.resolve();
  return ttsSpeak(text, who, c);
}
function ttsSpeak(text, who, c){
  if(!store.voice || !VOICE.ok) return Promise.resolve();
  const clean = String(text).replace(/\([^)]*\)/g, ' ').replace(/["“”]/g, '').replace(/\bmg\/kg\b/g, 'milligrams per kilo').replace(/\bmL\b/g, 'mils').replace(/\bIM\b/g, 'I M').replace(/\s+/g, ' ').trim();
  if(!clean) return Promise.resolve();
  return new Promise(res => {
    let done = false, started = false;
    const fin = () => { if(!done){ done = true; clearTimeout(to); clearTimeout(st); res(); } };
    const to = setTimeout(fin, 2500 + clean.length * 90);
    const st = setTimeout(() => { if(!started) fin(); }, 1500);
    try{
      const u = new SpeechSynthesisUtterance(clean), p = voiceFor(who, c);
      if(p.v){ u.voice = p.v; u.lang = p.v.lang; } else u.lang = 'en-US';
      u.pitch = p.pitch; u.rate = p.rate * (store.rate || 1);
      u.onstart = () => { started = true; }; u.onend = fin; u.onerror = fin;
      speechSynthesis.speak(u);
    }catch(e){ fin(); }
  });
}
async function speakStep(i, newPhase){
  if(!store.voice) return;
  const my = ++playToken, c = getCase(state.caseId), st = c.steps[i];
  if(!st || st.type !== 'choice' || state.picks[i]) return;
  stopSpeech();
  if(newPhase){ await speak(SAY.phase(phasesOf(c).findIndex(p => p[0] === st.phase), c), 'coach'); if(my !== playToken) return; await wait(250); }
  else await wait(reduced() ? 50 : 900);
  if(my !== playToken) return;
  if(st.challenge){ await speak(CHALLENGE[st.challenge], 'narr'); if(my !== playToken) return; }
  for(const [w,t] of (st.setup || [])){ await speak(t, w, c); if(my !== playToken) return; }
  await speak(st.prompt, 'narr');
}
async function readOptions(){
  const i = state.idx, c = getCase(state.caseId), st = c.steps[i]; if(st.type !== 'choice' || state.picks[i]) return;
  if(!store.voice){ store.voice = true; save(); renderTools(); }
  stopSpeech(); const my = ++playToken;
  for(const [n,id] of state.order[i].entries()){
    if(state.struck[i] === id) continue;
    const o = st.options.find(x => x.id === id);
    document.querySelectorAll('.opt.reading').forEach(b => b.classList.remove('reading'));
    const b = document.querySelector(`.opt[data-id="${id}"]`); if(b) b.classList.add('reading');
    await speak(`Option ${n+1}.`, 'narr', c); if(my !== playToken) break;
    await speak(o.text, 'you', c);

  }
  document.querySelectorAll('.opt.reading').forEach(b => b.classList.remove('reading'));
}

const FW = {
  pearls: { key:'pearls', name:'PEARLS', full:'Promoting Excellence And Reflective Learning in Simulation', phases:PHASES, report:PEARLS, modelLabel:'PEARLS model phrase',
    note:'Phases follow the PEARLS Healthcare Debriefing Tool (Bajaj et al., Acad Med 2018). Model phrases are paraphrased.' },
  gas: { key:'gas', name:'GAS', full:'Gather, Analyze, Summarize', phases:GAS_PHASES, report:GAS_REPORT, modelLabel:'GAS script phrase',
    note:'Phases follow the Gather, Analyze, Summarize debriefing model (WISER and the American Heart Association). Script phrases are paraphrased.' }
};
const fwOf = c => FW[(c && c.fw) || 'pearls'];
const phasesOf = c => fwOf(c).phases;
const fwCases = fw => CASES.filter(c => (c.fw || 'pearls') === fw);
const levelNo = c => fwCases(c.fw || 'pearls').indexOf(c) + 1;
const nextInFw = c => fwCases(c.fw || 'pearls')[levelNo(c)] || null;
const PGRADE = r => r >= .85 ? ['Strong','g-best'] : r >= .6 ? ['Workable','g-good'] : ['Needs work','g-weak'];
function stratFamily(st, o, fw){
  const s = o.strat.toLowerCase();
  if(st.challenge) return 'Human factors skill';
  if(/sp feedback|excluded the sp|sp an assessor|sp de-roling/.test(s)) return 'Simulated participant feedback';
  if(fw === 'gas'){
    if(/systems-focused/.test(s)) return 'Systems-focused inquiry';
    if(/circular/.test(s)) return 'Circular question';
    if(/guided team/.test(s)) return 'Guided team self-correction';
    if(/advocacy/.test(s)) return 'Advocacy-inquiry';
  }
  if(/directive|teaching|lecture|quiz/.test(s)) return 'Directive feedback';
  if(/self-assessment/.test(s)) return 'Learner self-assessment';
  if(/focused|advocacy|guided|circular/.test(s)) return 'Focused facilitation';
  return 'Other';
}
function pearlsReport(c, picks){
  const list = pickedList(c, picks), F = fwOf(c);
  return F.report.map(p => {
    const items = list.filter(x => x.st.phase === p.key);
    if(!items.length) return null;
    const got = items.reduce((a,x) => a + x.opt.s.reduce((q,v)=>q+v,0), 0), max = items.reduce((a,x) => a + x.best.s.reduce((q,v)=>q+v,0), 0);
    const ratio = got / max, g = PGRADE(ratio);
    const worst = items.slice().sort((a,b) => a.ratio - b.ratio)[0];
    const line = worst.opt.grade === 'best'
      ? { k:'s', tag:'Strength', title:worst.st.title, body:`${worst.opt.strat}. ${firstSentence(worst.opt.fb)}` }
      : { k:'i', tag:'Try next time', title:worst.st.title, body:`You chose: ${worst.opt.strat}. Try ${worst.best.strat.toLowerCase()} instead. ${firstSentence(worst.best.fb)}`, quote:worst.best.text };
    const moves = items.map(x => ({ title:x.st.title, used:stratFamily(x.st, x.opt, F.key), fit:stratFamily(x.st, x.best, F.key), ok:x.opt.grade === 'best', grade:x.opt.grade }));
    return { p, pct:Math.round(ratio*100), g, line, moves };
  }).filter(Boolean);
}
