/* Dev helper: every line the game can narrate, for generating recordings. */
function enumerateSpeech(){
  const out = [], add = (bank, who, text) => { if(text && vclean(text)) out.push({ bank, who, text: vclean(text) }); };
  PHASES.slice(0,6).forEach((p,k) => add('common','coach',SAY.phase(k, CASES[0])));
  GAS_PHASES.slice(0,5).forEach((p,k) => add('common','coach',SAY.phase(k, { fw:'gas' })));
  for(let o=0;o<=100;o++) add('common','coach',SAY.score(o));
  [95,80,65,10].forEach(o => add('common','coach',SAY.verdict(o)));
  BADGES.forEach(b => add('common','coach',SAY.badge(b.name)));
  RANKS.forEach(r => add('common','coach',SAY.rank(r[1])));
  add('common','coach',SAY.pearlsIntro({ fw:'pearls' })); add('common','coach',SAY.pearlsIntro({ fw:'gas' }));
  CASES.forEach(c => { if(c.unlock) add('common','coach',SAY.unlocked(c)); });
  if(typeof platformSpeech === 'function') platformSpeech(add);
  PEARLS.concat(GAS_REPORT).forEach(p => [['Strong'],['Workable'],['Needs work']].forEach(g => add('common','coach',SAY.pearlsPhase({ p, g }))));
  DIMS.forEach(d => add('common','coach',SAY.coach({ k:'t', tag:`Focus: ${d.name}`, body:d.tip })));
  add('common','coach',SAY.coach({ k:'t', tag:'Stretch', body:'Replay and pick a workable option on purpose. Watching how the room responds builds judgement for when the ideal move is not available.' }));
  for(const c of CASES){
    add(c.id,'coach',SAY.intro(c));
    c.steps.forEach((st,i) => {
      if(st.type === 'narrative'){ add(c.id,'coach',SAY.observed(st)); return; }
      add(c.id,'coach',SAY.instinct(st));
      const picks = {}; picks[i] = null;
      for(const o of st.options){
        add(c.id,'coach',SAY.why(o));
        const p = {}; p[i] = o.id;
        const list = pickedList(c, p)[0];
        if(o.grade === 'best') add(c.id,'coach',SAY.coach({ k:'s', tag:'Strength', title:st.title, body:`${o.strat}. ${firstSentence(o.fb)}` }));
        else add(c.id,'coach',SAY.coach({ k:'i', tag:'Try next time', title:st.title, body:`You chose: ${o.strat}. Try ${list.best.strat.toLowerCase()} instead. ${firstSentence(list.best.fb)}` }));
      }
    });
  }
  return out;
}

/* ---------- room mood (derived from picks, reproducible) ---------- */
function computeMoods(c, picks, uptoIdx){
  const mood = {}; c.team.forEach(t => mood[t.id] = 2);
  let last = {}, spoke = [], buffer = 0;
  for(let i=0; i<=uptoIdx && i<c.steps.length; i++){
    const st = c.steps[i];
    if(st.type === 'narrative'){ Object.entries(c.afterScenario||{}).forEach(([id,v]) => { mood[id] = clamp(v + buffer, 0, 4); }); continue; }
    if(!picks[i]) continue;
    const opt = st.options.find(o => o.id === picks[i]);
    const before = Object.assign({}, mood), ps = opt.s[0];
    if(st.phase === 'prebrief' && ps === 3) buffer = 1;
    const room = (opt.grade === 'best' && ps === 3) ? 1 : ps === 0 ? -1 : 0;
    const repliers = [...new Set((opt.reply||[]).map(r=>r[0]).filter(w => mood[w] !== undefined))];
    c.team.forEach(t => {
      let d = room;
      if(repliers.includes(t.id) && ps <= 1) d -= 1;
      if(repliers.includes(t.id) && opt.grade === 'best' && ps === 3 && mood[t.id] <= 1) d += 1;
      mood[t.id] = clamp(mood[t.id] + d, 0, 4);
    });
    last = {}; c.team.forEach(t => { if(mood[t.id] !== before[t.id]) last[t.id] = mood[t.id] - before[t.id]; });
    spoke = repliers;
  }
  return { mood, last, spoke };
}

/* ---------- scoring ---------- */
function computeScores(c, picks){
  const got=[0,0,0,0], max=[0,0,0,0]; let time=0, n=0;
  c.steps.forEach((st,i) => {
    if(st.type !== 'choice' || !picks[i]) return;
    const opt = st.options.find(o => o.id === picks[i]); n++;
    for(let d=0; d<4; d++){ got[d] += opt.s[d]; max[d] += Math.max(...st.options.map(o=>o.s[d])); }
    time += opt.t;
  });
  if(!n) return null;
  const pct = got.map((g,d) => Math.round(g / max[d] * 100));
  const over = Math.max(0, time - c.budget);
  pct[3] = Math.max(0, pct[3] - over*3);
  const s = { ps:pct[0], sf:pct[1], ld:pct[2], cl:pct[3] };
  return { s, o:Math.round((pct[0]+pct[1]+pct[2]+pct[3])/4), time, over };
}

function currentCombo(c, picks, upto){

    n = st.options.find(o=>o.id===picks[i]).grade === 'best' ? n+1 : 0; }

}
const runXp = () => Object.values(state.xp).reduce((a,x)=>a+x.xp, 0);

function pickedList(c, picks){
  return c.steps.map((st,i) => {
    if(st.type !== 'choice' || !picks[i]) return null;
    const opt = st.options.find(o => o.id === picks[i]);
    const sum = o => o.s.reduce((a,b)=>a+b,0);
    const best = st.options.slice().sort((a,b) => (b.grade==='best')-(a.grade==='best') || sum(b)-sum(a))[0];
    return { i, st, opt, best, ratio: sum(opt)/sum(best) };
  }).filter(Boolean);
}

/* ---------- coaching, badges, streak ---------- */
function buildCoaching(c, picks, res){
  const list = pickedList(c, picks);
  const out = [];
  const weight = p => (p.st.challenge ? 2 : 0) + (p.st.phase==='analysis' ? 1 : 0);
  list.filter(p => p.opt.grade==='best').sort((a,b)=>weight(b)-weight(a)).slice(0,2).forEach(p => {
    out.push({ k:'s', tag:'Strength', title:p.st.title, body:`${p.opt.strat}. ${firstSentence(p.opt.fb)}` });
  });
  list.filter(p => p.opt.grade!=='best').sort((a,b)=>a.ratio-b.ratio).slice(0,2).forEach(p => {
    out.push({ k:'i', tag:'Try next time', title:p.st.title,
      body:`You chose: ${p.opt.strat}. Try ${p.best.strat.toLowerCase()} instead. ${firstSentence(p.best.fb)}`, quote:p.best.text });
  });
  if(res.over > 0){
    const costly = list.slice().sort((a,b)=>b.opt.t-a.opt.t)[0];
    out.push({ k:'t', tag:'Debrief clock', title:`${res.over} min over budget`,
      body:`Your biggest time cost was "${costly.st.title}" at ${costly.opt.t} minutes. Running over cost ${res.over*3} points of load management.` });
  }
  const low = DIMS.slice().sort((a,b)=>res.s[a.k]-res.s[b.k])[0];
  if(out.length < 5 && res.s[low.k] < 95) out.push({ k:'t', tag:`Focus: ${low.name}`, title:`${res.s[low.k]} / 100`, body:low.tip });
  if(!list.some(p => p.opt.grade!=='best')) out.push({ k:'t', tag:'Stretch', title:'Every choice was the strongest option', body:'Replay and pick a workable option on purpose. Watching how the room responds builds judgement for when the ideal move is not available.' });
  return out.slice(0,5);
}
function awardBadges(c, picks, res){

  pickedList(c, picks).forEach(p => {
    if(p.opt.grade !== 'best') return;
    const t = p.opt.tags || [];
    if(t.includes('ai')) store.tally.ai++;
    if(t.includes('emotion')) store.tally.emotion++;
    if(t.includes('hierarchy') || t.includes('voice')) store.tally.hierarchy++;
    if(t.includes('peer')) store.tally.peer++;
    if(t.includes('lsum') && !store.lsumCases.includes(c.id)) store.lsumCases.push(c.id);
  });
  const psCases = Object.keys(store.history).filter(id => store.history[id].some(a => a.s.ps >= 85));
  if(psCases.length >= 2) give('psc');
  if(store.tally.ai >= 3) give('aie');
  if(c.intensity !== 'Low' && res.s.cl >= 85 && res.over === 0) give('clm');
  if(store.tally.emotion >= 4) give('emo');
  if(store.tally.hierarchy >= 3) give('flat');
  if(store.tally.peer >= 2) give('peer');
  if(store.lsumCases.length >= 2) give('sum');
  const at90 = fw => fwCases(fw).filter(x => (bestOverall(x.id) ?? 0) >= UNLOCK_AT).length;
  if(at90('pearls') >= fwCases('pearls').length) give('pm');
  if(at90('gas') >= fwCases('gas').length) give('gm');
  if(at90('pearls') && at90('gas')) give('bi');
  const h = store.history[c.id];
  if(h.length >= 2 && res.o - Math.min(...h.slice(0,-1).map(a=>a.o)) >= 10) give('dp');

}

let typeTimer = null;
async function runTypewriter(){
  stopSpeech();
  const my = ++playToken, c = getCase(state.caseId), i = state.anim;
  const els = [...document.querySelectorAll('[data-type]')];
  if(!els.length || (reduced() && !store.voice)){ finishTyping(); return; }
  els.forEach(el => { el.textContent = ''; el.closest('.line,.narr').hidden = true; });
  if(store.voice && i !== null){
    const o = c.steps[i].options.find(z => z.id === state.picks[i]);
    await speak(o.text, 'you', c); if(my !== playToken) return;
  }
  for(const el of els){
    const line = el.closest('.line,.narr');
    line.hidden = false; if(!reduced()) line.classList.add('fade');
    markSpeaking(line.dataset.who);
    const full = el.dataset.type;
    const sp = speak(full, line.dataset.who || 'narr', c);
    await typeInto(el, full, my);
    await sp;
    if(my !== playToken) return;
    await wait(store.voice ? 120 : 300);
    if(my !== playToken) return;
  }
  finishTyping();
}
function typeInto(el, full, my){
  return new Promise(res => {
    if(reduced()){ el.textContent = full; return res(); }
    let ch = 0; el.classList.add('typing');
    const t = () => {
      if(my !== playToken){ return res(); }
      ch++; el.textContent = full.slice(0, ch);
      if(ch % 3 === 0 && !store.voice) sfx('type');
      if(ch >= full.length){ el.classList.remove('typing'); res(); } else typeTimer = setTimeout(t, 15);
    };
    t();
  });
}
function markSpeaking(who){
  document.querySelectorAll('.seat.talking').forEach(s => s.classList.remove('talking'));
  if(who) document.querySelectorAll(`.seat[data-id="${who}"]`).forEach(s => s.classList.add('talking'));
}
function finishTyping(silent){
  clearTimeout(typeTimer); typeTimer = null; playToken++; stopSpeech();
  document.querySelectorAll('[data-type]').forEach(el => { el.textContent = el.dataset.type; el.classList.remove('typing'); el.removeAttribute('data-type'); const l = el.closest('.line,.narr'); if(l) l.hidden = false; });

/* ---------- simulation replay: animated patient monitor ---------- */
let sim = { raf:null, timer:null, ecg:null };
function stopSim(){ cancelAnimationFrame(sim.raf); clearTimeout(sim.timer); sim = { raf:null, timer:null, ecg:null }; }
function waveAt(rhythm, t, hr){
  const g = (x, m, w) => Math.exp(-Math.pow((x - m) / w, 2));
  if(rhythm === 'vf'){ const a = .7 + .3*Math.sin(t*1.3); return a*(.5*Math.sin(2*Math.PI*4.3*t) + .3*Math.sin(2*Math.PI*6.1*t + 1) + .2*Math.sin(2*Math.PI*2.7*t + 2)); }
  if(rhythm === 'asys') return .02*Math.sin(2*Math.PI*.3*t) + (Math.random()-.5)*.02;
  const rate = typeof hr === 'number' && hr > 0 ? hr : 60, f = (t * rate / 60) % 1;
  if(rhythm === 'wide') return 1.1*g(f,.3,.05) - .5*g(f,.4,.05) + .35*g(f,.62,.08);
  return .12*g(f,.12,.03) - .15*g(f,.22,.008) + 1*g(f,.25,.012) - .25*g(f,.28,.01) + .3*g(f,.5,.06);
}
function runEcg(canvas, getCur, live){
  const ctx = canvas.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W*dpr; canvas.height = H*dpr; ctx.scale(dpr, dpr);
  ctx.fillStyle = '#05090B'; ctx.fillRect(0,0,W,H);
  let x = 0, t = 0, prevY = H/2, last = performance.now(), lastBeat = 0;
  const step = now => {
    if(!canvas.isConnected) return;
    const dt = Math.min(.05, (now - last)/1000); last = now;
    const cur = getCur();
    const col = cur.rhythm === 'vf' || cur.rhythm === 'asys' || cur.rhythm === 'wide' ? '#FF7AA2' : '#3DDC84';
    const px = dt * 110;
    for(let s=0; s<px; s++){
      t += 1/110;
      const y = H/2 - waveAt(cur.rhythm, t, cur.hr) * H * .36;
      ctx.fillStyle = '#05090B'; ctx.fillRect(x+1, 0, 14, H);
      ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, prevY); ctx.lineTo(x+1, y); ctx.stroke();
      prevY = y; x++; if(x >= W){ x = 0; }
      if(live() && (cur.rhythm === 'sinus' || cur.rhythm === 'pea' || cur.rhythm === 'wide')){
        const rate = typeof cur.hr === 'number' && cur.hr > 0 ? cur.hr : 60, beat = Math.floor(t * rate / 60 - .25);
        if(beat !== lastBeat){ lastBeat = beat; sfx('beep'); }
      }
    }
    sim.raf = requestAnimationFrame(step);
  };
  sim.raf = requestAnimationFrame(step);
}
function monitorFill(m){
  const root = $('#pm'); if(!root || !m) return;
  const set = (k, v) => { const el = root.querySelector(`[data-v="${k}"]`); if(el && el.textContent !== String(v)){ el.textContent = v; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); } };
  set('hr', m.hr); set('bp', m.bp); set('spo2', m.spo2); set('rr', m.rr); set('temp', m.temp); set('t', m.t);
  root.querySelector('[data-v="label"]').textContent = m.label || (m.rhythm === 'sinus' ? 'Sinus rhythm' : m.rhythm);
  root.classList.toggle('alarm', !!m.alarm);
}
function startSim(i){
  stopSim();
  const c = getCase(state.caseId), st = c.steps[i], mon = st.monitor || [];
  const items = [...document.querySelectorAll(`#step-${i} .event`)];
  let shown = 0, cur = mon[0] || { rhythm:'sinus', hr:80 };
  stopSpeech(); const my = ++playToken;
  const canvas = $('#ecg');
  if(canvas && !reduced()) runEcg(canvas, () => cur, () => !state.simDone[i]);
  const reveal = () => {
    if(state.simDone[i] || !items[shown]){ return; }
    items[shown].hidden = false; items[shown].classList.add('fade');
    document.querySelectorAll(`#step-${i} .event.now`).forEach(e => e.classList.remove('now'));
    items[shown].classList.add('now');
    if(mon[shown]){ const wasAlarm = cur.alarm; cur = mon[shown]; monitorFill(cur); if(cur.alarm && !wasAlarm) sfx('alarm'); }
    const prog = $('#simprog'); if(prog) prog.style.width = ((shown+1)/items.length*100) + '%';
    const said = st.paras[shown];
    shown++;
    const nextStep = () => { if(state.simDone[i] || my !== playToken) return; if(shown >= items.length) sim.timer = setTimeout(() => simComplete(i), 700); else sim.timer = setTimeout(reveal, store.voice ? 350 : 2100); };
    if(store.voice) speak(said, 'narr', c).then(nextStep); else nextStep();
  };
  if(reduced()){ skipSim(); return; }
  if(store.voice) speak(SAY.phase(1), 'coach').then(() => { if(my === playToken && !state.simDone[i]) reveal(); });
  else reveal();
  sim.skip = () => { cur = mon[mon.length-1] || cur; };
}
function skipSim(){
  const i = state.idx, c = getCase(state.caseId), st = c.steps[i];
  clearTimeout(sim.timer); playToken++; stopSpeech();
  document.querySelectorAll(`#step-${i} .event`).forEach(e => { e.hidden = false; e.classList.remove('now'); });
  const mon = st.monitor || []; if(mon.length) monitorFill(mon[mon.length-1]);
  if(sim.skip) sim.skip();
  const prog = $('#simprog'); if(prog) prog.style.width = '100%';
  simComplete(i);
}
function simComplete(i){
  if(state.simDone[i]) return;
  state.simDone[i] = true; saveRun();
  const obs = $(`#step-${i} .observed`); if(obs) obs.hidden = false;
  document.querySelectorAll(`#step-${i} .simonly`).forEach(e => e.remove());
  const nx = $(`#step-${i} .next`); if(nx){ nx.classList.remove('pending'); const b = nx.querySelector('button'); if(b) b.focus({ preventScroll:true }); }
  scrollToEl(`#step-${i} .observed`, 'nearest');
  const st = getCase(state.caseId).steps[i]; sayAll([SAY.observed(st)]);
}

function viewPlay(){
  const c = getCase(state.caseId);
  const settledPicks = state.anim === null ? state.picks : Object.fromEntries(Object.entries(state.picks).filter(([k]) => +k !== state.anim));

    <div id="hudwrap">${hudHtml(c, hudM, computeScores(c, settledPicks), currentCombo(c, settledPicks, sideUpto))}</div>

      <p class="eyebrow" style="margin:14px 0 4px">Learning objectives</p>
      <ol class="objectives">${c.objectives.map(o=>`<li>${esc(o)}</li>`).join('')}</ol>
    </details>`;
  let lastPhase = null;
  for(let i=0; i<=state.idx; i++){
    const st = c.steps[i], fresh = i === state.idx;
    const moodsBefore = computeMoods(c, state.picks, i-1).mood;
    const moodsAfter = computeMoods(c, state.picks, i).mood;
    if(st.phase !== lastPhase){ html += `<div class="phase-mark"><span>${phasesOf(c).find(p=>p[0]===st.phase)[1]}</span></div>`; lastPhase = st.phase; }
    html += `<div id="step-${i}" class="log" style="scroll-margin-top:110px">`;
    if(st.type === 'narrative'){
      html += scenarioHtml(c, st, i);
      if(fresh) html += `<div class="next ${state.simDone[i]?'':'pending'}"><button class="btn primary" type="button" data-act="next">Walk into the debrief room</button></div>`;
      html += `</div>`; continue;
    }
    if(st.challenge) html += `<div class="hfbanner${fresh && !state.picks[i] ? ' fade shake' : ''}">${CHALLENGE[st.challenge]}</div>`;
    (st.setup||[]).forEach(([w,t]) => html += lineHtml(c, w, t, moodsBefore, { fresh: fresh && !state.picks[i] }));
    const pick = state.picks[i];
    if(!pick){
      if(store.hot && !state.deadline[i]) state.deadline[i] = Date.now() + HOT_SECONDS*1000;
      const C = (2*Math.PI*16).toFixed(1), hinted = state.hints[i], left = hintsLeft();
      html += `<section class="decision fade ${store.hot?'hot':''}">
        <div class="dhead"><div><p class="eyebrow">Your move · you are the facilitator</p><h3>${esc(st.title)}</h3></div>
          <button class="instbtn" type="button" data-act="instinct" ${hinted || left<=0 ? 'disabled' : ''} title="Instinct: hint plus one weak option removed, half XP">
            <span class="bulbs">${[0,1,2].map(k => bulbSvg(k < left)).join('')}</span><span>${hinted ? 'Instinct used' : left > 0 ? 'Use instinct' : 'No instincts left'}</span></button>
          ${(VOICE.ok || typeof VOICE_BANK !== 'undefined') ? `<button class="instbtn" type="button" data-act="readopts" title="Hear every option read aloud">${headSvg}<span>Read options</span></button>` : ''}</div>
        <p class="prompt">${esc(st.prompt)}</p>
        ${hinted ? `<div class="instinct" id="instinct"><b>Your instinct</b> ${esc(instinctText(st))}</div>` : ''}
        ${store.hot ? `<div class="hotseat" id="hotseat"><svg class="ring" viewBox="0 0 40 40"><circle class="bg" cx="20" cy="20" r="16"/><circle class="fg" cx="20" cy="20" r="16" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><div><b>${HOT_SECONDS}s</b><br><span>Answer in time for ×1.5 XP</span></div></div>` : ''}
        <div class="opts">${state.order[i].map((id,n) => { const o = st.options.find(x=>x.id===id), struck = state.struck[i] === id;
          return `<button class="opt ${struck?'struck':''}" type="button" data-act="pick" data-id="${o.id}" style="animation-delay:${.08+n*.07}s" ${struck?'disabled aria-disabled="true"':''}><kbd>${n+1}</kbd><span class="ot"><b class="gist">${esc(o.g || GISTS[c.id+'|'+i+'|'+o.id] || '')}</b><span class="q">${esc(o.text)}</span></span>${struck?'<em class="x">Instinct says no</em>':''}</button>`; }).join('')}</div>
        <p class="kbdhint">Keyboard: press 1 to ${state.order[i].length}. Press H for instinct.</p></section>`;
    } else {

      const mv = computeMoods(c, state.picks, i).last;
      const x = state.xp[i];
      html += lineHtml(c, 'you', o.text, null, { id:'you-'+i, fresh });

        </div></div>
        <div class="meters">${DIMS.map((d,k)=>`<span title="${d.name}: ${o.s[k]} of ${mx(k)}"><i style="color:${d.color}">${'●'.repeat(o.s[k])}<u>${'●'.repeat(Math.max(0,mx(k)-o.s[k]))}</u></i>${d.short}</span>`).join('')}<span class="mx">+${o.t} min${x?` · +${x.xp} XP${x.combo>=2?` · ×${comboMult(x.combo)}`:''}${x.fast?' · hot seat':''}${state.hints[i]?' · instinct':''}`:''}</span></div>

let lastSide = null;

  const lastStep = c.steps[upto];

  const prev = animate ? lastSide : null;
  lastSide = { s: r ? r.s : null, combo };
  const dv = k => { if(!prev || !prev.s || !r) return ''; const d = r.s[k] - prev.s[k]; return d ? `<span class="dv ${d>0?'up':'down'}">${d>0?'+':''}${d}</span>` : ''; };
  const broke = animate && prev && prev.combo >= 2 && combo === 0;
  return `<section class="room" aria-label="The debrief room">
      <div class="rh"><b>The room</b><span>learner mood</span></div>
      <div class="table">${c.team.map(t => { const d = animate ? (last[t.id]||0) : 0;
        return `<div class="seat ${showSpoke && spoke.includes(t.id)?'spoke':''} ${d>0?'hop':d<0?'shake':''}" data-id="${t.id}">
        ${d ? `<span class="emote ${d>0?'up':'down'}">${d>0?'▲':'▼'}</span>` : ''}${portrait(c, t.id, mood[t.id])}
        <span class="nm">${esc(t.name)}</span><span class="md m${mood[t.id]}">${MOODS[mood[t.id]]}</span><span class="pips p${mood[t.id]}"><i></i><i></i><i></i><i></i><i></i></span></div>`; }).join('')}</div>
    </section>
    <aside class="monitor" aria-label="Facilitator vitals">
      <div class="mh"><span><span class="dot"></span>Facilitator vitals</span><span>${Object.keys(picks).length} moves</span></div>
      <svg class="trace" viewBox="0 0 280 36" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="var(--v-ps)" stroke-width="2" points="0,20 40,20 48,20 54,8 60,30 66,20 110,20 118,20 124,6 130,32 136,20 180,20 188,20 194,8 200,30 206,20 250,20 258,20 264,6 270,32 276,20 280,20"/></svg>
      <div class="vitals">${DIMS.map(d => `<div class="vital ${dv(d.k)?'flash':''}"><div class="k" style="color:${d.color}">${d.short}</div><div class="v" style="color:${d.color}" data-from="${prev&&prev.s?prev.s[d.k]:''}" data-to="${r?r.s[d.k]:''}">${r ? r.s[d.k] : '--'}</div>${dv(d.k)}<div class="l">${d.name}</div></div>`).join('')}</div>
      <div class="combo ${animate && combo>=2 && (!prev || combo>prev.combo) ? 'burst':''} ${broke?'broken':''}"><span>COMBO <b>×${comboMult(combo)}</b></span><span>${broke ? 'Combo broken' : `${combo} strong in a row`}</span><span class="runxp">${xpNow} XP</span></div>
      <div class="clock ${r && r.over ? 'over':''}"><div class="row"><span>DEBRIEF CLOCK</span><span>${time} / ${c.budget} min</span></div><div class="bar"><b style="width:${pct}%"></b></div></div>
    </aside>`;
}
function refreshSide(animate){
  const s = $('#side'); if(!s || state.screen !== 'play') return;
  const c = getCase(state.caseId);
  s.innerHTML = sideHtml(c, animate);
  const settled = state.anim === null, upto = settled ? state.idx : state.idx-1;
  const hw = $('#hudwrap'); if(hw){ const { mood, last } = computeMoods(c, state.picks, upto); hw.innerHTML = hudHtml(c, mood, computeScores(c, state.picks), currentCombo(c, state.picks, upto));
    if(animate) Object.entries(last).forEach(([id,d]) => { const f = hw.querySelector(`.hf[data-id="${id}"]`); if(f) f.classList.add(d>0?'hop':'shake'); }); }
  if(animate && !reduced()){
    s.querySelectorAll('.v[data-from]').forEach(el => {
      const a = +el.dataset.from, b = +el.dataset.to; if(el.dataset.from === '' || isNaN(a) || a === b) return;
      const t0 = performance.now(); const stp = now => { const k = Math.min(1,(now-t0)/600); el.textContent = Math.round(a + (b-a)*k); if(k<1) requestAnimationFrame(stp); }; requestAnimationFrame(stp);
    });
  }
}

function sparkline(h){
  if(h.length < 2) return '';
  const w=300, ht=70, pad=10, n=h.length;
  const x = i => pad + i*(w-2*pad)/(n-1), y = v => ht-pad - v/100*(ht-2*pad);
  const pts = h.map((a,i)=>`${x(i).toFixed(1)},${y(a.o).toFixed(1)}`).join(' ');
  const last = h[n-1];
  return `<svg viewBox="0 0 ${w} ${ht}" width="100%" height="${ht}" role="img" aria-label="Overall score across ${n} runs, dashed line marks 3 stars" style="max-width:420px;display:block;margin-bottom:10px">
    <line x1="${pad}" x2="${w-pad}" y1="${y(85)}" y2="${y(85)}" stroke="var(--v-ld)" stroke-dasharray="3 4" opacity=".8"/>
    <polygon points="${pad},${ht-pad} ${pts} ${x(n-1)},${ht-pad}" fill="var(--accent-soft)"/>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${x(n-1)}" cy="${y(last.o)}" r="5" fill="var(--accent)"/></svg>`;
}

        <h3 style="margin-top:22px;font-size:20px">Your debrief, the ${fwOf(c).name} way</h3>

          <div class="ph"><span class="pn">${r.p.n}</span><div class="pt"><b>${esc(r.p.name)}</b><span>${esc(r.p.obj)}</span></div><span class="grade ${r.g[1]}">${r.g[0]}</span></div>

          <p class="pl"><span class="tag ${r.line.k}">${esc(r.line.tag)}</span> ${esc(r.line.body)}</p>
          ${r.line.quote ? `<q>${esc(r.line.quote)}</q>` : ''}

function afterResults(){
  const { res, newBadges, leveled } = state.lastResult;
  const st = starsFor(res.o);
  requestAnimationFrame(() => {
    const f = $('#xpfill'); if(f) setTimeout(() => f.style.width = f.dataset.to + '%', 300);
    document.querySelectorAll('.vbar b').forEach((b,k) => setTimeout(() => b.style.width = b.dataset.to + '%', 200 + k*120));
    const el = $('#countup');
    if(el && !reduced()){ const t0 = performance.now(), to = res.o;
      const step = now => { const k = Math.min(1, (now - t0)/900); el.textContent = Math.round(to * (1 - Math.pow(1-k,3))); if(k<1) requestAnimationFrame(step); };
      requestAnimationFrame(step); }
    for(let i=0;i<st;i++) setTimeout(() => sfx('star', i), 250*i + 100);
    if(leveled) setTimeout(() => sfx('level'), 900);
    if(st === 3 || newBadges.length || leveled) confetti();
    announce(`Level complete. Overall ${res.o}. ${st} stars.`);
    const lines = [SAY.verdict(res.o), SAY.score(res.o)];
    if(leveled) lines.push(SAY.rank(rankOf(store.xp).name));
    newBadges.forEach(id => lines.push(SAY.badge(BADGES.find(b => b.id === id).name)));
    if(state.lastResult.unlockedNext) lines.push(SAY.unlocked(state.lastResult.unlockedNext));
    lines.push(SAY.pearlsIntro(getCase(state.caseId)));
    pearlsReport(getCase(state.caseId), state.picks).forEach(r => { lines.push(SAY.pearlsPhase(r)); lines.push(SAY.coach(r.line)); });
    state.lastResult.coaching.filter(x => x.k === 't').forEach(x => lines.push(SAY.coach(x)));
    setTimeout(() => { if(state.screen === 'results') sayAll(lines); }, reduced() ? 50 : 1400);
  });
}

function confetti(){
  if(reduced()) return;
  const cv = $('#confetti'); cv.hidden = false;
  const ctx = cv.getContext('2d'), W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cols = ['#3DDC84','#4FD1E8','#F2C94C','#FF7AA2','#0B6E68'];
  const ps = Array.from({length:160}, () => ({ x:W/2 + (Math.random()-.5)*W*.3, y:H*.35, vx:(Math.random()-.5)*13, vy:-Math.random()*13-4, r:Math.random()*6+3, c:cols[Math.floor(Math.random()*5)], a:Math.random()*6 }));
  const t0 = performance.now();
  const frame = now => {
    ctx.clearRect(0,0,W,H);
    ps.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += .2; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); });
    if(now - t0 < 2800) requestAnimationFrame(frame); else { ctx.clearRect(0,0,W,H); cv.hidden = true; }
  };
  requestAnimationFrame(frame);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(!b){ if(state.anim !== null && e.target.closest('.log')) finishTyping(); return; }
  const a = b.dataset.act;
  if(a==='start') startCase(b.dataset.id);
  else if(a==='resume') resumeRun();
  else if(a==='home') goHome();
  else if(a==='pick') choose(b.dataset.id);
  else if(a==='next') advance();
  else if(a==='instinct') useInstinct();
  else if(a==='readopts') readOptions();
  else if(a==='tour') showTour(0);
  else if(a==='voice'){ store.voice = !store.voice; save(); renderTools(); if(!store.voice){ playToken++; stopSpeech(); } else speak('Voice on.', 'coach'); }
  else if(a==='sound'){ store.sound = !store.sound; save(); renderTools(); if(store.sound) sfx('click'); }
  else if(a==='reset'){ state.confirmReset = true; render(); }
  else if(a==='reset-no'){ state.confirmReset = false; render(); }
  else if(a==='reset-yes'){ const p = store.preview, s = store.sound; store = blankStore(); store.preview = p; store.sound = s; save(); state.confirmReset = false; render(); }
});
$('#homeBtn').addEventListener('click', goHome);
document.addEventListener('toggle', e => {
  const d = e.target; if(!(d instanceof HTMLElement) || !d.matches('details.why') || !d.open) return;
  const fb = d.closest('.fb'); if(!fb) return;
  const i = +fb.id.replace('fb-',''), c = getCase(state.caseId), o = c.steps[i].options.find(z => z.id === state.picks[i]);
  if(o) sayAll([SAY.why(o)]);
}, true);
document.addEventListener('change', e => {
  if(e.target.id === 'preview'){ store.preview = e.target.checked; save(); render(); }
  if(e.target.id === 'hot'){ store.hot = e.target.checked; save(); state.deadline = {}; if(state.anim === null) render(); }
});
document.addEventListener('keydown', e => {
  if($('.tour')) return;
  if(e.key === 'Escape'){ const ov = $('.overlay'); if(ov){ const b = ov.querySelector('#enterLab'); if(b) b.click(); return; } }
  if(state.screen !== 'play' || e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.target.matches && e.target.matches('input')) return;
  if($('.overlay:not(.out)')){ if(e.key === 'Enter'){ e.preventDefault(); $('#enterLab').click(); } return; }
  const c = getCase(state.caseId), st = c.steps[state.idx];
  if(state.anim !== null && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); finishTyping(); return; }
  if(st.type === 'choice' && !state.picks[state.idx]){
    if(/^[1-4]$/.test(e.key)){ const id = state.order[state.idx][+e.key - 1]; if(id){ e.preventDefault(); choose(id); } }
    else if(e.key === 'h' || e.key === 'H'){ e.preventDefault(); useInstinct(); }
  } else if(e.key === 'Enter' && !e.target.closest('button')){ e.preventDefault(); advance(); }
});

/* ---------- boot, keeping an in-progress case across page updates ---------- */
/* boot lives in platform.js */
</script>

</style>
<script>
/* ==========================================================================
   PLATFORM LAYER
   - Accounts: register / log in (per browser, password hashed with PBKDF2),
     or a demo that plays Level 1 of each framework and saves nothing.
   - Frameworks: PEARLS or GAS, each with an intro and its own 3 levels.
     Score 90+ on a level to unlock the next one.
   - Strategy Sprint: timed drill matching a moment to the best strategy.
   - Results: a signed JSON file students send to their instructor, which also
     restores progress on another device. The owner sees a dashboard link.
   ========================================================================== */
const ACC_KEY = 'debriefer.accounts', SES_KEY = 'debriefer.session', PREF_KEY = 'debriefer.prefs', UKEY = id => 'debriefer.u.' + id;
const RESULT_SALT = 'debriefer-results-v2';
const DASHBOARD_URL = 'https://claude.ai/artifact/E2jTezV9Q8pqtFXUcFfEUT';
let session = null;            // { mode:'demo' } or { mode:'user', id, name, email, cohort }
let ownerView = false, dlCap = null;
const isDemo = () => !session || session.mode === 'demo';
const lsGet = k => { try{ return JSON.parse(localStorage.getItem(k) || 'null'); }catch(e){ return null; } };
const lsSet = (k, v) => { try{ if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } };

function persistStore(){
  const pr = {}; ['sound','voice','rate','seenTour','hot'].forEach(k => pr[k] = store[k]);
  lsSet(PREF_KEY, pr);
  if(session && session.mode === 'user') lsSet(UKEY(session.id), store);
}
const accounts = () => lsGet(ACC_KEY) || { users:{} };
const enc = s => new TextEncoder().encode(s);
const hex = buf => [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2,'0')).join('');
function fnv(str){ let h = 0x811c9dc5; for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h>>>0).toString(16).padStart(8,'0'); }
async function sha256(str){ try{ return hex(await crypto.subtle.digest('SHA-256', enc(str))); }catch(e){ return fnv(str) + fnv(str.split('').reverse().join('')); } }
async function hashPw(pw, salt){
  try{ const key = await crypto.subtle.importKey('raw', enc(pw), 'PBKDF2', false, ['deriveBits']);
    return hex(await crypto.subtle.deriveBits({ name:'PBKDF2', salt:enc(salt), iterations:120000, hash:'SHA-256' }, key, 256)); }
  catch(e){ return sha256(salt + '|' + pw); }
}
const idFor = async email => 'u' + (await sha256(email.trim().toLowerCase())).slice(0, 16);
const initials = n => String(n || '?').trim().split(/\s+/).map(w => w[0]).slice(0,2).join('').toUpperCase();

function enterUser(acc){
  session = { mode:'user', id:acc.id, name:acc.name, email:acc.email, cohort:acc.cohort || '' };
  lsSet(SES_KEY, { id:acc.id });
  const prefs = load();
  store = Object.assign(blankStore(), lsGet(UKEY(acc.id)) || {});
  ['sound','voice','rate','seenTour','hot'].forEach(k => store[k] = prefs[k]);
  state = freshRun(); state.screen = homeScreen();
}
function enterDemo(){
  session = { mode:'demo' };
  const prefs = load(); store = Object.assign(blankStore(), prefs);
  state = freshRun(); state.screen = 'fw';
}
function logout(){
  clearFx(); persistStore(); session = null; lsSet(SES_KEY, null);
  store = load(); state = freshRun(); state.screen = 'auth'; state.authTab = 'start'; render(); window.scrollTo({ top:0 });
}
function homeScreen(){ return !session ? 'auth' : (!store.fw ? 'fw' : 'home'); }

async function doRegister(f){
  const name = f.name.value.trim(), email = f.email.value.trim(), cohort = f.cohort.value.trim(), pw = f.pw.value, pw2 = f.pw2.value;
  if(name.length < 2) return authError('Please enter your full name.');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return authError('Please enter a valid email address. Your instructor uses it to match your results.');
  if(pw.length < 6) return authError('Choose a password with at least 6 characters.');
  if(pw !== pw2) return authError('The two passwords do not match.');
  const id = await idFor(email), A = accounts();
  if(A.users[id]) return authError('An account with this email already exists in this browser. Log in instead.');
  const salt = hex(crypto.getRandomValues(new Uint8Array(16)));
  A.users[id] = { id, name, email, cohort, salt, hash: await hashPw(pw, salt), created:new Date().toISOString() };
  if(!lsSet(ACC_KEY, A)) return authError('This browser is blocking storage, so an account cannot be saved here. Try the demo, or open the game in a normal (not private) window.');
  enterUser(A.users[id]); sfx('level'); render(); window.scrollTo({ top:0 });
  toast(`Welcome, ${name.split(' ')[0]}. Your account is ready.`);
  sayAll([PSAY.welcomeNew]);
}
async function doLogin(f){
  const email = f.email.value.trim(), pw = f.pw.value;
  const id = await idFor(email), acc = accounts().users[id];
  if(!acc || acc.hash !== await hashPw(pw, acc.salt)) return authError('That email and password do not match an account in this browser. Accounts are saved per browser: if you registered on another device, create an account here and import your results file.');
  enterUser(acc); sfx('click'); render(); window.scrollTo({ top:0 });
  toast(`Welcome back, ${acc.name.split(' ')[0]}.`);
}
function authError(msg){ const e = $('#authErr'); if(e){ e.textContent = msg; e.hidden = false; } sfx('weak'); return false; }

/* ---------- narration for platform screens (Coach Nadia) ---------- */
const PSAY = {
  hello: `Hi, I'm Coach Nadia. In this game you practise running a debrief after a simulation. Try the demo, or create an account to unlock every level.`,
  welcomeNew: `Welcome aboard. First, choose your debriefing framework.`,
  choose: `Choose your debriefing framework. PEARLS blends three analysis strategies across five phases. GAS gives you three clear phases: gather, analyze, and summarize. You can switch at any time.`,
  p1: `PEARLS stands for Promoting Excellence And Reflective Learning in Simulation. Watch the short video, then read the five phases.`,
  p2: `Five phases: setting the scene, reactions, description, analysis, and application. In analysis you choose one of three strategies: learner self-assessment, focused facilitation, or directive feedback.`,
  p3: `Match the strategy to the gap and to the time you have. Score ninety or more on a level to unlock the next one. Ready? Let's play.`,
  g1: `GAS stands for Gather, Analyze, Summarize. It was developed by WISER with the American Heart Association, and it is used in PALS and ACLS courses.`,
  g2: `Gather. Listen first. Hear how people feel, then get a short, shared account of what happened. Don't teach yet.`,
  g3: `Analyze. Take one topic at a time. Say what you saw and why it matters, invite their view, listen, then close the gap with the strategy that fits.`,
  g4: `Summarize. Learners state their own take-aways and one thing they will do differently. Then signal the end.`,
  g5: `Match the strategy to the gap. If they can see it, let them self-assess. If their thinking is unclear, use advocacy-inquiry. For a knowledge gap, teach, after you have heard them. Several views? Ask a circular question. A system problem? Explore the system.`,
  g6: `Watch for five traps: a minute-by-minute replay, a senior defining the story, lecturing, an accusatory why, and trying to cover every error.`,
  g7: `A twenty minute debrief is about one minute to open, five to gather, ten to analyze two topics, and five to summarize. Score ninety or more to unlock the next level. Ready? Let's play.`,
  sprintIntro: `Strategy Sprint. Ten moments from real debriefs. Match each one to the strategy that fits best. Be quick for bonus points. Go!`,
  sprintEnd: n => `You matched ${n} out of 10.`,
  sent: `Your results file is ready. Send it to your instructor.`,
  demoLocked: `That one is for registered players. Create a free account to unlock it.`
};

/* ---------- Strategy Sprint drill ---------- */
const STRATS = [
  { k:'sa',   name:'Self-assessment', sub:'or guided team self-correction' },
  { k:'ai',   name:'Advocacy-inquiry', sub:'I saw, I think, how did you see it?' },
  { k:'dir',  name:'Directive teaching', sub:'after hearing their view' },
  { k:'circ', name:'Circular question', sub:'ask one person about others' },
  { k:'sys',  name:'Systems inquiry', sub:'explore the process, not the person' }
];
const DRILL = [
  { cue:`"I know exactly what I did wrong. I should have called for help at minute 2, not minute 8."`, a:'sa', why:`The learner already sees the gap, so let them lead with self-assessment.` },
  { cue:`A resident gave an adult dose to a child. You have no idea what they were thinking.`, a:'ai', why:`The reasoning is hidden. Advocacy-inquiry brings the frame behind the action into the open.` },
  { cue:`"What's the dose of adenosine for SVT? I've honestly never known."`, a:'dir', why:`A clear knowledge gap, and they have told you so. Teach it.` },
  { cue:`The doctor and the nurse remember the handover completely differently.`, a:'circ', why:`Several perspectives on one moment. A circular question lowers the heat and shows the pattern.` },
  { cue:`The defibrillator pads were in a different drawer from the one on the checklist.`, a:'sys', why:`A system problem, not a person problem. Explore the process and capture a fix.` },
  { cue:`"We all agree the airway plan fell apart, and we can see where."`, a:'sa', why:`The team sees the gap together. Guided team self-correction lets them build the fix.` },
  { cue:`A nurse held the syringe for 30 seconds before giving the drug. You can't tell why.`, a:'ai', why:`You saw the action but not the thinking. Share what you saw and ask how they saw it.` },
  { cue:`Nobody knew where the massive transfusion form was kept.`, a:'sys', why:`A latent safety threat in the system. Map it with the team and hand it on.` },
  { cue:`"I thought fluids come first in anaphylaxis, then adrenaline."`, a:'dir', why:`A stated knowledge gap with a clear right answer. Teach it briefly, with the reason.` },
  { cue:`The RT felt ignored. The lead says nobody told him. Each is sure they're right.`, a:'circ', why:`Two stories in tension. Ask a third person what they noticed.` },
  { cue:`"I'd do three things differently, and I can tell you what they are."`, a:'sa', why:`They can see the gaps. Let them self-assess, then add what's missing.` },
  { cue:`"Is it 15 compressions to 2 breaths for two-rescuer infant CPR?"`, a:'dir', why:`A factual question with a clear answer: yes, 15 to 2. Teach it.` },
  { cue:`Three learners each think a different person was leading.`, a:'circ', why:`Multiple views of the same team. Circular questions surface how roles were seen.` },
  { cue:`The student noticed the rash but didn't mention it, and you're not sure why.`, a:'ai', why:`The reason for staying silent is hidden. Stay curious and ask.` },
  { cue:`The infusion pump defaulted to an adult rate, and it happened on every run today.`, a:'sys', why:`Every team hit the same trap. Explore the system that set it.` },
  { cue:`"I forgot to check the glucose, and I know why: I anchored on stroke."`, a:'sa', why:`They named the gap and their reasoning. Self-assessment lets them own the fix.` }
];
const SPRINT_ROUNDS = 10, SPRINT_SECONDS = 15;
let drillTimer = null;
function startSprint(){
  if(isDemo()){ toast('Strategy Sprint is for registered players. Create a free account to unlock it.'); sayAll([PSAY.demoLocked]); return; }
  clearFx(); clearInterval(drillTimer);
  state = Object.assign(freshRun(), { screen:'drill', drill:{ items:shuffle(DRILL).slice(0, SPRINT_ROUNDS), i:0, ans:[], t0:Date.now(), score:0, streak:0, locked:false, done:false } });
  render(); window.scrollTo({ top:0 });
  loadBank('platform');
  sayAll([PSAY.sprintIntro]).then(() => { if(state.screen === 'drill' && state.drill.i === 0 && !state.drill.locked) readCue(); });
  armTimer();
}
function readCue(){ const d = state.drill; if(!d || d.done) return; const it = d.items[d.i]; sayAll([it.cue]); }
function armTimer(){
  clearInterval(drillTimer);
  const d = state.drill; d.t0 = Date.now(); d.locked = false;
  drillTimer = setInterval(() => {
    if(state.screen !== 'drill' || !state.drill || state.drill.locked){ return; }
    const left = SPRINT_SECONDS - (Date.now() - state.drill.t0)/1000, bar = $('#dtimer');
    if(bar){ bar.firstElementChild.style.width = Math.max(0, left/SPRINT_SECONDS*100) + '%'; bar.classList.toggle('low', left < 5); }
    const lb = $('#dleft'); if(lb) lb.textContent = Math.max(0, Math.ceil(left)) + 's';
    if(left <= 0) answerSprint(null);
  }, 200);
}
function answerSprint(k){
  const d = state.drill; if(!d || d.locked || d.done) return;
  d.locked = true; clearInterval(drillTimer);
  const it = d.items[d.i], secs = (Date.now() - d.t0)/1000, ok = k === it.a;
  d.streak = ok ? d.streak + 1 : 0;
  const pts = ok ? Math.round((50 + Math.max(0, SPRINT_SECONDS - secs) * 5) * (d.streak >= 3 ? 1.5 : 1)) : 0;
  d.score += pts; d.ans.push({ k, ok, pts });
  sfx(ok ? 'best' : 'weak');
  render();
  playToken++; stopSpeech();
  sayAll([it.why]);
}
function nextSprint(){
  const d = state.drill; if(!d) return;
  if(d.i >= d.items.length - 1){ finishSprint(); return; }
  d.i++; sfx('click'); render(); armTimer(); playToken++; stopSpeech(); readCue();
}
function finishSprint(){
  const d = state.drill; d.done = true; clearInterval(drillTimer);
  const n = d.ans.filter(a => a.ok).length;
  const prevBest = Math.max(0, ...(store.drills || []).map(x => x.n));
  (store.drills = store.drills || []).push({ d:new Date().toISOString(), n, of:d.items.length, score:d.score });
  store.xp += d.score; bumpStreak();
  d.newBadge = null;
  if(n >= 8 && !store.badges.spr){ store.badges.spr = new Date().toISOString(); d.newBadge = 'spr'; }
  d.best = n > prevBest; save();
  render(); if(n >= 8) confetti(); sfx(n >= 8 ? 'level' : 'star');
  const lines = [PSAY.sprintEnd(n)]; if(d.newBadge) lines.push(SAY.badge('Strategy Sprinter')); sayAll(lines);
}
function viewDrill(){
  const d = state.drill;
  const pips = d.items.map((_, j) => `<i class="${j < d.ans.length ? (d.ans[j].ok ? 'ok' : 'no') : j === d.i ? 'now' : ''}"></i>`).join('');
  if(d.done){
    const n = d.ans.filter(a => a.ok).length;
    return `<section class="drill fade"><div class="dcard dend">
      <p class="eyebrow">Strategy Sprint complete</p><div class="big">${n}/${d.items.length}</div>
      <p class="muted">${n >= 8 ? 'Sharp matching. You read the gap before you reach for a tool.' : n >= 5 ? 'Good instincts. Review the ones you missed and go again.' : 'Keep practising. Start by asking: can they see the gap, or is their thinking hidden?'}</p>
      <p><b>+${d.score} XP</b>${d.best ? ' · new best' : ''}${d.newBadge ? ' · badge earned: Strategy Sprinter' : ''}</p>
      <div class="dtop" style="justify-content:center"><div class="pips">${pips}</div></div>
      <div class="actions" style="justify-content:center"><button class="btn primary big" type="button" data-act="sprint">Sprint again</button><button class="btn big" type="button" data-act="home">Level map</button></div>
    </div></section>`;
  }
  const it = d.items[d.i], a = d.ans[d.i], left = SPRINT_SECONDS - (Date.now() - d.t0)/1000;
  return `<section class="drill">
    <div class="dtop"><div><p class="eyebrow">Strategy Sprint · moment ${d.i+1} of ${d.items.length}</p><div class="pips">${pips}</div></div>
      <div class="dscore">${d.score} pts${d.streak >= 3 ? ' · streak ×1.5' : ''}</div></div>
    <div class="dcard" id="dcard">
      ${a ? '' : `<div class="dtimer" id="dtimer"><b style="width:${Math.max(0,left/SPRINT_SECONDS*100)}%"></b></div>`}
      <p class="eyebrow">What fits this moment? ${a ? '' : `<span id="dleft">${Math.ceil(Math.max(0,left))}s</span>`}</p>
      <p class="cue">${esc(it.cue)}</p>
      <div class="dopts">${STRATS.map((s, j) => {
        const cls = a ? (s.k === it.a ? 'right' : (a.k === s.k ? 'wrong' : '')) : '';
        return `<button type="button" data-act="sans" data-k="${s.k}" class="${cls}" ${a ? 'disabled' : ''}><kbd>${j+1}</kbd><span>${esc(s.name)}<br><small class="muted" style="font-weight:400">${esc(s.sub)}</small></span></button>`; }).join('')}</div>
      ${a ? `<div class="dwhy fade"><b>${a.ok ? `Correct · +${a.pts}` : a.k ? 'Not quite' : 'Time is up'}</b>${esc(it.why)}</div>
        <div class="next"><button class="btn primary" type="button" data-act="snext" id="snext">${d.i >= d.items.length-1 ? 'See my score' : 'Next moment'}</button></div>` : ''}
    </div></section>`;
}

/* ---------- results file (to instructor, and to restore on another device) ---------- */
async function buildResults(){
  const hist = {};
  CASES.forEach(c => { const h = store.history[c.id]; if(h && h.length) hist[c.id] = h; });
  const payload = {
    kind:'debriefer-results', v:2, app:'The Debriefer Game', exported:new Date().toISOString(),
    student:{ id:session.id, name:session.name, email:session.email, cohort:session.cohort || '' },
    xp:store.xp, rank:rankOf(store.xp).name, streak:liveStreak(), badges:Object.keys(store.badges),
    cases:Object.fromEntries(CASES.map(c => [c.id, { fw:c.fw || 'pearls', level:levelNo(c), title:c.title, intensity:c.intensity }])),
    history:hist, drills:store.drills || [], fw:store.fw
  };
  payload.sig = await sha256(JSON.stringify(payload) + RESULT_SALT);
  return payload;
}
async function sendResults(){
  if(isDemo()){ toast('Create an account to save and send your results.'); return; }
  const data = JSON.stringify(await buildResults(), null, 1);
  const safe = session.name.replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'student';
  const filename = `debriefer-results-${safe}-${new Date().toISOString().slice(0,10)}.json`;
  try{
    dlCap = dlCap || (window.claude && window.claude.use ? await window.claude.use('downloads') : null);
    if(dlCap){ await dlCap.save({ filename, data }); toast('Results saved. Email or upload this file to your instructor.'); sayAll([PSAY.sent]); return; }
  }catch(e){
    if(e && e.code === 'declined') return;
    if(e && e.code === 'rate_limited'){ toast('A save prompt is already open.'); return; }
  }
  if(!window.claude){
    try{ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type:'application/json' })); a.download = filename;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);

function importProgress(file){
  const rd = new FileReader();
  rd.onload = async () => {
    let r; try{ r = JSON.parse(rd.result); }catch(e){ toast('That file is not a Debriefer results file.'); return; }
    if(!r || r.kind !== 'debriefer-results' || !r.student){ toast('That file is not a Debriefer results file.'); return; }
    if(String(r.student.email).toLowerCase() !== String(session.email).toLowerCase()){ toast(`That file belongs to ${r.student.name || 'another student'}. Log in with the same email to import it.`); return; }
    const { sig, ...rest } = r;
    if(sig !== await sha256(JSON.stringify(rest) + RESULT_SALT)){ toast('This file was edited after it was saved, so it cannot be imported.'); return; }
    let added = 0;
    Object.entries(r.history || {}).forEach(([id, runs]) => {
      if(!getCase(id)) return;
      const h = store.history[id] = store.history[id] || [];
      runs.forEach(a => { if(!h.some(x => x.d === a.d)){ h.push(a); added++; } });
      h.sort((x, y) => x.d < y.d ? -1 : 1);
    });
    (r.drills || []).forEach(x => { store.drills = store.drills || []; if(!store.drills.some(y => y.d === x.d)) store.drills.push(x); });
    (r.badges || []).forEach(b => { if(!store.badges[b]) store.badges[b] = r.exported; });
    store.xp = Math.max(store.xp, r.xp || 0);
    if(!store.fw && r.fw) store.fw = r.fw;
    save(); render(); toast(added ? `Imported ${added} run${added > 1 ? 's' : ''}. Your progress is up to date.` : 'Nothing new in that file. Your progress is up to date.');
  };
  rd.readAsText(file);
}

  if(my === playToken) document.querySelectorAll('[data-g],.phrow').forEach(e => e.classList.remove('lit'));
}

function levelTrack(fw){
  const L = fwCases(fw);
  return `<div class="track fwc-${fw}">${L.map((c,k) => {
    const open = isUnlocked(c), best = bestOverall(c.id), done = (best ?? 0) >= UNLOCK_AT;
    const node = `<div class="node ${done ? 'done' : open ? 'open' : ''}"><span class="dot">${open ? k+1 : lockSvg}</span><small>${esc(c.title)}</small>${starsRow(starsFor(best))}</div>`;
    const gate = k < L.length-1 ? `<div class="gate ${done ? 'pass' : ''}"><span>${done ? 'unlocked' : isDemo() ? 'register' : UNLOCK_AT + '%'}</span><span class="ln"></span></div>` : '';
    return node + gate;
  }).join('')}</div>`;
}
function profileHtml(){
  const r = rankOf(store.xp), pct = r.to ? (store.xp - r.from)/(r.to - r.from)*100 : 100;
  const totalStars = CASES.reduce((a,c)=>a+starsFor(bestOverall(c.id)),0);
  return `<div class="profile">
    <div class="who2">${isDemo() ? `<span><b>Demo player</b> · nothing is saved</span>` : `<span><b>${esc(session.name)}</b>${session.cohort ? ` · ${esc(session.cohort)}` : ''}</span>`}</div>
    <div class="rank"><div class="lv">${r.i+1}</div><div><b>${r.name}</b><span>${store.xp.toLocaleString()} XP${r.to ? ` · ${(r.to - store.xp).toLocaleString()} to ${RANKS[r.i+1][1]}` : ' · top rank'}</span></div></div>
    <div class="xpbar"><b style="width:${pct}%"></b></div>
    <div class="stats3">
      <div>${flameSvg}<div><b>${liveStreak()}</b><br><span>day streak</span></div></div>
      <div>${starIcon}<div><b>${totalStars}/${CASES.length*3}</b><br><span>stars</span></div></div>
      <div>${badgeIcon}<div><b>${Object.keys(store.badges).length}/${BADGES.length}</b><br><span>badges</span></div></div>
    </div>
    ${isDemo() ? '' : `<div class="acts2"><button class="btn primary" type="button" data-act="send">Send results to instructor</button><label class="btn" style="cursor:pointer">Import progress<input type="file" accept=".json,application/json" id="importFile" hidden></label></div>`}
  </div>`;
}

function viewHome(){
  const fw = store.fw || 'pearls', F = FW[fw], L = fwCases(fw);
  const run = store.run && getCase(store.run.caseId) ? store.run : null;
  const nextUp = L.find(c => isUnlocked(c) && (bestOverall(c.id) ?? 0) < UNLOCK_AT) || L.find(c => isUnlocked(c) && starsFor(bestOverall(c.id)) < 3) || L[0];
  const runCase = run ? getCase(run.caseId) : null;
  const cta = run
    ? `<button class="btn primary big" type="button" data-act="resume">Resume: ${esc(runCase.title)} · step ${run.idx+1} of ${runCase.steps.length}</button>
       <button class="btn big" type="button" data-act="start" data-id="${nextUp.id}">New run: ${esc(nextUp.title)}</button>`
    : `<button class="btn primary big" type="button" data-act="start" data-id="${nextUp.id}">${(store.history[nextUp.id]||[]).length ? 'Continue' : 'Start'}: ${esc(nextUp.title)}</button>`;
  const cards = L.map((c,n) => {
    const open = isUnlocked(c), best = bestOverall(c.id), cnt = (store.history[c.id]||[]).length;
    const req = c.unlock ? getCase(c.unlock.after) : null;
    return `<article class="case ${open?'':'locked'}" style="animation-delay:${n*.08}s">
      <div class="top"><span class="levelno">${F.name} · LEVEL ${n+1}</span>${starsRow(starsFor(best))}</div>
      <div class="caseteam">${c.team.map(t => portrait(c, t.id, 2)).join('')}</div>
      <h3>${esc(c.title)}</h3>
      <p class="topic">${esc(c.topic)}</p>
      <dl><dt>Intensity</dt><dd><span class="pill int-${c.intensity}">${c.intensity}</span></dd><dt>Team</dt><dd>${c.team.filter(t => !/simulated participant/i.test(t.role)).length} learners${c.team.some(t => /simulated participant/i.test(t.role)) ? ' + 1 SP' : ''}, ${esc(c.level.toLowerCase())}</dd><dt>Clock</dt><dd>${c.budget} minute debrief</dd></dl>
      <div class="foot">
        ${open ? `<span class="best">${best!==null ? `Best ${best} · ${cnt} run${cnt>1?'s':''}` : 'New'}</span>
          <button class="btn primary" type="button" data-act="start" data-id="${c.id}">${cnt ? 'Replay' : 'Play'}</button>`
        : isDemo() ? `<button class="btn" type="button" data-act="auth" data-tab="register">${lockSvg}Register to unlock</button>`
        : `<span class="lockmsg">${lockSvg}Score ${c.unlock.min}+ on ${esc(req.title)} to unlock.</span>`}
      </div></article>`;
  }).join('');
  const badges = BADGES.map(b => `<div class="badge ${store.badges[b.id]?'on':''}"><div class="seal">${b.seal}</div><div><b>${esc(b.name)}</b><span>${esc(b.how)}</span></div></div>`).join('');
  const dr = store.drills || [], bestN = dr.length ? Math.max(...dr.map(x => x.n)) : null;
  const pocket = fw === 'gas'
    ? [['Open','Opening','Purpose: learning and improvement, not blame. The basic assumption. Confidentiality and the plan.'],['G','Gather','Reactions, then a short, shared account. Hear each person\'s key problem. Do not teach yet.'],['A','Analyze','One topic at a time: what you saw, your concern, their view, then the strategy that fits.'],['S','Summarize','Learners state take-aways and one commitment. You add what is missing and signal the end.'],['Traps','Avoid','Minute-by-minute replay, the senior defining the story, lecturing, "why did you", covering every error.']]
    : [['Phase 1','Setting the scene','State the goal and the basic assumption: everyone here is capable and wants to improve.'],['Phase 2','Reactions','Invite feelings first. Unspoken emotion blocks reflection later.'],['Phase 3','Description','A short, learner-led summary and a check that everyone agrees on the diagnosis.'],['Phase 4','Analysis','Self-assessment, focused facilitation (advocacy-inquiry), or directive feedback, matched to the gap.'],['Phase 5','Application','Each learner names one take-away and one change for real practice.']];
  return `<div class="fwc-${fw}">${isDemo() ? `<div class="demo-banner"><span>Demo mode: play Level 1 of PEARLS and GAS. Nothing is saved.</span><button class="btn" type="button" data-act="auth" data-tab="register">Create a free account</button></div>` : ''}
    <section class="hero fade fwc-${fw}">
      <div><p style="margin:0 0 10px">${acroHtml(fw,'sm')}</p>
        <h1>${fw === 'gas' ? 'Gather. Analyze.<br><em>Summarize.</em>' : 'You run the <em>debrief.</em><br>The room responds.'}</h1>
        <p>${fw === 'gas' ? 'You are the facilitator, using the GAS model. Listen first, close the gaps with the right strategy, and send learners out with a plan.' : 'You are the facilitator. The team just finished a simulation. Pick what to say, hear how they react, and let Coach Nadia score every move.'}</p>
        <div class="cta-row">${cta}<button class="btn big" type="button" data-act="fwintro" data-fw="${fw}">${F.name} intro</button></div></div>
      ${profileHtml()}
    </section>
    <div class="section-h"><h2>${F.name} levels</h2>
      <div class="fwswitch fwc-${fw}" role="group" aria-label="Framework">${['pearls','gas'].map(k => `<button type="button" data-act="setfw" data-fw="${k}" aria-pressed="${fw===k}">${FW[k].name}</button>`).join('')}</div></div>
    ${levelTrack(fw)}
    <div class="cases">${cards}</div>
    <div class="section-h"><h2>Practice</h2><span class="muted">Quick drills between levels</span></div>
    <div class="practice">
      <div class="sprint ${isDemo() ? 'locked' : ''}"><p class="eyebrow" style="color:#fff;opacity:.8">Strategy Sprint · 2 minutes</p><h3>Match the moment to the move</h3>
        <p>Ten moments from real debriefs. Pick self-assessment, advocacy-inquiry, directive teaching, a circular question or systems inquiry. Fast answers score more.</p>
        <button class="btn big" type="button" data-act="sprint">${isDemo() ? `${lockSvg} Register to play` : 'Start a sprint'}</button></div>
      <div class="miniscore"><span class="eyebrow">Your sprints</span><b>${bestN === null ? '–' : bestN + '/10'}</b><span class="muted">${dr.length ? `best of ${dr.length} sprint${dr.length > 1 ? 's' : ''}` : 'No sprints yet'}</span><span class="muted" style="font-size:14px">Match 8 or more to earn the Strategy Sprinter badge.</span></div>
    </div>
    <div class="section-h"><h2>Micro-skill badges</h2><span class="muted">Earned through consistent strong choices</span></div>
    <div class="badges">${badges}</div>
    <div class="section-h"><h2>How to play</h2>${ownerView ? `<label class="toggle"><input type="checkbox" id="preview" ${store.preview?'checked':''}> Educator preview: unlock all</label>` : ''}</div>
    <div class="ref">
      <div><span class="n" style="color:var(--v-ps)">●</span><b>Four vitals</b><p>Safety, strategy fit, depth and load, scored on every move like a patient monitor.</p></div>
      <div><span class="n">●</span><b>The room</b><p>Each learner's mood rises or falls with your words. A distressed learner stops learning.</p></div>
      <div><span class="n" style="color:var(--v-ld)">●</span><b>Instinct</b><p>Three per level. Get a hint and strike out one weak option, for half the XP.</p></div>
      <div><span class="n" style="color:var(--v-cl)">●</span><b>Combo and clock</b><p>Chain strong moves for up to ×2 XP. Minutes over budget cost load points.</p></div>
      <div><span class="n" style="color:var(--v-sf)">●</span><b>Stars and gates</b><p>60+ one star, 75+ two, 90+ three. Score ${UNLOCK_AT}+ to open the next level.</p></div>
    </div>
    <div class="section-h"><h2>Pocket card</h2><span class="muted">The ${F.name} structure every level follows</span></div>
    <div class="ref">${pocket.map(p => `<div><span class="n">${p[0]}</span><b>${p[1]}</b><p>${p[2]}</p></div>`).join('')}</div>
    <p class="ref-note">${fw === 'gas' ? 'Structure from the GAS debriefing model (WISER and the American Heart Association).' : 'Structure adapted from Bajaj K, Meguerdichian M, Thoma B, Huang S, Eppich W, Cheng A. The PEARLS Healthcare Debriefing Tool. Acad Med. 2018.'} Micro-skills informed by The Debriefing Academy InfoQuips.</p>
    <div class="section-h"><h2>Micro-skills in play</h2></div>
    <div class="skills">${['Basic assumption','Validation','Normalization','Power of silence','Open body language','Mirroring','Flattening hierarchy','Circular questions','Advocacy-inquiry','Guided team self-correction','Systems-focused inquiry','Peer coaching','Respectful interruption','Whiteboard parking lot','Targeted video clips','Managing cognitive load','Behavioural commitments','Applying insights to practice'].map(s=>`<span>${s}</span>`).join('')}</div>
    <div class="section-h"><h2></h2>
      ${isDemo() ? '' : state.confirmReset
        ? `<span class="muted">Erase all scores, XP and badges for this account? <button class="btn" type="button" data-act="reset-yes">Erase</button> <button class="btn ghost" type="button" data-act="reset-no">Keep</button></span>`
        : `<button class="btn ghost" type="button" data-act="reset">Reset my progress</button>`}</div></div>`;
}

let toastT = null;
function toast(msg){ document.querySelectorAll('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); t.textContent = msg; document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 4200); announce(msg); }

/* Lines for the voice bank (called from enumerateSpeech). */
function platformSpeech(add){
  Object.entries(PSAY).forEach(([k, v]) => { if(typeof v === 'string') add('platform', 'coach', v); });
  for(let n = 0; n <= 10; n++) add('platform', 'coach', PSAY.sprintEnd(n));
  DRILL.forEach(d => { add('platform', 'coach', d.cue); add('platform', 'coach', d.why); });
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act;
  if(a === 'auth'){ clearFx(); state.screen = 'auth'; state.authTab = b.dataset.tab || 'start'; sfx('click'); render(); window.scrollTo({ top:0 }); const f = $('form input'); if(f) f.focus({ preventScroll:true }); }
  else if(a === 'demo'){ enterDemo(); sfx('whoosh'); render(); window.scrollTo({ top:0 }); loadBank('platform'); sayAll([PSAY.choose]); }
  else if(a === 'hello'){ loadBank('platform'); sayAll([PSAY.hello]); }
  else if(a === 'logout') logout();
  else if(a === 'setfw'){ const fw = b.dataset.fw; clearFx(); store.fw = fw; save(); state.screen = 'home'; sfx('whoosh'); render(); window.scrollTo({ top:0 }); if(!store.seenTour){ tourAuto = true; showTour(0); } }
  else if(a === 'fwintro'){ clearFx(); state.introFw = b.dataset.fw; state.screen = 'fwintro'; sfx('whoosh'); render(); window.scrollTo({ top:0 }); loadBank('platform');
    sayAll([state.introFw === 'gas' ? PSAY.g1 : PSAY.p1]); }
  else if(a === 'hearintro') narrateIntro(state.introFw);
  else if(a === 'fwpick'){ clearFx(); state.screen = 'fw'; render(); window.scrollTo({ top:0 }); }
  else if(a === 'sprint') startSprint();
  else if(a === 'sans') answerSprint(b.dataset.k);
  else if(a === 'snext') nextSprint();
  else if(a === 'send') sendResults();
  else if(a === 'skin') toggleSkinPop();
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if(!f) return;
  e.preventDefault();
  const btn = f.querySelector('button[type="submit"]'); if(btn) btn.disabled = true;
  (f.dataset.form === 'register' ? doRegister(f) : doLogin(f)).finally(() => { if(btn && document.body.contains(btn)) btn.disabled = false; });
});
document.addEventListener('change', e => { if(e.target.id === 'importFile' && e.target.files[0]){ importProgress(e.target.files[0]); e.target.value = ''; } });
document.addEventListener('play', e => { if(e.target.id === 'pvid'){ playToken++; stopSpeech(); } }, true);
document.addEventListener('keydown', e => {
  if(state.screen !== 'drill' || e.metaKey || e.ctrlKey || e.altKey) return;
  const d = state.drill; if(!d || d.done) return;
  if(!d.locked && /^[1-5]$/.test(e.key)){ e.preventDefault(); answerSprint(STRATS[+e.key - 1].k); }
  else if(d.locked && e.key === 'Enter'){ e.preventDefault(); nextSprint(); }
});

/* ---------- boot ---------- */
function start(data){
  const ses = lsGet(SES_KEY);
  if(data && data.session){ session = data.session; if(session.mode === 'user'){ const acc = accounts().users[session.id]; if(acc) enterUser(acc); else session = null; } else if(data.demoStore){ store = Object.assign(blankStore(), data.demoStore); } }
  else if(ses && ses.id){ const acc = accounts().users[ses.id]; if(acc) enterUser(acc); }
  if(data && data.state && data.state.screen && session){ state = Object.assign(freshRun(), data.state, { anim:null, choosing:false }); if(state.screen === 'drill') state.screen = homeScreen(); }
  else state.screen = homeScreen();
  render();
}
window.claude?.hot?.snapshot?.(() => ({ state, session, demoStore: session && session.mode === 'demo' ? store : null }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
(async () => {
  try{
    const u = window.claude && window.claude.use ? await window.claude.use('user') : null;
    if(u && await u.isOwner()){ ownerView = true; if(state.screen !== 'play') render(); else renderTools(); }
  }catch(e){}
})();
